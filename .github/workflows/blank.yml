name: Continuous Persistent VPS

on:
  workflow_dispatch:

concurrency:
  group: vps-session
  cancel-in-progress: false

env:
  RCLONE_CONFIG_GDRIVE_TYPE: drive
  RCLONE_CONFIG_GDRIVE_SCOPE: drive
  RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.RCLONE_DRIVE_TOKEN }}

  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

  TZ: Asia/Kolkata

jobs:
  vps-session:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repo
        uses: actions/checkout@v4


      # ============================================================
      # 2. TELEGRAM - WORKFLOW START
      # ============================================================

      - name: Notify - workflow started
        run: |
          NOW=$(date '+%I:%M:%S %p')

          curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode \
            "text=${NOW} : 🚀 Sir, your VPS workflow has started. Setup is in progress, please wait." \
            > /dev/null || true


      # ============================================================
      # 3. HOSTNAME
      # ============================================================

      - name: Set hostname to biralo
        run: |
          sudo hostnamectl set-hostname biralo


      # ============================================================
      # 4. PREREQUISITES + RCLONE
      # ============================================================

      - name: Install prerequisites + rclone
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            tmate \
            curl \
            unzip \
            sudo \
            net-tools \
            neofetch \
            iproute2 \
            xxd \
            openssh-server \
            jq \
            util-linux

          curl https://rclone.org/install.sh | sudo bash

          echo "rclone version:"
          rclone version | head -3


      # ============================================================
      # 5. TAILSCALE
      # ============================================================

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh


      # ============================================================
      # 6. RESTORE TAILSCALE STATE
      # ============================================================

      - name: Restore Tailscale state from Drive
        run: |
          mkdir -p ./restore

          if rclone lsf gdrive: --files-only | grep -Fxq "tailscale-state.tar.gz"; then

            NOW=$(date '+%I:%M:%S %p')

            curl -s -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              --data-urlencode \
              "text=${NOW} : 🔄 Tailscale previous state found. Restoring it now..." \
              > /dev/null || true

            rclone copyto \
              "gdrive:tailscale-state.tar.gz" \
              "./restore/tailscale-state.tar.gz" \
              --progress

            sudo mkdir -p /var/lib/tailscale

            sudo tar \
              -xzf ./restore/tailscale-state.tar.gz \
              -C /var/lib/tailscale/

            sudo chmod 600 \
              /var/lib/tailscale/tailscaled.state \
              2>/dev/null || true

            NOW=$(date '+%I:%M:%S %p')

            curl -s -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              --data-urlencode \
              "text=${NOW} : ✅ Tailscale state restored successfully." \
              > /dev/null || true

          else

            echo "No previous Tailscale state found."

            NOW=$(date '+%I:%M:%S %p')

            curl -s -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              --data-urlencode \
              "text=${NOW} : ℹ️ No previous Tailscale state found. A new state will be created." \
              > /dev/null || true

          fi


      # ============================================================
      # 7. START TAILSCALE
      # ============================================================

      - name: Start Tailscale
        run: |
          sudo tailscaled &

          sleep 8

          sudo tailscale up \
            --authkey "${{ secrets.TAILSCALE_AUTHKEY }}" \
            --hostname=biralo \
            --ssh

          echo "Tailscale IP:"
          tailscale ip -4


      # ============================================================
      # 8. CREATE USER
      # ============================================================

      - name: Create user biralo
        run: |
          if ! id -u biralo >/dev/null 2>&1; then

            sudo useradd \
              -m \
              -s /bin/bash \
              biralo

            echo "biralo:biralo" | sudo chpasswd

            sudo usermod -aG sudo biralo

            echo "biralo ALL=(ALL) NOPASSWD:ALL" \
              | sudo tee /etc/sudoers.d/biralo

          fi


      # ============================================================
      # 9. SSH
      # ============================================================

      - name: Start SSH server
        run: |
          sudo sed -i \
            's/^#\?PasswordAuthentication.*/PasswordAuthentication yes/' \
            /etc/ssh/sshd_config

          sudo sed -i \
            's/^#\?PermitRootLogin.*/PermitRootLogin no/' \
            /etc/ssh/sshd_config

          sudo systemctl enable ssh
          sudo systemctl restart ssh

          sudo systemctl status ssh --no-pager || true

          echo "SSH server is running."


      # ============================================================
      # 10. NETWORK FIX
      # ============================================================

      - name: Fix networking for Tailscale + Docker
        run: |
          echo "Enabling IP forwarding..."

          sudo sysctl -w net.ipv4.ip_forward=1

          echo "Setting rp_filter to loose mode..."

          sudo sysctl -w net.ipv4.conf.all.rp_filter=2
          sudo sysctl -w net.ipv4.conf.default.rp_filter=2

          for iface in /proc/sys/net/ipv4/conf/*/rp_filter; do
            echo 2 | sudo tee "$iface" > /dev/null || true
          done

          echo "Checking UFW..."

          if sudo ufw status | grep -q "Status: active"; then

            sudo ufw allow 3389/tcp
            sudo ufw allow 3389/udp
            sudo ufw allow 8006/tcp

          fi

          echo "Networking fix complete."


      # ============================================================
      # 11. FREE SPACE
      # ============================================================

      - name: Free up disk space
        run: |
          echo "Disk before cleanup:"
          df -h /

          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache \
            2>/dev/null || true

          sudo apt-get clean

          docker image prune --all --force \
            2>/dev/null || true

          echo "Disk after cleanup:"
          df -h /


      # ============================================================
      # 12. RESOURCE CHECK
      # ============================================================

      - name: Check available resources
        run: |
          echo "Disk:"
          df -h /

          echo
          echo "Memory:"
          free -h

          echo
          echo "CPU:"
          nproc


      # ============================================================
      # 13. CHECK WINDOWS BACKUP
      # ============================================================

      - name: Check Google Drive and restore Windows
        run: |

          mkdir -p ./restore

          if rclone lsf gdrive: --files-only | grep -Fxq "windows-backup.tar.gz"; then

            echo "Backup found."

            echo "WINDOWS_MODE=restore" >> "$GITHUB_ENV"

            NOW=$(date '+%I:%M:%S %p')

            curl -s -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              --data-urlencode \
              "text=${NOW} : 📦 Previous Windows backup found on Google Drive." \
              > /dev/null || true

            NOW=$(date '+%I:%M:%S %p')

            curl -s -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              --data-urlencode \
              "text=${NOW} : ⬇️ Your backup is loading now. Please wait..." \
              > /dev/null || true

            # ------------------------------------------------------
            # Restore backup with progress
            # ------------------------------------------------------

            LOGFILE=/tmp/restore-progress.log
            rm -f "$LOGFILE"

            rclone copyto \
              "gdrive:windows-backup.tar.gz" \
              "./restore/windows-backup.tar.gz" \
              --stats 5s \
              --stats-one-line \
              --stats-log-level NOTICE \
              > "$LOGFILE" 2>&1 &

            RCLONE_PID=$!

            LAST_PERCENT=0

            while kill -0 "$RCLONE_PID" 2>/dev/null; do

              sleep 5

              LAST_LINE=$(tail -n 20 "$LOGFILE" 2>/dev/null | grep '%' | tail -1 || true)

              PCT=$(echo "$LAST_LINE" \
                | grep -oE '[0-9]+%' \
                | tail -1 \
                | tr -d '%' || true)

              ETA=$(echo "$LAST_LINE" \
                | grep -oE 'ETA [^,]+' \
                | tail -1 || true)

              if [[ "$PCT" =~ ^[0-9]+$ ]]; then

                MILESTONE=$((PCT / 10 * 10))

                if [ "$MILESTONE" -ge 10 ] &&
                   [ "$MILESTONE" -le 100 ] &&
                   [ "$MILESTONE" -gt "$LAST_PERCENT" ]; then

                  NOW=$(date '+%I:%M:%S %p')

                  if [ -n "$ETA" ]; then
                    MESSAGE="${NOW} : ⬇️ Backup loading: ${MILESTONE}% complete — ${ETA} remaining."
                  else
                    MESSAGE="${NOW} : ⬇️ Backup loading: ${MILESTONE}% complete."
                  fi

                  curl -s -X POST \
                    "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                    -d chat_id="${TELEGRAM_CHAT_ID}" \
                    --data-urlencode \
                    "text=${MESSAGE}" \
                    > /dev/null || true

                  LAST_PERCENT=$MILESTONE

                fi
              fi

            done

            wait "$RCLONE_PID"
            RCLONE_RC=$?

            if [ "$RCLONE_RC" -ne 0 ]; then
              echo "Backup download failed."

              NOW=$(date '+%I:%M:%S %p')

              curl -s -X POST \
                "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                -d chat_id="${TELEGRAM_CHAT_ID}" \
                --data-urlencode \
                "text=${NOW} : ❌ Windows backup could not be downloaded from Google Drive." \
                > /dev/null || true

              exit 1
            fi

            rm -f "$LOGFILE"

            echo "Extracting Windows backup..."

            sudo rm -rf /opt/windows
            sudo mkdir -p /opt/windows

            sudo tar \
              -xzf ./restore/windows-backup.tar.gz \
              -C /opt/

            NOW=$(date '+%I:%M:%S %p')

            curl -s -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              --data-urlencode \
              "text=${NOW} : 📦 Backup has been extracted successfully. Windows is starting now..." \
              > /dev/null || true

          else

            echo "No Windows backup found."

            echo "WINDOWS_MODE=fresh" >> "$GITHUB_ENV"

            NOW=$(date '+%I:%M:%S %p')

            curl -s -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              --data-urlencode \
              "text=${NOW} : ⚠️ No previous Windows backup was found." \
              > /dev/null || true

            NOW=$(date '+%I:%M:%S %p')

            curl -s -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              --data-urlencode \
              "text=${NOW} : 🪟 Windows installation is starting now. I will keep sending installation progress." \
              > /dev/null || true

          fi


      # ============================================================
      # 14. PULL WINDOWS IMAGE
      # ============================================================

      - name: Pull Windows image
        run: |
          docker pull ghcr.io/dockur/windows


      # ============================================================
      # 15. START WINDOWS
      # ============================================================

      - name: Start Windows
        run: |

          docker rm -f windows 2>/dev/null || true

          docker run -d \
            --name windows \
            -e VERSION="11" \
            -e USERNAME="admin" \
            -e PASSWORD="Shrey222136" \
            -e RAM_SIZE="10G" \
            -e CPU_CORES="4" \
            -e DISK_SIZE="60G" \
            -p 3389:3389/tcp \
            -p 3389:3389/udp \
            -p 8006:8006 \
            -v /opt/windows:/storage \
            --device=/dev/kvm \
            --cap-add NET_ADMIN \
            ghcr.io/dockur/windows

          echo "Windows container started."


      # ============================================================
      # 16. WAIT FOR RDP + WINDOWS INSTALL PROGRESS
      # ============================================================

      - name: Wait for RDP and Windows installation
        run: |

          READY=0
          INSTALL_LAST_PERCENT=0
          INSTALL_100_SENT=0

          echo "Waiting for Windows..."

          for i in $(seq 1 210); do

            # ------------------------------------------------------
            # Fresh install progress from Dockur logs
            # ------------------------------------------------------

            if [ "${WINDOWS_MODE:-fresh}" = "fresh" ]; then

              LOGS=$(sudo docker logs windows 2>&1 | tail -n 120 || true)

              LAST_PROGRESS_LINE=$(printf '%s\n' "$LOGS" \
                | grep -E '[0-9]{1,3}%.*(ETA|[0-9]+[smh])' \
                | tail -1 || true)

              PCT=$(printf '%s\n' "$LAST_PROGRESS_LINE" \
                | grep -oE '[0-9]{1,3}%' \
                | tail -1 \
                | tr -d '%' || true)

              ETA=$(printf '%s\n' "$LAST_PROGRESS_LINE" \
                | grep -oE 'ETA [^[:space:]]+' \
                | tail -1 || true)

              if [[ "$PCT" =~ ^[0-9]+$ ]]; then

                MILESTONE=$((PCT / 10 * 10))

                if [ "$MILESTONE" -ge 10 ] &&
                   [ "$MILESTONE" -le 90 ] &&
                   [ "$MILESTONE" -gt "$INSTALL_LAST_PERCENT" ]; then

                  NOW=$(date '+%I:%M:%S %p')

                  if [ -n "$ETA" ]; then
                    MESSAGE="${NOW} : 🪟 Windows installation/download is ${MILESTONE}% complete — ETA ${ETA}."
                  else
                    MESSAGE="${NOW} : 🪟 Windows installation/download is ${MILESTONE}% complete."
                  fi

                  curl -s -X POST \
                    "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                    -d chat_id="${TELEGRAM_CHAT_ID}" \
                    --data-urlencode \
                    "text=${MESSAGE}" \
                    > /dev/null || true

                  INSTALL_LAST_PERCENT=$MILESTONE

                fi

                if [ "$PCT" -ge 100 ] &&
                   [ "$INSTALL_100_SENT" -eq 0 ]; then

                  NOW=$(date '+%I:%M:%S %p')

                  curl -s -X POST \
                    "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                    -d chat_id="${TELEGRAM_CHAT_ID}" \
                    --data-urlencode \
                    "text=${NOW} : 🪟 Windows files have reached 100%. Windows setup is continuing now..." \
                    > /dev/null || true

                  INSTALL_100_SENT=1
                fi

              fi

            fi


            # ------------------------------------------------------
            # Real RDP protocol check
            # ------------------------------------------------------

            RESPONSE=$(timeout 3 bash -c '
              exec 3<>/dev/tcp/127.0.0.1/3389
              printf "\x03\x00\x00\x13\x0e\xe0\x00\x00\x00\x00\x00\x01\x00\x08\x00\x03\x00\x00\x00" >&3
              head -c 4 <&3 | xxd -p
            ' 2>/dev/null || true)


            if [ -n "$RESPONSE" ]; then
              READY=1
              break
            fi

            sleep 10

          done


          TS_IP=$(tailscale ip -4 2>/dev/null || echo "not available")


          if [ "$READY" = "1" ]; then

            echo "RDP is ready."

            NOW=$(date '+%I:%M:%S %p')

            curl -s -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              --data-urlencode \
              "text=${NOW} : 🖥️ Sir, your RDP is ready! You can connect now. Tailscale IP: ${TS_IP}" \
              > /dev/null || true

          else

            NOW=$(date '+%I:%M:%S %p')

            curl -s -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              --data-urlencode \
              "text=${NOW} : ⚠️ RDP has not become ready within 35 minutes. Tailscale IP: ${TS_IP}" \
              > /dev/null || true

            sudo docker logs windows --tail 80 || true

          fi


      # ============================================================
      # 17. CONNECTION DETAILS
      # ============================================================

      - name: Show connection details
        run: |
          echo "Tailscale IP:"
          tailscale ip -4 || echo "not found"


      # ============================================================
      # 18. KEEP ALIVE + BACKUPS + RDP MONITOR
      # ============================================================

      - name: Keep alive with periodic backups
        run: |

          BACKUP_INTERVAL=2100
          TOTAL_SECONDS=19500

          LOCKFILE=/tmp/backup.lock

          notify_telegram() {

            MSG="$1"
            NOW=$(date '+%I:%M:%S %p')

            if [ -n "$TELEGRAM_BOT_TOKEN" ] &&
               [ -n "$TELEGRAM_CHAT_ID" ]; then

              curl -s -X POST \
                "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                -d chat_id="${TELEGRAM_CHAT_ID}" \
                --data-urlencode \
                "text=${NOW} : ${MSG}" \
                > /dev/null || true

            fi
          }


          # ========================================================
          # RCLONE UPLOAD WITH TELEGRAM PROGRESS
          # ========================================================

          upload_with_progress() {

            LOCAL_FILE="$1"
            REMOTE_NAME="$2"

            LOGFILE="/tmp/rclone-upload-${REMOTE_NAME}.log"

            rm -f "$LOGFILE"

            rclone copyto \
              "$LOCAL_FILE" \
              "gdrive:$REMOTE_NAME" \
              --ignore-times \
              --stats 5s \
              --stats-one-line \
              --stats-log-level NOTICE \
              --retries 5 \
              --low-level-retries 10 \
              --retries-sleep 5s \
              > "$LOGFILE" 2>&1 &

            RCLONE_PID=$!

            LAST_PERCENT=0

            while kill -0 "$RCLONE_PID" 2>/dev/null; do

              sleep 5

              LAST_LINE=$(tail -n 20 "$LOGFILE" 2>/dev/null \
                | grep '%' \
                | tail -1 || true)

              PCT=$(echo "$LAST_LINE" \
                | grep -oE '[0-9]+%' \
                | tail -1 \
                | tr -d '%' || true)

              ETA=$(echo "$LAST_LINE" \
                | grep -oE 'ETA [^,]+' \
                | tail -1 || true)

              if [[ "$PCT" =~ ^[0-9]+$ ]]; then

                MILESTONE=$((PCT / 10 * 10))

                if [ "$MILESTONE" -ge 10 ] &&
                   [ "$MILESTONE" -le 90 ] &&
                   [ "$MILESTONE" -gt "$LAST_PERCENT" ]; then

                  if [ -n "$ETA" ]; then

                    notify_telegram \
                      "⬆️ Backup upload ${MILESTONE}% complete — ${ETA} remaining."

                  else

                    notify_telegram \
                      "⬆️ Backup upload ${MILESTONE}% complete."

                  fi

                  LAST_PERCENT=$MILESTONE

                fi

              fi

            done

            wait "$RCLONE_PID"
            RC=$?

            rm -f "$LOGFILE"

            return "$RC"
          }


          # ========================================================
          # VERIFY GOOGLE DRIVE FILE
          # ========================================================

          get_remote_size() {

            REMOTE_NAME="$1"

            rclone lsjson \
              "gdrive:" \
              --files-only \
              --max-depth 1 \
              2>/dev/null \
              | jq -r \
                --arg NAME "$REMOTE_NAME" \
                '[.[] | select(.Name == $NAME) | .Size] | if length > 0 then .[0] else 0 end'

          }


          # ========================================================
          # UPLOAD + VERIFY
          # ========================================================

          upload_and_verify() {

            LOCAL_FILE="$1"
            REMOTE_NAME="$2"
            SHOW_PROGRESS="${3:-no}"

            if [ ! -f "$LOCAL_FILE" ]; then

              echo "Local file missing: $LOCAL_FILE"

              return 1

            fi

            LOCAL_SIZE=$(stat -c%s "$LOCAL_FILE" 2>/dev/null || echo 0)

            echo "Local size: $LOCAL_SIZE bytes"

            ATTEMPT=1
            MAX_ATTEMPTS=3

            while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do

              echo "Upload attempt $ATTEMPT/$MAX_ATTEMPTS"

              if [ "$SHOW_PROGRESS" = "yes" ]; then

                if ! upload_with_progress \
                  "$LOCAL_FILE" \
                  "$REMOTE_NAME"; then

                  echo "rclone upload failed."

                  ATTEMPT=$((ATTEMPT + 1))
                  sleep 5
                  continue

                fi

              else

                if ! rclone copyto \
                  "$LOCAL_FILE" \
                  "gdrive:$REMOTE_NAME" \
                  --ignore-times \
                  --progress \
                  --retries 5 \
                  --low-level-retries 10 \
                  --retries-sleep 5s; then

                  echo "rclone upload failed."

                  ATTEMPT=$((ATTEMPT + 1))
                  sleep 5
                  continue

                fi

              fi


              REMOTE_SIZE=$(get_remote_size "$REMOTE_NAME")

              echo "Local size : $LOCAL_SIZE"
              echo "Drive size : $REMOTE_SIZE"


              if [ "$REMOTE_SIZE" = "$LOCAL_SIZE" ]; then

                echo "Verified successfully."

                return 0

              fi


              echo "Size mismatch. Retrying..."

              ATTEMPT=$((ATTEMPT + 1))

              sleep 10

            done


            echo "Upload verification failed."

            return 1
          }


          # ========================================================
          # BACKUP FUNCTION
          # ========================================================

          backup_now() {

            REASON="$1"

            notify_telegram \
              "🔄 Backup is being taken now. Reason: ${REASON}. Please wait..."


            OK=1


            # ------------------------------------------------------
            # WINDOWS BACKUP
            # ------------------------------------------------------

            if [ -d /opt/windows ] &&
               [ "$(ls -A /opt/windows 2>/dev/null)" ]; then

              echo "Pausing Windows..."

              sudo docker pause windows \
                2>/dev/null || true


              rm -f ~/windows-backup.tar.gz


              echo "Creating Windows backup..."

              if ! sudo tar \
                --sparse \
                -czf ~/windows-backup.tar.gz \
                -C /opt windows; then

                echo "Windows tar failed."

                OK=0

              fi


              sudo docker unpause windows \
                2>/dev/null || true


              sudo chown \
                "$USER:$USER" \
                ~/windows-backup.tar.gz \
                2>/dev/null || true


              if [ "$OK" = "1" ]; then

                if ! upload_and_verify \
                  ~/windows-backup.tar.gz \
                  windows-backup.tar.gz \
                  yes; then

                  OK=0

                fi

              fi

            fi


            # ------------------------------------------------------
            # TAILSCALE BACKUP
            # ------------------------------------------------------

            if [ -f /var/lib/tailscale/tailscaled.state ]; then

              sudo mkdir -p /tmp/ts-state

              sudo cp \
                /var/lib/tailscale/tailscaled.state \
                /tmp/ts-state/ \
                2>/dev/null || true


              rm -f ~/tailscale-state.tar.gz


              if sudo tar \
                --sparse \
                -czf ~/tailscale-state.tar.gz \
                -C /tmp/ts-state .; then

                sudo chown \
                  "$USER:$USER" \
                  ~/tailscale-state.tar.gz \
                  2>/dev/null || true

                if ! upload_and_verify \
                  ~/tailscale-state.tar.gz \
                  tailscale-state.tar.gz \
                  no; then

                  OK=0

                fi

              else

                OK=0

              fi

            fi


            rclone cleanup gdrive: \
              2>/dev/null || true


            # ------------------------------------------------------
            # FINAL MESSAGE
            # ------------------------------------------------------

            if [ "$OK" = "1" ]; then

              notify_telegram \
                "✅ Backup completed and verified successfully."

              return 0

            else

              notify_telegram \
                "⚠️ Backup could not be fully verified. The next cycle will retry automatically."

              return 1

            fi
          }


          # ========================================================
          # SAFE BACKUP LOCK
          # ========================================================

          run_backup_safely() {

            REASON="$1"

            exec 9>"$LOCKFILE"

            if flock -n 9; then

              echo "Backup started: $REASON"

              backup_now "$REASON"

              RC=$?

              flock -u 9

              return "$RC"

            else

              echo "Backup already running. Skipping: $REASON"

              return 0

            fi
          }


          # ========================================================
          # VPS READY
          # ========================================================

          notify_telegram \
            "🟢 VPS is fully ready. Automatic backup runs every 35 minutes and after every RDP disconnect."


          # ========================================================
          # TIMER LOOP
          # ========================================================

          (
            ELAPSED=0

            while [ "$ELAPSED" -lt "$TOTAL_SECONDS" ]; do

              REMAINING=$((TOTAL_SECONDS - ELAPSED))

              if [ "$REMAINING" -lt "$BACKUP_INTERVAL" ]; then
                SLEEP_NOW="$REMAINING"
              else
                SLEEP_NOW="$BACKUP_INTERVAL"
              fi

              sleep "$SLEEP_NOW"

              ELAPSED=$((ELAPSED + SLEEP_NOW))

              run_backup_safely \
                "35-minute automatic backup"

            done

          ) &

          TIMER_PID=$!


          # ========================================================
          # RDP CONNECT / DISCONNECT MONITOR
          # ========================================================

          (
            WAS_CONNECTED=0
            NOW_SECONDS=0

            while [ "$NOW_SECONDS" -lt "$TOTAL_SECONDS" ]; do

              sleep 10

              NOW_SECONDS=$((NOW_SECONDS + 10))


              ACTIVE=$(
                sudo ss \
                  -Htn \
                  state established \
                  '( sport = :3389 or dport = :3389 )' \
                  2>/dev/null \
                  | wc -l
              )


              if [ "$ACTIVE" -gt 0 ] &&
                 [ "$WAS_CONNECTED" -eq 0 ]; then

                WAS_CONNECTED=1

                notify_telegram \
                  "🟢 RDP connected. Enjoy your Windows VPS."


              elif [ "$ACTIVE" -eq 0 ] &&
                   [ "$WAS_CONNECTED" -eq 1 ]; then

                WAS_CONNECTED=0

                notify_telegram \
                  "👋 RDP disconnected."


                notify_telegram \
                  "🔄 RDP disconnect detected. Emergency backup is being taken now."

                run_backup_safely \
                  "RDP disconnect"

              fi

            done

          ) &

          MONITOR_PID=$!


          # ========================================================
          # WAIT
          # ========================================================

          wait "$TIMER_PID" "$MONITOR_PID"


      # ============================================================
      # 19. EMERGENCY BACKUP ON CANCEL / FAILURE
      # ============================================================
      #
      # IMPORTANT:
      # GitHub cancellation is not an unlimited grace period.
      # This step is best-effort.
      # ============================================================

      - name: Emergency backup after cancellation or failure
        if: ${{ cancelled() || failure() }}
        continue-on-error: true
        run: |

          NOW=$(date '+%I:%M:%S %p')

          curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode \
            "text=${NOW} : 🚨 Workflow stopped/cancelled. Emergency backup is being attempted now." \
            > /dev/null || true


          LOCKFILE=/tmp/emergency-backup.lock

          exec 9>"$LOCKFILE"

          if flock -n 9; then

            # Windows backup
            if [ -d /opt/windows ] &&
               [ "$(ls -A /opt/windows 2>/dev/null)" ]; then

              sudo docker pause windows \
                2>/dev/null || true

              rm -f ~/windows-backup.tar.gz

              if sudo tar \
                --sparse \
                -czf ~/windows-backup.tar.gz \
                -C /opt windows; then

                sudo docker unpause windows \
                  2>/dev/null || true

                sudo chown \
                  "$USER:$USER" \
                  ~/windows-backup.tar.gz \
                  2>/dev/null || true


                curl -s -X POST \
                  "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                  -d chat_id="${TELEGRAM_CHAT_ID}" \
                  --data-urlencode \
                  "text=$(date '+%I:%M:%S %p') : ⬆️ Emergency Windows backup upload is starting." \
                  > /dev/null || true


                rclone copyto \
                  ~/windows-backup.tar.gz \
                  gdrive:windows-backup.tar.gz \
                  --ignore-times \
                  --progress \
                  --retries 3 \
                  --low-level-retries 5 \
                  || true

              else

                sudo docker unpause windows \
                  2>/dev/null || true

              fi

            fi


            # Tailscale state
            if [ -f /var/lib/tailscale/tailscaled.state ]; then

              sudo mkdir -p /tmp/ts-state

              sudo cp \
                /var/lib/tailscale/tailscaled.state \
                /tmp/ts-state/ \
                2>/dev/null || true

              rm -f ~/tailscale-state.tar.gz

              sudo tar \
                --sparse \
                -czf ~/tailscale-state.tar.gz \
                -C /tmp/ts-state . \
                2>/dev/null || true

              sudo chown \
                "$USER:$USER" \
                ~/tailscale-state.tar.gz \
                2>/dev/null || true

              rclone copyto \
                ~/tailscale-state.tar.gz \
                gdrive:tailscale-state.tar.gz \
                --ignore-times \
                --progress \
                --retries 3 \
                --low-level-retries 5 \
                || true

            fi


            NOW=$(date '+%I:%M:%S %p')

            curl -s -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              --data-urlencode \
              "text=${NOW} : 🛡️ Emergency backup attempt finished." \
              > /dev/null || true

          else

            NOW=$(date '+%I:%M:%S %p')

            curl -s -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              --data-urlencode \
              "text=${NOW} : ℹ️ Another backup was already running, so the emergency backup was skipped." \
              > /dev/null || true

          fi


      # ============================================================
      # 20. NORMAL FINAL BACKUP
      # ============================================================

      - name: Final backup before normal shutdown
        if: ${{ success() }}
        continue-on-error: true
        run: |

          NOW=$(date '+%I:%M:%S %p')

          curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode \
            "text=${NOW} : 🔄 Session ending. Final backup is being taken now." \
            > /dev/null || true


          if [ -d /opt/windows ] &&
             [ "$(ls -A /opt/windows 2>/dev/null)" ]; then

            sudo docker pause windows \
              2>/dev/null || true

            rm -f ~/windows-backup.tar.gz

            if sudo tar \
              --sparse \
              -czf ~/windows-backup.tar.gz \
              -C /opt windows; then

              sudo docker unpause windows \
                2>/dev/null || true

              sudo chown \
                "$USER:$USER" \
                ~/windows-backup.tar.gz \
                2>/dev/null || true

              rclone copyto \
                ~/windows-backup.tar.gz \
                gdrive:windows-backup.tar.gz \
                --ignore-times \
                --progress \
                --retries 5 \
                --low-level-retries 10 \
                || true

            else

              sudo docker unpause windows \
                2>/dev/null || true

            fi

          fi


          if [ -f /var/lib/tailscale/tailscaled.state ]; then

            sudo mkdir -p /tmp/ts-state

            sudo cp \
              /var/lib/tailscale/tailscaled.state \
              /tmp/ts-state/ \
              2>/dev/null || true

            rm -f ~/tailscale-state.tar.gz

            sudo tar \
              --sparse \
              -czf ~/tailscale-state.tar.gz \
              -C /tmp/ts-state . \
              2>/dev/null || true

            sudo chown \
              "$USER:$USER" \
              ~/tailscale-state.tar.gz \
              2>/dev/null || true

            rclone copyto \
              ~/tailscale-state.tar.gz \
              gdrive:tailscale-state.tar.gz \
              --ignore-times \
              --progress \
              --retries 5 \
              --low-level-retries 10 \
              || true

          fi


          NOW=$(date '+%I:%M:%S %p')

          curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode \
            "text=${NOW} : ✅ Final backup attempt finished." \
            > /dev/null || true


      # ============================================================
      # 21. STOP WINDOWS
      # ============================================================

      - name: Stop Windows cleanly
        if: ${{ always() }}
        continue-on-error: true
        run: |

          NOW=$(date '+%I:%M:%S %p')

          curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode \
            "text=${NOW} : 🛑 Windows VPS is being stopped cleanly." \
            > /dev/null || true


          timeout 60 \
            sudo docker stop windows \
            || true


          sudo docker kill windows \
            2>/dev/null || true


          sleep 5


      # ============================================================
      # 22. FINISHED
      # ============================================================

      - name: Notify - session finished
        if: ${{ success() }}
        run: |

          NOW=$(date '+%I:%M:%S %p')

          curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode \
            "text=${NOW} : ✅ VPS session finished successfully. Final backup was attempted." \
            > /dev/null || true
