name: Continuous Persistent VPS

on:
  workflow_dispatch:

concurrency:
  group: vps-session
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

env:
  RCLONE_CONFIG_GDRIVE_TYPE: drive
  RCLONE_CONFIG_GDRIVE_SCOPE: drive
  RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.RCLONE_DRIVE_TOKEN }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  WINDOWS_PASSWORD: ${{ secrets.WINDOWS_PASSWORD }}
  TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
  GH_TOKEN: ${{ github.token }}
  TZ: Asia/Kolkata

jobs:
  vps-session:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Step 1 - Install tools and Telegram
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y curl jq sudo net-tools iproute2 openssh-server util-linux ca-certificates xxd
          curl -fsSL https://rclone.org/install.sh | sudo bash
          test -n "$TELEGRAM_BOT_TOKEN"
          test -n "$TELEGRAM_CHAT_ID"
          test -n "$WINDOWS_PASSWORD"
          test -n "$TAILSCALE_AUTHKEY"
          cat > "$RUNNER_TEMP/telegram.sh" <<'SCRIPT'
          telegram_send() {
            local msg="$*" response='' n
            for n in 1 2 3 4 5; do
              response="$(curl -sS --max-time 20 -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=$(date '+%d-%m-%Y %I:%M:%S %p') : ${msg}" 2>&1 || true)"
              if echo "$response" | jq -e '.ok == true' >/dev/null 2>&1; then return 0; fi
              sleep 2
            done
            echo "Telegram error: $response" >&2
            return 1
          }
          telegram_answer_callback() {
            local id="$1"
            curl -sS --max-time 15 -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/answerCallbackQuery" -d "callback_query_id=${id}" >/dev/null 2>&1 || true
          }
          SCRIPT
          chmod 700 "$RUNNER_TEMP/telegram.sh"
          source "$RUNNER_TEMP/telegram.sh"
          curl -fsS --max-time 20 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getMe" | jq -e '.ok == true' >/dev/null
          curl -fsS --max-time 20 -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/deleteWebhook" -d 'drop_pending_updates=false' | jq -e '.ok == true' >/dev/null
          telegram_send '🚀 VPS workflow started.'
          telegram_send '🧰 Step 1/6 complete: Telegram, Google Drive and required tools are ready.'

      - name: Step 2 - Setup persistent Tailscale
        run: |
          set -Eeuo pipefail
          source "$RUNNER_TEMP/telegram.sh"
          telegram_send '📡 Step 2/6: Installing and restoring Tailscale identity...'
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo systemctl stop tailscaled 2>/dev/null || true
          sudo pkill -x tailscaled 2>/dev/null || true
          TS_WORK="$RUNNER_TEMP/tailscale"
          rm -rf "$TS_WORK"
          mkdir -p "$TS_WORK"
          sudo mkdir -p /var/lib/tailscale
          FOUND=''
          while IFS= read -r p; do
            [ -n "$p" ] || continue
            if rclone lsjson "gdrive:${p}" --stat --no-modtime --no-mimetype > "$TS_WORK/stat.json" 2>/dev/null && jq -e '.Size > 0' "$TS_WORK/stat.json" >/dev/null 2>&1; then FOUND="$p"; break; fi
          done < <(rclone lsf gdrive: --recursive --files-only 2>/dev/null | grep -E '(^|/)tailscale-state\.tar\.gz$' || true)
          if [ -n "$FOUND" ]; then
            telegram_send '🔄 Tailscale backup found. Restoring the old node identity.'
            rclone copyto "gdrive:${FOUND}" "$TS_WORK/state.tar.gz" --retries 5 --low-level-retries 20
            test -s "$TS_WORK/state.tar.gz"
            sudo rm -rf /var/lib/tailscale/*
            sudo tar -xzf "$TS_WORK/state.tar.gz" -C /var/lib/tailscale
            sudo chmod 600 /var/lib/tailscale/tailscaled.state
            RESTORED=1
          else
            telegram_send '🆕 No Tailscale state backup found. This is the first registration.'
            RESTORED=0
          fi
          sudo systemctl enable tailscaled >/dev/null
          sudo systemctl start tailscaled
          IP=''
          for i in $(seq 1 60); do IP="$(tailscale ip -4 2>/dev/null | head -1 || true)"; [[ "$IP" =~ ^100\.[0-9]+\.[0-9]+\.[0-9]+$ ]] && break; sleep 2; done
          if [[ ! "$IP" =~ ^100\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            if [ "$RESTORED" = 1 ]; then telegram_send '❌ Restored Tailscale identity failed. I will not create a new node/IP.'; exit 1; fi
            telegram_send '🔐 First Tailscale authentication is starting.'
            sudo tailscale up --auth-key="$TAILSCALE_AUTHKEY" --hostname=biralo --ssh --timeout=90s
            IP="$(tailscale ip -4 | head -1)"
          else
            sudo tailscale set --hostname=biralo --ssh || true
          fi
          [[ "$IP" =~ ^100\.[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "TAILSCALE_IP=$IP" >> "$GITHUB_ENV"
          telegram_send "🌐 Tailscale online. IP: $IP"
          sudo systemctl stop tailscaled
          sudo tar -czf "$TS_WORK/state.tar.gz" -C /var/lib/tailscale tailscaled.state
          sudo chown "$(id -u):$(id -g)" "$TS_WORK/state.tar.gz"
          sudo systemctl start tailscaled
          TMP="tailscale-state.$(date +%s).tmp.tar.gz"
          rclone copyto "$TS_WORK/state.tar.gz" "gdrive:${TMP}" --ignore-times --retries 5 --low-level-retries 20 --drive-chunk-size 16M
          SIZE="$(rclone lsjson "gdrive:${TMP}" --stat --no-modtime --no-mimetype | jq -r '.Size // 0')"
          [ "$SIZE" -gt 0 ]
          rclone moveto "gdrive:${TMP}" gdrive:tailscale-state.tar.gz --retries 5 --low-level-retries 20
          rm -rf "$TS_WORK"
          telegram_send "💾 Tailscale state backup saved and verified ($SIZE bytes)."
          telegram_send '✅ Step 2/6 complete.'

      - name: Step 3 - Prepare Linux host
        run: |
          set -Eeuo pipefail
          source "$RUNNER_TEMP/telegram.sh"
          telegram_send '🖥️ Step 3/6: Preparing Linux host and networking...'
          sudo hostnamectl set-hostname biralo || true
          if ! id -u biralo >/dev/null 2>&1; then
            sudo useradd -m -s /bin/bash biralo
            echo 'biralo:biralo' | sudo chpasswd
            sudo usermod -aG sudo biralo
            echo 'biralo ALL=(ALL) NOPASSWD:ALL' | sudo tee /etc/sudoers.d/biralo >/dev/null
            sudo chmod 440 /etc/sudoers.d/biralo
          fi
          sudo sed -i 's/^#\?PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/^#\?PermitRootLogin.*/PermitRootLogin no/' /etc/ssh/sshd_config
          sudo systemctl enable ssh >/dev/null
          sudo systemctl restart ssh
          sudo sysctl -w net.ipv4.ip_forward=1 >/dev/null
          sudo sysctl -w net.ipv4.conf.all.rp_filter=2 >/dev/null
          sudo sysctl -w net.ipv4.conf.default.rp_filter=2 >/dev/null
          for f in /proc/sys/net/ipv4/conf/*/rp_filter; do echo 2 | sudo tee "$f" >/dev/null || true; done
          if sudo ufw status 2>/dev/null | grep -q 'Status: active'; then
            sudo ufw allow 3389/tcp >/dev/null || true
            sudo ufw allow 3389/udp >/dev/null || true
            sudo ufw allow 8006/tcp >/dev/null || true
          fi
          telegram_send "🟢 Linux host ready. Tailscale IP: ${TAILSCALE_IP}"
          telegram_send '✅ Step 3/6 complete.'

      - name: Step 4 - Restore Windows storage
        run: |
          set -Eeuo pipefail
          source "$RUNNER_TEMP/telegram.sh"
          telegram_send '💾 Step 4/6: Checking Google Drive for Windows backup...'
          sudo mkdir -p /opt
          FOUND=''
          while IFS= read -r p; do
            [ -n "$p" ] || continue
            if rclone lsjson "gdrive:${p}" --stat --no-modtime --no-mimetype > "$RUNNER_TEMP/win-stat.json" 2>/dev/null && jq -e '.Size > 0' "$RUNNER_TEMP/win-stat.json" >/dev/null 2>&1; then FOUND="$p"; break; fi
          done < <(rclone lsf gdrive: --recursive --files-only 2>/dev/null | grep -E '(^|/)windows-backup\.tar\.gz$' || true)
          if [ -n "$FOUND" ]; then
            telegram_send '📦 Windows backup found. Restoring it from Google Drive...'
            sudo rm -rf /opt/windows
            set +e
            rclone cat "gdrive:${FOUND}" | sudo tar -xzf - -C /opt
            s0=${PIPESTATUS[0]}; s1=${PIPESTATUS[1]}
            set -e
            [ "$s0" -eq 0 ] && [ "$s1" -eq 0 ] && [ -d /opt/windows ]
            telegram_send '✅ Windows backup restored successfully.'
          else
            sudo rm -rf /opt/windows
            sudo mkdir -p /opt/windows
            telegram_send '⚠️ No Windows backup found. Fresh Windows 11 storage will be used.'
          fi
          telegram_send '✅ Step 4/6 complete.'

      - name: Step 5 - Pull Dockur Windows image
        run: |
          set -Eeuo pipefail
          source "$RUNNER_TEMP/telegram.sh"
          telegram_send '📥 Step 5/6: Pulling Dockur Windows image...'
          docker pull ghcr.io/dockur/windows
          telegram_send '✅ Dockur Windows image is ready.'
          telegram_send '✅ Step 5/6 complete.'

      - name: Step 6 - Start Windows, Telegram controls and backup monitor
        run: |
          set -uo pipefail
          source "$RUNNER_TEMP/telegram.sh"
          CONTAINER=windows
          LOCK="$RUNNER_TEMP/windows-backup.lock"
          POLLER_STOP="$RUNNER_TEMP/poller-stop"
          rm -f "$LOCK" "$POLLER_STOP"

          telegram_keyboard() {
            curl -sS --max-time 20 -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=$(date '+%d-%m-%Y %I:%M:%S %p') : 🛑 Stop request received. Choose what to do:" \
              --data-urlencode 'reply_markup={"inline_keyboard":[[{"text":"💾 BACKUP & STOP","callback_data":"backup_stop"}],[{"text":"❌ STOP WITHOUT BACKUP","callback_data":"stop_no_backup"}],[{"text":"📦 BACKUP NOW - KEEP RUNNING","callback_data":"backup_now"}]]}' >/dev/null 2>&1 || true
          }

          backup_tailscale() {
            local tmp="tailscale-state.$(date +%s).tmp.tar.gz"
            local work="$RUNNER_TEMP/ts-backup"
            rm -rf "$work"; mkdir -p "$work"
            telegram_send '📡 Tailscale state backup started.' || true
            sudo systemctl stop tailscaled >/dev/null 2>&1 || true
            if ! sudo test -s /var/lib/tailscale/tailscaled.state; then
              sudo systemctl start tailscaled >/dev/null 2>&1 || true
              telegram_send '❌ Tailscale state file was not available.' || true
              rm -rf "$work"; return 1
            fi
            if ! sudo tar -czf "$work/state.tar.gz" -C /var/lib/tailscale tailscaled.state; then
              sudo systemctl start tailscaled >/dev/null 2>&1 || true
              telegram_send '❌ Tailscale state archive failed.' || true
              rm -rf "$work"; return 1
            fi
            sudo chown "$(id -u):$(id -g)" "$work/state.tar.gz"
            sudo systemctl start tailscaled >/dev/null 2>&1 || true
            if ! rclone copyto "$work/state.tar.gz" "gdrive:${tmp}" --ignore-times --retries 5 --low-level-retries 20 --drive-chunk-size 16M; then
              rclone deletefile "gdrive:${tmp}" >/dev/null 2>&1 || true
              rm -rf "$work"
              telegram_send '❌ Tailscale backup upload failed. Old good Tailscale backup was kept.' || true
              return 1
            fi
            local size; size="$(rclone lsjson "gdrive:${tmp}" --stat --no-modtime --no-mimetype 2>/dev/null | jq -r '.Size // 0' || echo 0)"
            if [ "$size" -le 0 ]; then
              rclone deletefile "gdrive:${tmp}" >/dev/null 2>&1 || true
              rm -rf "$work"
              telegram_send '❌ Tailscale backup verification failed. Old good backup was kept.' || true
              return 1
            fi
            if ! rclone moveto "gdrive:${tmp}" gdrive:tailscale-state.tar.gz --retries 5 --low-level-retries 20; then
              rclone deletefile "gdrive:${tmp}" >/dev/null 2>&1 || true
              rm -rf "$work"
              telegram_send '❌ Tailscale final replace failed. Old good backup was kept.' || true
              return 1
            fi
            rm -rf "$work"
            telegram_send "✅ Tailscale backup uploaded and verified ($size bytes)." || true
            return 0
          }

          backup_windows() {
            local reason="${1:-scheduled}"
            if [ -e "$LOCK" ]; then telegram_send '⏳ Windows backup already running.' || true; return 1; fi
            touch "$LOCK"
            telegram_send "💾 Windows backup started (${reason}). Windows is being paused safely." || true
            docker pause "$CONTAINER" >/dev/null 2>&1 || true
            local tmp="windows-backup.$(date +%s).tmp.tar.gz"
            local log="$RUNNER_TEMP/windows-backup.log"
            : > "$log"
            (
              set -o pipefail
              sudo tar -C /opt --sparse -czf - windows | rclone rcat "gdrive:${tmp}" --retries 5 --low-level-retries 20 --drive-chunk-size 16M
            ) >"$log" 2>&1 &
            local pid=$!
            while kill -0 "$pid" 2>/dev/null; do sleep 15; telegram_send '📤 Windows backup is still uploading to Google Drive...' || true; done
            wait "$pid"; local rc=$?
            if [ "$rc" -ne 0 ]; then
              rclone deletefile "gdrive:${tmp}" >/dev/null 2>&1 || true
              docker unpause "$CONTAINER" >/dev/null 2>&1 || true
              rm -f "$LOCK"
              telegram_send '❌ Windows backup upload failed. Old good backup was NOT replaced.' || true
              tail -20 "$log" || true
              return 1
            fi
            local size; size="$(rclone lsjson "gdrive:${tmp}" --stat --no-modtime --no-mimetype 2>/dev/null | jq -r '.Size // 0' || echo 0)"
            if [ "$size" -le 0 ]; then
              rclone deletefile "gdrive:${tmp}" >/dev/null 2>&1 || true
              docker unpause "$CONTAINER" >/dev/null 2>&1 || true
              rm -f "$LOCK"
              telegram_send '❌ Windows backup verification failed. Old good backup was NOT replaced.' || true
              return 1
            fi
            if ! rclone moveto "gdrive:${tmp}" gdrive:windows-backup.tar.gz --retries 5 --low-level-retries 20; then
              rclone deletefile "gdrive:${tmp}" >/dev/null 2>&1 || true
              docker unpause "$CONTAINER" >/dev/null 2>&1 || true
              rm -f "$LOCK"
              telegram_send '❌ Windows backup final replace failed. Old good backup was kept.' || true
              return 1
            fi
            docker unpause "$CONTAINER" >/dev/null 2>&1 || true
            rm -f "$LOCK"
            telegram_send "✅ Windows backup uploaded and verified ($size bytes). Windows resumed." || true
            return 0
          }

          full_backup() {
            local reason="${1:-manual}"
            telegram_send "🔐 Full backup started (${reason}): Windows + Tailscale." || true
            local w=0 t=0
            backup_windows "$reason" && w=1 || true
            backup_tailscale && t=1 || true
            if [ "$w" -eq 1 ] && [ "$t" -eq 1 ]; then
              telegram_send '✅ Full backup completed: Windows and Tailscale are both safely stored on Google Drive.' || true
              return 0
            fi
            telegram_send '⚠️ Full backup finished with an error. Any failed backup kept the previous good Drive backup.' || true
            return 1
          }

          cancel_run() {
            local why="$1"
            telegram_send "🛑 $why — stopping the Windows container and cancelling this GitHub Actions run." || true
            docker stop -t 120 "$CONTAINER" >/dev/null 2>&1 || true
            curl -sS --max-time 20 -X POST \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/cancel" >/dev/null 2>&1 || true
          }

          telegram_send '🪟 Starting Windows 11 (12 GB RAM, 4 CPU cores, 70 GB disk)...'
          docker run -d --name "$CONTAINER" \
            -e VERSION='11' \
            -e USERNAME='admin' \
            -e PASSWORD="$WINDOWS_PASSWORD" \
            -e RAM_SIZE='12G' \
            -e CPU_CORES='4' \
            -e DISK_SIZE='70G' \
            -p 3389:3389/tcp \
            -p 3389:3389/udp \
            -p 8006:8006 \
            -v /opt/windows:/storage \
            --device=/dev/kvm \
            --device=/dev/net/tun \
            --cap-add NET_ADMIN \
            --stop-timeout 120 \
            ghcr.io/dockur/windows

          telegram_send '⏳ Windows is booting. Waiting for Dockur and RDP...'
          READY=0
          for i in $(seq 1 1800); do
            LOGS="$(docker logs "$CONTAINER" 2>&1 | tail -50 || true)"
            if echo "$LOGS" | grep -qiE 'Windows started successfully|Windows started succesfully'; then
              if timeout 3 bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/3389' 2>/dev/null; then READY=1; break; fi
            fi
            if (( i % 30 == 0 )); then telegram_send '⏳ Windows is still booting; RDP is not ready yet.' || true; fi
            sleep 1
          done
          if [ "$READY" = 1 ]; then telegram_send "🖥️ RDP is READY. Tailscale IP: ${TAILSCALE_IP}"; else telegram_send '❌ Windows/RDP did not become ready within the startup window.'; exit 1; fi
          telegram_send '🎉 Step 6/6 complete. VPS is now running.'
          telegram_keyboard

          OFFSET="$(curl -sS --max-time 20 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getUpdates?limit=100&timeout=1" | jq -r 'if (.result|length)>0 then (.result[-1].update_id + 1) else 0 end' 2>/dev/null || echo 0)"
          telegram_poller() {
            while [ ! -e "$POLLER_STOP" ]; do
              DATA="$(curl -sS --max-time 35 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getUpdates?timeout=25&offset=${OFFSET}" 2>/dev/null || true)"
              if ! echo "$DATA" | jq -e '.ok == true' >/dev/null 2>&1; then sleep 2; continue; fi
              COUNT="$(echo "$DATA" | jq '.result|length')"
              if [ "$COUNT" -gt 0 ]; then
                while IFS= read -r update; do
                  ID="$(echo "$update" | jq -r '.update_id')"
                  OFFSET=$((ID+1))
                  CHAT="$(echo "$update" | jq -r '.message.chat.id // .callback_query.message.chat.id // empty')"
                  [ "$CHAT" = "$TELEGRAM_CHAT_ID" ] || continue
                  TEXT="$(echo "$update" | jq -r '.message.text // empty')"
                  CALLBACK="$(echo "$update" | jq -r '.callback_query.data // empty')"
                  CQID="$(echo "$update" | jq -r '.callback_query.id // empty')"
                  if [ "$TEXT" = "/stop" ] || [ "$TEXT" = "/STOP" ]; then
                    telegram_keyboard
                  elif [ "$CALLBACK" = 'backup_now' ]; then
                    telegram_answer_callback "$CQID"
                    telegram_send '📦 Manual backup requested. Windows + Tailscale backup will run; VPS will keep running.'
                    full_backup 'Telegram BACKUP NOW'
                  elif [ "$CALLBACK" = 'backup_stop' ]; then
                    telegram_answer_callback "$CQID"
                    telegram_send '💾 BACKUP & STOP selected. Taking the final full backup first.'
                    if full_backup 'Telegram BACKUP & STOP'; then
                      cancel_run 'Final backup completed successfully'
                    else
                      telegram_send '⚠️ Final backup failed, so I am NOT cancelling the VPS. Your previous good backup is still protected.'
                    fi
                  elif [ "$CALLBACK" = 'stop_no_backup' ]; then
                    telegram_answer_callback "$CQID"
                    cancel_run 'STOP WITHOUT BACKUP selected'
                  fi
                done < <(echo "$DATA" | jq -c '.result[]')
              fi
            done
          }
          telegram_poller &
          POLLER_PID=$!

          START=$(date +%s)
          NEXT=2100
          LAST_CONNECTED=0
          DISCONNECT_BACKED_UP=0
          while docker inspect "$CONTAINER" >/dev/null 2>&1; do
            sleep 1
            NOW=$(date +%s)
            ELAPSED=$((NOW-START))
            if (( ELAPSED >= NEXT )); then
              telegram_send '⏰ 35 minutes completed. Starting scheduled Windows + Tailscale backup.' || true
              full_backup '35-minute scheduled backup' || true
              NEXT=$((NEXT+2100))
            fi
            CONNECTIONS=$(ss -Htn state established '( sport = :3389 )' 2>/dev/null | wc -l || echo 0)
            if [ "$CONNECTIONS" -gt 0 ]; then
              LAST_CONNECTED=1
              DISCONNECT_BACKED_UP=0
            elif [ "$LAST_CONNECTED" -eq 1 ] && [ "$DISCONNECT_BACKED_UP" -eq 0 ]; then
              DISCONNECT_BACKED_UP=1
              telegram_send '⚠️ RDP client disconnected. Automatic Windows + Tailscale safety backup is starting.' || true
              full_backup 'RDP disconnect safety backup' || true
              telegram_send '🛡️ RDP disconnect safety backup attempt finished.' || true
              LAST_CONNECTED=0
            fi
          done
          touch "$POLLER_STOP"
          kill "$POLLER_PID" 2>/dev/null || true
          wait "$POLLER_PID" 2>/dev/null || true
          docker stop -t 120 "$CONTAINER" >/dev/null 2>&1 || true
          telegram_send '🛑 Windows container stopped. Workflow is ending.' || true
