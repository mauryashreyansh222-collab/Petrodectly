name: Continuous Persistent VPS

on:
  workflow_dispatch:

concurrency:
  group: vps-session
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

env:
  RCLONE_CONFIG_GDRIVE_TYPE: drive
  RCLONE_CONFIG_GDRIVE_SCOPE: drive
  RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.RCLONE_DRIVE_TOKEN }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  GH_TOKEN: ${{ github.token }}
  TZ: Asia/Kolkata

jobs:
  vps-session:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repo
        uses: actions/checkout@v4

      # ============================================================
      # 2. START GLOBAL TELEGRAM BOT
      # ============================================================
      - name: Start Global Telegram Listener
        run: |
          sudo apt-get update && sudo apt-get install -y tmux python3 curl
          
          cat << 'EOF' > /tmp/telegram_listener.py
          import json, os, time, urllib.request, urllib.parse

          BOT_TOKEN = os.environ.get("TELEGRAM_BOT_TOKEN", "")
          CHAT_ID = os.environ.get("TELEGRAM_CHAT_ID", "")
          GH_TOKEN = os.environ.get("GH_TOKEN", "")
          REPO = os.environ.get("GITHUB_REPOSITORY", "")
          RUN_ID = os.environ.get("GITHUB_RUN_ID", "")
          API = f"https://api.telegram.org/bot{BOT_TOKEN}"
          ACTION_FILE = "/tmp/telegram_action"

          def api_call(method, params=None):
              url = f"{API}/{method}"
              data = urllib.parse.urlencode(params or {}).encode() if params else None
              try:
                  with urllib.request.urlopen(url, data=data, timeout=15) as resp: return json.loads(resp.read().decode())
              except Exception: return None

          def send_buttons():
              kb = {"inline_keyboard": [
                  [{"text": "💾 BACKUP & STOP", "callback_data": "backup_stop"}],
                  [{"text": "❌ STOP WITHOUT BACKUP", "callback_data": "stop_nobackup"}]
              ]}
              api_call("sendMessage", {"chat_id": CHAT_ID, "text": "Sir, how would you like to stop?", "reply_markup": json.dumps(kb)})

          def cancel_github_workflow():
              url = f"https://api.github.com/repos/{REPO}/actions/runs/{RUN_ID}/cancel"
              req = urllib.request.Request(url, method="POST")
              req.add_header("Authorization", f"token {GH_TOKEN}")
              req.add_header("Accept", "application/vnd.github+json")
              try:
                  urllib.request.urlopen(req)
              except Exception: pass

          def main():
              api_call("deleteWebhook", {"drop_pending_updates": "true"})
              res = api_call("getUpdates", {"timeout": 1})
              offset = 0
              if res and res.get("ok"):
                  for u in res.get("result", []): offset = max(offset, u["update_id"] + 1)
              while True:
                  res = api_call("getUpdates", {"offset": offset, "timeout": 20})
                  if not res or not res.get("ok"):
                      time.sleep(3)
                      continue
                  for u in res.get("result", []):
                      offset = u["update_id"] + 1
                      msg = u.get("message")
                      if msg and str(msg.get("chat", {}).get("id")) == str(CHAT_ID):
                          if (msg.get("text") or "").strip() == "/stop": send_buttons()
                      cb = u.get("callback_query")
                      if cb and str(cb.get("message", {}).get("chat", {}).get("id")) == str(CHAT_ID):
                          data = cb.get("data", "")
                          if data == "stop_nobackup":
                              api_call("answerCallbackQuery", {"callback_query_id": cb["id"], "text": "Stopping immediately..."})
                              api_call("sendMessage", {"chat_id": CHAT_ID, "text": "🛑 Cancelling workflow immediately without backup."})
                              os.system("touch /tmp/skip_final_backup")
                              cancel_github_workflow()
                          elif data == "backup_stop":
                              if os.path.exists("/tmp/main_loop_started"):
                                  api_call("answerCallbackQuery", {"callback_query_id": cb["id"], "text": "Taking double backup and stopping..."})
                                  with open(ACTION_FILE, "w") as f: f.write(data)
                              else:
                                  api_call("answerCallbackQuery", {"callback_query_id": cb["id"], "text": "Setup running. Stopping without backup."})
                                  api_call("sendMessage", {"chat_id": CHAT_ID, "text": "⚠️ System not fully ready yet. Cancelling immediately without backup."})
                                  os.system("touch /tmp/skip_final_backup")
                                  cancel_github_workflow()
          if __name__ == "__main__": main()
          EOF
          
          tmux new-session -d -s tgbot 'python3 /tmp/telegram_listener.py'
          
          NOW=$(date '+%I:%M:%S %p')
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d chat_id="${TELEGRAM_CHAT_ID}" --data-urlencode "text=${NOW} : 🚀 VPS workflow started. 🤖 Global Telegram Bot is Active! Type /stop anytime." > /dev/null || true

      # ============================================================
      # 3. HOSTNAME & PREREQUISITES
      # ============================================================
      - name: Setup Tools & Rclone
        run: |
          sudo hostnamectl set-hostname biralo
          sudo apt-get install -y tmate unzip net-tools neofetch iproute2 xxd openssh-server jq util-linux zstd
          curl https://rclone.org/install.sh | sudo bash

      # ============================================================
      # 4. TAILSCALE INSTALL + RESTORE
      # ============================================================
      - name: Install & Restore Tailscale
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d chat_id="${TELEGRAM_CHAT_ID}" --data-urlencode "text=$(date '+%I:%M:%S %p') : 📡 Setting up Tailscale VPN..." > /dev/null || true
          curl -fsSL https://tailscale.com/install.sh | sh
          mkdir -p ./restore
          
          FOUND=$(rclone lsf gdrive: --files-only -R 2>/dev/null | grep -E '(^|/)tailscale-state\.tar\.gz$' | head -1 || true)
          if [ -n "$FOUND" ]; then
            echo "TAILSCALE_MODE=restore" >> "$GITHUB_ENV"
            rclone copyto "gdrive:${FOUND}" "./restore/tailscale-state.tar.gz" --progress
            sudo mkdir -p /var/lib/tailscale
            sudo tar -xzf ./restore/tailscale-state.tar.gz -C /var/lib/tailscale/
            sudo chmod 600 /var/lib/tailscale/tailscaled.state 2>/dev/null || true
          else
            echo "TAILSCALE_MODE=fresh" >> "$GITHUB_ENV"
          fi

      # ============================================================
      # 5. START TAILSCALE & WAIT FOR IDENTITY
      # ============================================================
      - name: Start Tailscale
        run: |
          sudo systemctl enable --now tailscaled
          sleep 5
          sudo tailscale up --authkey "${{ secrets.TAILSCALE_AUTHKEY }}" --hostname=biralo --ssh
          sleep 10 
          TS_IP=$(tailscale ip -4 2>/dev/null || echo "not available")
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d chat_id="${TELEGRAM_CHAT_ID}" --data-urlencode "text=$(date '+%I:%M:%S %p') : 🌐 Tailscale Online. IP: ${TS_IP}" > /dev/null || true

      # ============================================================
      # 6. INITIAL TAILSCALE BACKUP
      # ============================================================
      - name: Backup Tailscale identity
        run: |
          if [ "${TAILSCALE_MODE:-fresh}" = "restore" ]; then
            echo "Identity restored, skipping initial backup."
          elif [ -f /var/lib/tailscale/tailscaled.state ]; then
            sudo mkdir -p /tmp/ts-state
            sudo cp /var/lib/tailscale/tailscaled.state /tmp/ts-state/tailscaled.state
            sudo tar -czf ~/tailscale-state.tar.gz -C /tmp/ts-state tailscaled.state
            sudo chown "$USER:$USER" ~/tailscale-state.tar.gz 2>/dev/null || true
            rclone copyto ~/tailscale-state.tar.gz gdrive:tailscale-state.tar.gz --ignore-times --progress
          fi

      # ============================================================
      # 7. LINUX HOST PREP
      # ============================================================
      - name: Host Prep
        run: |
          sudo sysctl -w net.ipv4.ip_forward=1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache 2>/dev/null || true
          sudo apt-get clean
          docker image prune --all --force 2>/dev/null || true

      # ============================================================
      # 8. CHECK GOOGLE DRIVE & RESTORE WINDOWS
      # ============================================================
      - name: Check Google Drive and restore Windows
        run: |
          mkdir -p ./restore
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d chat_id="${TELEGRAM_CHAT_ID}" --data-urlencode "text=$(date '+%I:%M:%S %p') : 💾 Checking for Windows backup..." > /dev/null || true

          FOUND_ZST=$(rclone lsf gdrive: --files-only -R 2>/dev/null | grep -E '(^|/)windows-backup\.tar\.zst$' | head -1 || true)
          FOUND_GZ=$(rclone lsf gdrive: --files-only -R 2>/dev/null | grep -E '(^|/)windows-backup\.tar\.gz$' | head -1 || true)

          if [ -n "$FOUND_ZST" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d chat_id="${TELEGRAM_CHAT_ID}" --data-urlencode "text=$(date '+%I:%M:%S %p') : ⬇️ ZST Backup found. Downloading and extracting..." > /dev/null || true
            rclone copyto "gdrive:${FOUND_ZST}" "./restore/windows-backup.tar.zst" --stats 5s --progress
            sudo rm -rf /opt/windows
            sudo mkdir -p /opt/windows
            sudo tar -I zstd -xf "./restore/windows-backup.tar.zst" -C /opt/
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d chat_id="${TELEGRAM_CHAT_ID}" --data-urlencode "text=$(date '+%I:%M:%S %p') : 📦 Backup extracted successfully." > /dev/null || true

          elif [ -n "$FOUND_GZ" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d chat_id="${TELEGRAM_CHAT_ID}" --data-urlencode "text=$(date '+%I:%M:%S %p') : ⬇️ Old GZ Backup found. Downloading and extracting..." > /dev/null || true
            rclone copyto "gdrive:${FOUND_GZ}" "./restore/windows-backup.tar.gz" --stats 5s --progress
            sudo rm -rf /opt/windows
            sudo mkdir -p /opt/windows
            sudo tar -xzf "./restore/windows-backup.tar.gz" -C /opt/
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d chat_id="${TELEGRAM_CHAT_ID}" --data-urlencode "text=$(date '+%I:%M:%S %p') : 📦 Backup extracted successfully." > /dev/null || true
          else
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d chat_id="${TELEGRAM_CHAT_ID}" --data-urlencode "text=$(date '+%I:%M:%S %p') : 🪟 No backup found. Starting fresh installation." > /dev/null || true
          fi

      # ============================================================
      # 9. PULL WINDOWS IMAGE
      # ============================================================
      - name: Pull Windows image
        run: docker pull ghcr.io/dockur/windows

      # ============================================================
      # 10. START WINDOWS
      # ============================================================
      - name: Start Windows
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d chat_id="${TELEGRAM_CHAT_ID}" --data-urlencode "text=$(date '+%I:%M:%S %p') : 🪟 Starting Windows..." > /dev/null || true
          docker rm -f windows 2>/dev/null || true
          docker run -d --name windows \
            -e VERSION="11" \
            -e USERNAME="admin" \
            -e PASSWORD="${{ secrets.WINDOWS_PASSWORD }}" \
            -e RAM_SIZE="8G" \
            -e CPU_CORES="3" \
            -e DISK_SIZE="60G" \
            -p 3389:3389/tcp \
            -p 3389:3389/udp \
            -v /opt/windows:/storage \
            --device=/dev/kvm \
            --cap-add NET_ADMIN \
            ghcr.io/dockur/windows

      # ============================================================
      # 11. WAIT FOR RDP
      # ============================================================
      - name: Wait for RDP
        run: |
          READY=0
          STABLE_COUNT=0
          echo "Waiting for RDP protocol to respond..."
          for i in $(seq 1 180); do
            RESPONSE=$(timeout 3 bash -c 'exec 3<>/dev/tcp/127.0.0.1/3389; printf "\x03\x00\x00\x13\x0e\xe0\x00\x00\x00\x00\x00\x01\x00\x08\x00\x03\x00\x00\x00" >&3; head -c 4 <&3 | xxd -p' 2>/dev/null || true)
            if [ -n "$RESPONSE" ]; then 
              STABLE_COUNT=$((STABLE_COUNT + 1))
            else 
              STABLE_COUNT=0
            fi
            
            if [ "$STABLE_COUNT" -ge 2 ]; then 
              READY=1
              break
            fi
            sleep 10
          done
          
          TS_IP=$(tailscale ip -4 2>/dev/null || echo "not available")
          if [ "$READY" = "1" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d chat_id="${TELEGRAM_CHAT_ID}" --data-urlencode "text=$(date '+%I:%M:%S %p') : 🖥️ RDP is Ready! Tailscale IP: ${TS_IP}" > /dev/null || true
          else
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d chat_id="${TELEGRAM_CHAT_ID}" --data-urlencode "text=$(date '+%I:%M:%S %p') : ⚠️ RDP is taking too long. It might still be loading. IP: ${TS_IP}" > /dev/null || true
          fi

      # ============================================================
      # 12. UNIFIED CONTROLLER LOOP (Double Backup Logic)
      # ============================================================
      - name: Main Controller (Monitor & Double Backup)
        run: |
          touch /tmp/main_loop_started
          
          notify_telegram() { curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d chat_id="${TELEGRAM_CHAT_ID}" --data-urlencode "text=$(date '+%I:%M:%S %p') : $1" > /dev/null || true; }

          upload_safely() {
            LOCAL_FILE=$1
            REMOTE_NAME=$2
            TEMP_NAME="${REMOTE_NAME}.tmp"
            if rclone copyto "$LOCAL_FILE" "gdrive:$TEMP_NAME" --ignore-times --stats 15s; then
               rclone moveto "gdrive:$TEMP_NAME" "gdrive:$REMOTE_NAME"
               rclone cleanup gdrive: 2>/dev/null || true
               return 0
            else
               return 1
            fi
          }

          backup_now() {
            notify_telegram "🔄 Double Backup started (Windows + Tailscale). Reason: $1. Please wait..."
            
            # --- 1. Tailscale Backup ---
            sudo mkdir -p /tmp/ts-state
            if [ -f /var/lib/tailscale/tailscaled.state ]; then
               sudo cp /var/lib/tailscale/tailscaled.state /tmp/ts-state/tailscaled.state 2>/dev/null || true
               sudo tar -czf ~/tailscale-state.tar.gz -C /tmp/ts-state tailscaled.state 2>/dev/null || true
               rclone copyto ~/tailscale-state.tar.gz gdrive:tailscale-state.tar.gz --ignore-times 2>/dev/null || true
            fi
            
            # --- 2. Windows Backup ---
            sudo docker pause windows 2>/dev/null || true
            rm -f ~/windows-backup.tar.zst
            if sudo tar --sparse -I 'zstd -T0 -3' -cf ~/windows-backup.tar.zst -C /opt windows; then
               sudo docker unpause windows 2>/dev/null || true
               sudo chown "$USER:$USER" ~/windows-backup.tar.zst 2>/dev/null || true
               if upload_safely ~/windows-backup.tar.zst windows-backup.tar.zst; then
                  notify_telegram "✅ Double Backup completed successfully."
                  touch /tmp/skip_final_backup
                  return 0
               fi
            fi
            sudo docker unpause windows 2>/dev/null || true
            notify_telegram "⚠️ Windows Backup failed."
            return 1
          }

          START_TIME=$(date +%s)
          TOTAL_SECONDS=19500
          BACKUP_INTERVAL=2100
          LAST_BACKUP_TIME=$START_TIME
          WAS_CONNECTED=0

          notify_telegram "🟢 System is monitored. Auto-backups (Win+VPN) every 35 mins & on RDP disconnect."

          while true; do
            sleep 5
            CURRENT_TIME=$(date +%s)

            if [ $((CURRENT_TIME - START_TIME)) -ge $TOTAL_SECONDS ]; then
               notify_telegram "⏳ Max 325-minute runtime reached. Initiating final shutdown..."
               break
            fi

            if [ -f /tmp/telegram_action ]; then
               ACTION=$(cat /tmp/telegram_action)
               rm -f /tmp/telegram_action
               if [ "$ACTION" = "backup_stop" ]; then
                  notify_telegram "💾 Taking final double backup before stopping..."
                  backup_now "Telegram Stop Command"
                  break 
               fi
            fi

            ELAPSED_SINCE_BACKUP=$((CURRENT_TIME - LAST_BACKUP_TIME))
            if [ "$ELAPSED_SINCE_BACKUP" -ge "$BACKUP_INTERVAL" ]; then
               backup_now "35-minute timer"
               LAST_BACKUP_TIME=$(date +%s)
               rm -f /tmp/skip_final_backup
            fi

            ACTIVE=$(sudo ss -Htn state established '( sport = :3389 or dport = :3389 )' 2>/dev/null | wc -l)
            if [ "$ACTIVE" -gt 0 ] && [ "$WAS_CONNECTED" -eq 0 ]; then
               WAS_CONNECTED=1
               notify_telegram "🟢 RDP Connected."
            elif [ "$ACTIVE" -eq 0 ] && [ "$WAS_CONNECTED" -eq 1 ]; then
               WAS_CONNECTED=0
               notify_telegram "👋 RDP Disconnected. Taking safety backup..."
               backup_now "RDP Disconnect"
               LAST_BACKUP_TIME=$(date +%s)
               rm -f /tmp/skip_final_backup
            fi
          done

      # ============================================================
      # 13. EMERGENCY / FINAL BACKUP
      # ============================================================
      - name: Final/Emergency Backup
        if: always()
        continue-on-error: true
        run: |
          if [ -f /tmp/skip_final_backup ]; then
             echo "Skipping final backup (already taken or skipped via Telegram)."
             exit 0
          fi
          
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d chat_id="${TELEGRAM_CHAT_ID}" --data-urlencode "text=$(date '+%I:%M:%S %p') : 🚨 Session is forcing a final double backup before shutting down." > /dev/null || true
          
          # Final Tailscale Backup
          if [ -f /var/lib/tailscale/tailscaled.state ]; then
             sudo mkdir -p /tmp/ts-state
             sudo cp /var/lib/tailscale/tailscaled.state /tmp/ts-state/tailscaled.state 2>/dev/null || true
             sudo tar -czf ~/tailscale-state.tar.gz -C /tmp/ts-state tailscaled.state 2>/dev/null || true
             rclone copyto ~/tailscale-state.tar.gz gdrive:tailscale-state.tar.gz --ignore-times 2>/dev/null || true
          fi

          # Final Windows Backup
          if [ -d /opt/windows ]; then
            sudo docker pause windows 2>/dev/null || true
            rm -f ~/windows-backup.tar.zst
            if sudo tar --sparse -I 'zstd -T0 -3' -cf ~/windows-backup.tar.zst -C /opt windows; then
              sudo chown "$USER:$USER" ~/windows-backup.tar.zst 2>/dev/null || true
              rclone copyto ~/windows-backup.tar.zst gdrive:windows-backup.tar.zst --ignore-times
            fi
            sudo docker unpause windows 2>/dev/null || true
          fi

      # ============================================================
      # 14. STOP WINDOWS & CLEANUP
      # ============================================================
      - name: Stop Windows cleanly
        if: always()
        continue-on-error: true
        run: |
          tmux kill-session -t tgbot 2>/dev/null || true
          timeout 60 sudo docker stop windows || true
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d chat_id="${TELEGRAM_CHAT_ID}" --data-urlencode "text=$(date '+%I:%M:%S %p') : ✅ VPS session successfully finished and cleaned up." > /dev/null || true
