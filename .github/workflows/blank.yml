name: Continuous Persistent VPS

# FIX #1: sirf manual trigger. cron/schedule hata diya hai isliye
# ab session khatam hote hi agla run apne aap chalu nahi hoga.
# Jab tak tum khud "Run workflow" na dabao, kuch nahi chalega.
on:
  workflow_dispatch:

# FIX #1 (part 2): agar galti se do baar "Run workflow" daba diya,
# to dusra run pehle wale ke khatam hone tak QUEUE me rukega,
# parallel me do sessions kabhi nahi chalenge.
concurrency:
  group: vps-session
  cancel-in-progress: false

# Telegram se /stop command aane par workflow ko cancel karne ke liye
# GitHub API access chahiye — ye automatic token (github.token) ko
# permission deta hai, koi NAYA secret add karne ki zaroorat nahi.
permissions:
  actions: write
  contents: read

env:
  RCLONE_CONFIG_GDRIVE_TYPE: drive
  RCLONE_CONFIG_GDRIVE_SCOPE: drive
  RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.RCLONE_DRIVE_TOKEN }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  # FIX: runner ka default time UTC hota hai, isliye Telegram messages
  # me galat time dikh raha tha. TZ set karne se har "date" command
  # automatically IST (India time) use karega, kisi line ko individually
  # badalne ki zaroorat nahi.
  TZ: Asia/Kolkata
  # Automatic token — koi naya secret nahi, GitHub khud deta hai. Workflow
  # cancel karne ke liye zaroori hai (Telegram /stop feature ke liye).
  GH_TOKEN: ${{ github.token }}

jobs:
  vps-session:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Notify - workflow started
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="🕐 $(date '+%d-%m-%Y %I:%M:%S %p')

🚀 Sir, your VPS workflow has been started. Setup is in progress, please wait." > /dev/null || true

      - name: Set hostname to biralo
        run: sudo hostnamectl set-hostname biralo

      - name: Install prerequisites + rclone
        run: |
          sudo apt update
          sudo apt install -y tmate curl unzip sudo net-tools neofetch iproute2 xxd openssh-server python3
          curl https://rclone.org/install.sh | sudo bash

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

      # FIX #3: Tailscale state ab GitHub artifact (jo sirf 1 din tikta hai
      # aur naye run me reliably nahi milta) ki jagah seedha Google Drive
      # se restore hota hai — GH artifact ki tarah ye kabhi expire/miss
      # nahi hoga, isliye same node = same Tailscale IP milega har baar.
      - name: Restore Tailscale state from Drive
        run: |
          mkdir -p ./restore
          if rclone lsf gdrive: --files-only | grep -qx "tailscale-state.tar.gz"; then
            echo "Tailscale state mila, restore kar rahe hain..."
            rclone copy gdrive:tailscale-state.tar.gz ./restore/ --progress
            sudo mkdir -p /var/lib/tailscale
            sudo tar -xzf ./restore/tailscale-state.tar.gz -C /var/lib/tailscale/
            sudo chmod 600 /var/lib/tailscale/tailscaled.state || true
          else
            echo "Pehli baar chal raha hai, koi purana state nahi mila"
          fi

      - name: Start Tailscale
        run: |
          sudo tailscaled &
          sleep 8
          # --hostname same rakha, state restore ho chuka hai to
          # Tailscale isi node ko continue karega -> same IP.
          # NOTE: TAILSCALE_AUTHKEY reusable (non-ephemeral) key hona chahiye
          # Tailscale admin console me, warna key expire hote hi naya node banega.
          sudo tailscale up --authkey ${{ secrets.TAILSCALE_AUTHKEY }} --hostname=biralo --ssh
          echo "Tailscale IP:"
          tailscale ip -4

      # FIX: Tailscale identity backup ab sirf EK BAAR yahan hota hai
      # (workflow start me), har 35-min backup cycle me nahi — kyunki
      # Tailscale state itni baar change hi nahi hota, isliye baar baar
      # upload karna faaltu tha.
      - name: Backup Tailscale identity (once)
        run: |
          if [ -f /var/lib/tailscale/tailscaled.state ]; then
            sudo mkdir -p /tmp/ts-state
            sudo cp /var/lib/tailscale/tailscaled.state /tmp/ts-state/ || true
            sudo tar -czf ~/tailscale-state.tar.gz -C /tmp/ts-state . || true
            sudo chown $USER:$USER ~/tailscale-state.tar.gz 2>/dev/null || true
            rclone copy ~/tailscale-state.tar.gz gdrive: --progress || true
            echo "✅ Tailscale identity backed up (one-time)"
          fi

      - name: Create user biralo
        run: |
          if ! id -u biralo >/dev/null 2>&1; then
            sudo useradd -m -s /bin/bash biralo
            echo "biralo:biralo" | sudo chpasswd
            sudo usermod -aG sudo biralo
            echo "biralo ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/biralo
          fi

      - name: Start SSH server (for PuTTY access)
        run: |
          # Password se login allow karna hai (default Ubuntu me kabhi-kabhi
          # off hota hai), isliye explicitly enable kar rahe hain.
          sudo sed -i 's/#*PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/#*PermitRootLogin.*/PermitRootLogin no/' /etc/ssh/sshd_config
          sudo systemctl enable ssh
          sudo systemctl restart ssh
          sudo systemctl status ssh --no-pager || true
          echo "✅ SSH server chal raha hai port 22 par"

      # FIX: Tailscale interface (tailscale0) se aane wala traffic Docker ke
      # published ports (3389, 8006) tak reliably nahi pahuch pa raha tha,
      # sirf loopback (127.0.0.1) se kaam kar raha tha. Ye classic
      # Tailscale + Docker issue hai jiski wajah "reverse path filtering"
      # (rp_filter) hoti hai — jab reply packet jis interface se gaya
      # nahi usi se wapas aata hai, kernel usse drop kar deta hai.
      # Ye settings loosen kar rahe hain taaki tailscale0 se aane wala
      # traffic bhi properly Docker tak pahunche.
      - name: Fix networking for Tailscale + Docker port access
        run: |
          echo "IP forwarding enable kar rahe hain..."
          sudo sysctl -w net.ipv4.ip_forward=1

          echo "rp_filter ko loose mode (2) me kar rahe hain..."
          sudo sysctl -w net.ipv4.conf.all.rp_filter=2
          sudo sysctl -w net.ipv4.conf.default.rp_filter=2
          for iface in /proc/sys/net/ipv4/conf/*/rp_filter; do
            echo 2 | sudo tee "$iface" > /dev/null || true
          done

          echo "UFW firewall check kar rahe hain..."
          if sudo ufw status | grep -q "Status: active"; then
            echo "UFW active hai, RDP/viewer ports allow kar rahe hain..."
            sudo ufw allow 3389/tcp
            sudo ufw allow 3389/udp
            sudo ufw allow 8006/tcp
          else
            echo "UFW active nahi hai, kuch karne ki zaroorat nahi"
          fi

          echo "✅ Networking fix apply ho gaya"

      # FIX: Public repo ka free runner 4-core CPU / 16GB RAM deta hai
      # (private repo hota to sirf 2-core/8GB milta) — ye confirm ho
      # chuka hai. Disk sirf ~14GB hoti hai total, isliye pehle usme se
      # unused pre-installed SDKs (dotnet, Android, GHC waghera) hata
      # ke jagah banate hain — ye ek well-known GitHub Actions trick hai,
      # isse aksar 10-20GB extra free space mil jaata hai. Ye Windows
      # image pull karne se PEHLE karna zaroori hai, warna cleanup
      # abhi-abhi pull ki hui image ko bhi hata sakta hai.
      - name: Free up disk space
        run: |
          echo "Pehle disk space (cleanup se pehle):"
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache 2>/dev/null || true
          sudo apt-get clean
          docker image prune --all --force 2>/dev/null || true
          echo "Baad me disk space (cleanup ke baad):"
          df -h /

      - name: Check available resources
        run: |
          echo "💾 Disk space:"
          df -h /
          echo ""
          echo "🧠 Memory:"
          free -h
          echo ""
          echo "⚙️ CPU cores:"
          nproc

      - name: Check Google Drive & restore Windows
        run: |
          if rclone lsf gdrive: --files-only | grep -qx "windows-backup.tar.gz"; then
            echo "✅ Drive par backup mila! Download ho raha hai..."
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              -d text="🕐 $(date '+%d-%m-%Y %I:%M:%S %p')

📦 Sir, your previous backup has been found on Drive. It is now being loaded." > /dev/null || true
            rclone copy gdrive:windows-backup.tar.gz ./restore/ --progress
            sudo mkdir -p /opt/windows
            sudo tar -xzf ./restore/windows-backup.tar.gz -C /opt/
            echo "✅ Windows restore complete!"
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              -d text="🕐 $(date '+%d-%m-%Y %I:%M:%S %p')

✅ Sir, your backup has been loaded successfully. Starting Windows now." > /dev/null || true
          else
            echo "⚠️ Drive par backup nahi mila — fresh Windows install hoga"
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              -d text="🕐 $(date '+%d-%m-%Y %I:%M:%S %p')

⚠️ Sir, no previous backup was found. A fresh Windows installation is starting now — this may take a while." > /dev/null || true
          fi

      - name: Pull Windows image
        run: docker pull ghcr.io/dockur/windows

      - name: Start Windows
        run: |
          docker run -d --name windows \
            -e VERSION="11" \
            -e USERNAME="admin" \
            -e PASSWORD="Shrey222136" \
            -e RAM_SIZE="10G" \
            -e CPU_CORES="4" \
            -e DISK_SIZE="60G" \
            -p 3389:3389/tcp \
            -p 3389:3389/udp \
            -p 8006:8006 \
            -v /opt/windows:/storage \
            --device=/dev/kvm \
            --cap-add NET_ADMIN \
            ghcr.io/dockur/windows

      # tmate step yahan se hata diya — Tailscale se already SSH access
      # milta hai (biralo user se), isliye tmate ki zaroorat nahi thi.
      # Ye kabhi-kabhi apne server (tmate.io) se connect hone me permanently
      # atak jaata tha, jo pura workflow block kar deta tha.

      - name: Wait for RDP to be ready, then notify
        run: |
          echo "Windows boot hone ka wait kar rahe hain (RDP port 3389)..."
          READY=0
          for i in $(seq 1 210); do
            # sirf raw TCP connect nahi, asli RDP protocol ka pehla
            # response byte check kar rahe hain (RDP negotiation request
            # bhejke response dekhte hain) — isse false-positive nahi milega
            # jab tak Windows ke andar ka RDP service genuinely taiyar na ho.
            RESPONSE=$(timeout 3 bash -c '
              exec 3<>/dev/tcp/127.0.0.1/3389
              printf "\x03\x00\x00\x13\x0e\xe0\x00\x00\x00\x00\x00\x01\x00\x08\x00\x03\x00\x00\x00" >&3
              head -c 4 <&3 | xxd -p
            ' 2>/dev/null) || true
            if [ -n "$RESPONSE" ]; then
              READY=1
              break
            fi
            sleep 10
          done

          TS_IP=$(tailscale ip -4 2>/dev/null || echo "not available")

          if [ "$READY" = "1" ]; then
            echo "✅ RDP is genuinely up!"
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              -d text="🕐 $(date '+%d-%m-%Y %I:%M:%S %p')

🖥️ Sir, your RDP is now ready. You can connect using this Tailscale IP: ${TS_IP}" > /dev/null || true
          else
            echo "⚠️ RDP abhi bhi ready nahi hua 35 min ke andar"
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              -d text="🕐 $(date '+%d-%m-%Y %I:%M:%S %p')

⚠️ Sir, RDP is taking longer than usual (35+ min) to come up. Tailscale IP: ${TS_IP}. Please check via SSH: tailscale ssh biralo, then run: sudo docker logs windows --tail 50" > /dev/null || true
          fi

      - name: Show connection details
        run: |
          echo "🌐 Tailscale IP:"
          tailscale ip -4 || echo "not found"

      # FIX #2 (backup reliability): ab ek hi lamba "sleep" nahi hai.
      # Loop chal raha hai jo har 35 minute me Windows + Tailscale state
      # ka backup leke Drive par upload karta hai. Isliye agar beech me
      # runner crash ho jaye, error aaye, ya cancel ho jaye, to zyada se
      # zyada pichle 35 min ka hi data miss hoga — sab data nahi udega.
      # trap laga hai jo cancel/error/timeout signal milte hi turant
      # ek FINAL backup try karta hai (best-effort, kyunki timeout ke
      # baad runner ke paas sirf kuch second hi hote hain).
      - name: Keep alive with periodic backups
        run: |
          BACKUP_INTERVAL=2100   # 35 minute = 2100 sec
          TOTAL_SECONDS=19500    # ~5h25m total session
          ELAPSED=0

          # RDP (Windows) ke andar seedha popup bhejna is setup me reliable
          # nahi hai (VM isolated hai), isliye Telegram par turant message
          # jaata hai — RDP me ho ya na ho, phone pe turant pata chal jata hai.
          notify_telegram() {
            MSG=$1
            if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
              FULL_MSG="🕐 $(date '+%d-%m-%Y %I:%M:%S %p')

${MSG}"
              curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                -d chat_id="${TELEGRAM_CHAT_ID}" \
                -d text="${FULL_MSG}" > /dev/null || echo "   (Telegram notify fail hui, ignore kar ke aage badhte hain)"
            fi
          }

          # Bade backup file (Windows wala) ke upload ka progress track
          # karta hai — har 10% milestone par Telegram par percentage
          # aur estimated time bhejta hai. rclone ke apne stats output
          # se percentage/ETA nikalta hai.
          upload_with_progress() {
            LOCAL_FILE=$1
            REMOTE_PATH=$2
            LOGFILE=/tmp/rclone_progress.log
            rm -f "$LOGFILE"

            rclone copyto "$LOCAL_FILE" "$REMOTE_PATH" --stats-one-line --stats 10s --log-file="$LOGFILE" --log-level INFO &
            RC_PID=$!
            LAST_NOTIFIED=0

            while kill -0 $RC_PID 2>/dev/null; do
              sleep 10
              if [ -f "$LOGFILE" ]; then
                LAST_LINE=$(tail -1 "$LOGFILE" 2>/dev/null)
                PCT=$(echo "$LAST_LINE" | grep -oE '[0-9]+%' | head -1 | tr -d '%')
                ETA=$(echo "$LAST_LINE" | grep -oE 'ETA [^,]+' | head -1)
                if [ -n "$PCT" ]; then
                  THRESH=$(( (PCT / 10) * 10 ))
                  if [ "$THRESH" -gt "$LAST_NOTIFIED" ] && [ "$THRESH" -ge 10 ] && [ "$THRESH" -le 90 ]; then
                    notify_telegram "⬆️ Sir, your backup upload is at ${THRESH}% complete. ${ETA}"
                    LAST_NOTIFIED=$THRESH
                  fi
                fi
              fi
            done

            wait $RC_PID
            RC=$?
            rm -f "$LOGFILE"
            return $RC
          }

          # STAGED UPLOAD: pehle ek TEMP naam (".new") se upload karta hai,
          # size verify karta hai, aur SIRF tabhi asli file ko replace karta
          # hai jab verify pass ho jaye. Isse agar upload beech me fail ho
          # ya corrupt ho jaye, to Drive par jo PURANA sahi backup hai wo
          # kabhi touch hi nahi hota — safe rehta hai. Max 3 retry karta hai.
          upload_and_verify() {
            LOCAL_FILE=$1
            REMOTE_NAME=$2
            SHOW_PROGRESS=${3:-no}
            TEMP_NAME="${REMOTE_NAME}.new"
            ATTEMPT=1
            MAX_ATTEMPTS=3

            LOCAL_SIZE=$(stat -c%s "$LOCAL_FILE" 2>/dev/null) || LOCAL_SIZE=0

            while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
              echo "   Upload attempt $ATTEMPT/$MAX_ATTEMPTS: $TEMP_NAME (staging, purana backup abhi safe hai)"
              if [ "$SHOW_PROGRESS" = "yes" ]; then
                upload_with_progress "$LOCAL_FILE" "gdrive:$TEMP_NAME" || true
              else
                rclone copyto "$LOCAL_FILE" "gdrive:$TEMP_NAME" || true
              fi

              # rclone size command se Drive par actual size check karo
              REMOTE_SIZE=$(rclone size gdrive:"$TEMP_NAME" --json 2>/dev/null | grep -o '"bytes":[0-9]*' | grep -o '[0-9]*') || REMOTE_SIZE=0

              if [ "$REMOTE_SIZE" = "$LOCAL_SIZE" ] && [ "$LOCAL_SIZE" != "0" ]; then
                echo "   ✅ Staged upload verified ($LOCAL_SIZE bytes match) — ab purane backup ko replace kar rahe hain"
                rclone moveto "gdrive:$TEMP_NAME" "gdrive:$REMOTE_NAME" || true
                echo "   ✅ Verified aur promoted: $REMOTE_NAME"
                return 0
              else
                echo "   ⚠️ Mismatch (local=$LOCAL_SIZE drive=$REMOTE_SIZE), retrying..."
                ATTEMPT=$((ATTEMPT + 1))
                sleep 5
              fi
            done

            echo "   ❌ FAILED to verify upload of $REMOTE_NAME after $MAX_ATTEMPTS tries — purana backup TOUCH nahi kiya, safe hai. Staged temp file delete kar rahe hain."
            rclone deletefile "gdrive:$TEMP_NAME" 2>/dev/null || true
            return 1
          }

          backup_now() {
            echo "🔄 Backup shuru ho raha hai... ($(date))"
            notify_telegram "🔄 Sir, your backup is being taken now, please wait."
            OK=1

            if [ -d /opt/windows ] && [ "$(ls -A /opt/windows 2>/dev/null)" ]; then
              # Windows VM ko thodi der ke liye PAUSE kar rahe hain (freeze,
              # stop nahi) taaki disk image file backup ke BEECH me change
              # na ho — warna tar "file changed as we read it" bolke
              # background loop hi crash kar deta tha (silently ruk jaata
              # tha, agla koi backup kabhi nahi hota tha). Pause se RDP
              # session bhi freeze ho jayega thodi der ke liye, phir wapas
              # normal ho jayega jaise hi backup ka tar step khatam ho.
              sudo docker pause windows 2>/dev/null || true
              sudo tar -czf ~/windows-backup.tar.gz -C /opt windows || true
              sudo docker unpause windows 2>/dev/null || true
              sudo chown $USER:$USER ~/windows-backup.tar.gz 2>/dev/null || true
              upload_and_verify ~/windows-backup.tar.gz windows-backup.tar.gz yes || OK=0
            fi

            # Tailscale identity ka backup ab HAR backup cycle me bhi hota
            # hai (35-min timer, disconnect, sab me) — taaki IP kabhi bhi
            # kisi bhi run me change na ho, chahe state beech me kuch bhi
            # ho jaye.
            if [ -f /var/lib/tailscale/tailscaled.state ]; then
              sudo mkdir -p /tmp/ts-state
              sudo cp /var/lib/tailscale/tailscaled.state /tmp/ts-state/ || true
              sudo tar -czf ~/tailscale-state.tar.gz -C /tmp/ts-state . || true
              sudo chown $USER:$USER ~/tailscale-state.tar.gz 2>/dev/null || true
              upload_and_verify ~/tailscale-state.tar.gz tailscale-state.tar.gz || true
            fi

            rclone cleanup gdrive: || true

            if [ "$OK" = "1" ]; then
              echo "✅ Backup complete aur VERIFIED ($(date))"
              notify_telegram "✅ Sir, your backup has been completed and verified successfully."
            else
              echo "❌ Backup me kuch verify nahi hua — agla cycle me phir try hoga ($(date))"
              notify_telegram "⚠️ Sir, there was an issue verifying your last backup. It will be retried automatically in the next cycle."
            fi
          }

          # LOCK: agar timer-based aur RDP-disconnect-based backup ek
          # saath trigger ho jaye, to dono ek time pe tar/upload na karein
          # (isse file corrupt ho sakti hai). Ye lock ensure karta hai
          # ki ek waqt me sirf EK backup chale.
          LOCKFILE=/tmp/backup.lock

          run_backup_safely() {
            REASON=$1
            if ( set -o noclobber; echo "$$" > "$LOCKFILE" ) 2>/dev/null; then
              echo "🔔 Trigger: $REASON"
              backup_now
              rm -f "$LOCKFILE"
            else
              echo "⏭️ Backup already chal raha hai, skip ($REASON)"
            fi
          }

          # GitHub API se is workflow run ko cancel karta hai. Automatic
          # GH_TOKEN use hota hai (koi naya secret nahi chahiye).
          cancel_workflow() {
            notify_telegram "🛑 Sir, your VPS workflow is being stopped now."
            curl -s -X POST \
              -H "Authorization: token ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/cancel" > /dev/null || true
          }

          # ---- Telegram /stop control system ----
          # Python script Telegram ko poll karta rehta hai. Jab tum bot ko
          # "/stop" bhejte ho, ye 3 button wala message bhejta hai. Jo bhi
          # button dabao, uska "action" ek file (/tmp/telegram_action) me
          # likh deta hai — bash wala watcher loop use padh ke asli kaam
          # karta hai (backup lena / workflow cancel karna).
          cat > /tmp/telegram_listener.py << 'PYEOF'
          import json
          import os
          import time
          import urllib.request
          import urllib.parse

          BOT_TOKEN = os.environ.get("TELEGRAM_BOT_TOKEN", "")
          CHAT_ID = os.environ.get("TELEGRAM_CHAT_ID", "")
          API = f"https://api.telegram.org/bot{BOT_TOKEN}"
          ACTION_FILE = "/tmp/telegram_action"

          def api_call(method, params=None, timeout=25):
              url = f"{API}/{method}"
              data = urllib.parse.urlencode(params or {}).encode()
              try:
                  with urllib.request.urlopen(url, data=data, timeout=timeout) as resp:
                      return json.loads(resp.read().decode())
              except Exception:
                  return None

          def send_buttons():
              keyboard = {
                  "inline_keyboard": [
                      [{"text": "💾 Backup & Stop", "callback_data": "backup_stop"}],
                      [{"text": "⛔ Stop Without Backup", "callback_data": "stop_nobackup"}],
                      [{"text": "🔄 Backup Now – Keep Running", "callback_data": "backup_only"}],
                  ]
              }
              api_call("sendMessage", {
                  "chat_id": CHAT_ID,
                  "text": "Sir, what would you like to do?",
                  "reply_markup": json.dumps(keyboard),
              })

          def answer_callback(cb_id, text):
              api_call("answerCallbackQuery", {"callback_query_id": cb_id, "text": text})

          def main():
              offset = 0
              while True:
                  result = api_call("getUpdates", {"offset": offset, "timeout": 20}, timeout=25)
                  if not result or not result.get("ok"):
                      time.sleep(3)
                      continue
                  for update in result.get("result", []):
                      offset = update["update_id"] + 1

                      msg = update.get("message")
                      if msg and str(msg.get("chat", {}).get("id")) == str(CHAT_ID):
                          text = (msg.get("text") or "").strip()
                          if text == "/stop":
                              send_buttons()

                      cb = update.get("callback_query")
                      if cb and str(cb.get("message", {}).get("chat", {}).get("id")) == str(CHAT_ID):
                          data = cb.get("data", "")
                          if data in ("backup_stop", "stop_nobackup", "backup_only"):
                              answer_callback(cb["id"], "Received, processing...")
                              with open(ACTION_FILE, "w") as f:
                                  f.write(data)

          if __name__ == "__main__":
              main()
          PYEOF

          python3 /tmp/telegram_listener.py &
          TELEGRAM_LISTENER_PID=$!

          # Bash watcher: har 3 sec me dekhta hai ki koi button action
          # aaya hai ya nahi, aur uske hisaab se asli kaam karta hai.
          (
            NOW=0
            while [ $NOW -lt $TOTAL_SECONDS ]; do
              sleep 3
              NOW=$((NOW + 3))
              if [ -f /tmp/telegram_action ]; then
                ACTION=$(cat /tmp/telegram_action)
                rm -f /tmp/telegram_action
                case "$ACTION" in
                  backup_stop)
                    notify_telegram "💾 Sir, taking a backup before stopping."
                    run_backup_safely "telegram: backup & stop"
                    cancel_workflow
                    ;;
                  stop_nobackup)
                    notify_telegram "⛔ Sir, stopping without taking a backup, as requested."
                    cancel_workflow
                    ;;
                  backup_only)
                    notify_telegram "🔄 Sir, taking a backup now. The session will keep running."
                    run_backup_safely "telegram: backup now"
                    ;;
                esac
              fi
            done
          ) &
          CONTROL_PID=$!

          # Cancel / error / timeout aate hi ek aakhri backup try karo
          trap 'echo "⚠️ Signal mila, emergency backup..."; notify_telegram "⚠️ Sir, your VPS session is shutting down. An emergency backup is being taken."; run_backup_safely "shutdown signal"; kill $TELEGRAM_LISTENER_PID 2>/dev/null || true; exit 0' TERM INT

          notify_telegram "✅ Sir, your VPS setup is fully ready. Automatic backups will run every 35 minutes and on every RDP disconnect. Send /stop anytime to control the session."

          # ---- Background loop 1: har 35 min timer-based backup ----
          (
            ELAPSED=0
            while [ $ELAPSED -lt $TOTAL_SECONDS ]; do
              SLEEP_NOW=$BACKUP_INTERVAL
              REMAINING=$((TOTAL_SECONDS - ELAPSED))
              if [ $REMAINING -lt $BACKUP_INTERVAL ]; then
                SLEEP_NOW=$REMAINING
              fi
              sleep $SLEEP_NOW
              ELAPSED=$((ELAPSED + SLEEP_NOW))
              run_backup_safely "35-min timer"
            done
          ) &
          TIMER_PID=$!

          # ---- Background loop 2: RDP (port 3389) connect/disconnect detect ----
          # Har 15 sec check karta hai ki koi RDP client connected hai ya nahi.
          # CONNECT hote hi ek welcome message jaata hai, aur DISCONNECT hote hi
          # ek thank-you message + backup trigger hota hai. 3 min cooldown hai
          # taaki baar-baar connect/disconnect hone par backup spam na ho
          # (welcome/thank-you messages har baar jaate hain, sirf backup trigger
          # cooldown follow karta hai).
          (
            WAS_CONNECTED=0
            COOLDOWN_UNTIL=0
            NOW=0
            while [ $NOW -lt $TOTAL_SECONDS ]; do
              sleep 15
              NOW=$((NOW + 15))
              ACTIVE=$(sudo ss -tn 2>/dev/null | grep ':3389' | grep -c ESTAB || true)
              if [ "$ACTIVE" -gt 0 ] && [ "$WAS_CONNECTED" = "0" ]; then
                # abhi connect hua hai
                WAS_CONNECTED=1
                notify_telegram "🟢 Sir, you are now connected to your RDP. Enjoy!"
              elif [ "$ACTIVE" -eq 0 ] && [ "$WAS_CONNECTED" = "1" ]; then
                # abhi disconnect hua hai
                WAS_CONNECTED=0
                notify_telegram "👋 Sir, thanks for coming. See you soon!"
                if [ $NOW -ge $COOLDOWN_UNTIL ]; then
                  run_backup_safely "RDP disconnect detected"
                  COOLDOWN_UNTIL=$((NOW + 180))
                fi
              fi
            done
          ) &
          MONITOR_PID=$!

          wait $TIMER_PID $MONITOR_PID $CONTROL_PID
          kill $TELEGRAM_LISTENER_PID 2>/dev/null || true

      - name: Stop Windows cleanly
        if: always()
        run: |
          echo "Windows ko gracefully stop karne ki koshish (max 60 sec)..."
          timeout 60 sudo docker stop windows || true
          echo "Agar abhi bhi chal raha hai to force-kill kar rahe hain..."
          sudo docker kill windows || true
          sleep 5

      # Ye final backup ab safety-net hai — normal case me upar wale
      # loop ne already sab kuch upload kar diya hoga.
      - name: Final backup (safety net)
        if: always()
        run: |
          if [ -d /opt/windows ] && [ "$(ls -A /opt/windows 2>/dev/null)" ]; then
            sudo tar -czf ~/windows-backup.tar.gz -C /opt windows || true
            sudo chown $USER:$USER ~/windows-backup.tar.gz 2>/dev/null || true
            rclone copy ~/windows-backup.tar.gz gdrive: --progress || true
            rclone cleanup gdrive: || true
          fi
          if [ -f /var/lib/tailscale/tailscaled.state ]; then
            sudo mkdir -p /tmp/ts-state
            sudo cp /var/lib/tailscale/tailscaled.state /tmp/ts-state/ || true
            sudo tar -czf ~/tailscale-state.tar.gz -C /tmp/ts-state . || true
            sudo chown $USER:$USER ~/tailscale-state.tar.gz 2>/dev/null || true
            rclone copy ~/tailscale-state.tar.gz gdrive: --progress || true
          fi
