name: Continuous Persistent VPS

# FIX #1: sirf manual trigger. cron/schedule hata diya hai isliye
# ab session khatam hote hi agla run apne aap chalu nahi hoga.
# Jab tak tum khud "Run workflow" na dabao, kuch nahi chalega.
on:
  workflow_dispatch:

# FIX #1 (part 2): agar galti se do baar "Run workflow" daba diya,
# to dusra run pehle wale ke khatam hone tak QUEUE me rukega,
# parallel me do sessions kabhi nahi chalenge.
concurrency:
  group: vps-session
  cancel-in-progress: false

env:
  RCLONE_CONFIG_GDRIVE_TYPE: drive
  RCLONE_CONFIG_GDRIVE_SCOPE: drive
  RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.RCLONE_DRIVE_TOKEN }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  vps-session:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Notify - workflow started
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="🚀 Sir, your VPS workflow has been started at $(date '+%d-%m-%Y %I:%M %p'). Setup is in progress, please wait." > /dev/null || true

      - name: Set hostname to biralo
        run: sudo hostnamectl set-hostname biralo

      - name: Install prerequisites + rclone
        run: |
          sudo apt update
          sudo apt install -y tmate curl unzip sudo net-tools neofetch iproute2 xxd openssh-server
          curl https://rclone.org/install.sh | sudo bash

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

      # FIX #3: Tailscale state ab GitHub artifact (jo sirf 1 din tikta hai
      # aur naye run me reliably nahi milta) ki jagah seedha Google Drive
      # se restore hota hai — GH artifact ki tarah ye kabhi expire/miss
      # nahi hoga, isliye same node = same Tailscale IP milega har baar.
      - name: Restore Tailscale state from Drive
        run: |
          mkdir -p ./restore
          if rclone lsf gdrive: --files-only | grep -qx "tailscale-state.tar.gz"; then
            echo "Tailscale state mila, restore kar rahe hain..."
            rclone copy gdrive:tailscale-state.tar.gz ./restore/ --progress
            sudo mkdir -p /var/lib/tailscale
            sudo tar -xzf ./restore/tailscale-state.tar.gz -C /var/lib/tailscale/
            sudo chmod 600 /var/lib/tailscale/tailscaled.state || true
          else
            echo "Pehli baar chal raha hai, koi purana state nahi mila"
          fi

      - name: Start Tailscale
        run: |
          sudo tailscaled &
          sleep 8
          # --hostname same rakha, state restore ho chuka hai to
          # Tailscale isi node ko continue karega -> same IP.
          # NOTE: TAILSCALE_AUTHKEY reusable (non-ephemeral) key hona chahiye
          # Tailscale admin console me, warna key expire hote hi naya node banega.
          sudo tailscale up --authkey ${{ secrets.TAILSCALE_AUTHKEY }} --hostname=biralo --ssh
          echo "Tailscale IP:"
          tailscale ip -4

      - name: Create user biralo
        run: |
          if ! id -u biralo >/dev/null 2>&1; then
            sudo useradd -m -s /bin/bash biralo
            echo "biralo:biralo" | sudo chpasswd
            sudo usermod -aG sudo biralo
            echo "biralo ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/biralo
          fi

      - name: Start SSH server (for PuTTY access)
        run: |
          # Password se login allow karna hai (default Ubuntu me kabhi-kabhi
          # off hota hai), isliye explicitly enable kar rahe hain.
          sudo sed -i 's/#*PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/#*PermitRootLogin.*/PermitRootLogin no/' /etc/ssh/sshd_config
          sudo systemctl enable ssh
          sudo systemctl restart ssh
          sudo systemctl status ssh --no-pager || true
          echo "✅ SSH server chal raha hai port 22 par"

      # FIX: Tailscale interface (tailscale0) se aane wala traffic Docker ke
      # published ports (3389, 8006) tak reliably nahi pahuch pa raha tha,
      # sirf loopback (127.0.0.1) se kaam kar raha tha. Ye classic
      # Tailscale + Docker issue hai jiski wajah "reverse path filtering"
      # (rp_filter) hoti hai — jab reply packet jis interface se gaya
      # nahi usi se wapas aata hai, kernel usse drop kar deta hai.
      # Ye settings loosen kar rahe hain taaki tailscale0 se aane wala
      # traffic bhi properly Docker tak pahunche.
      - name: Fix networking for Tailscale + Docker port access
        run: |
          echo "IP forwarding enable kar rahe hain..."
          sudo sysctl -w net.ipv4.ip_forward=1

          echo "rp_filter ko loose mode (2) me kar rahe hain..."
          sudo sysctl -w net.ipv4.conf.all.rp_filter=2
          sudo sysctl -w net.ipv4.conf.default.rp_filter=2
          for iface in /proc/sys/net/ipv4/conf/*/rp_filter; do
            echo 2 | sudo tee "$iface" > /dev/null || true
          done

          echo "UFW firewall check kar rahe hain..."
          if sudo ufw status | grep -q "Status: active"; then
            echo "UFW active hai, RDP/viewer ports allow kar rahe hain..."
            sudo ufw allow 3389/tcp
            sudo ufw allow 3389/udp
            sudo ufw allow 8006/tcp
          else
            echo "UFW active nahi hai, kuch karne ki zaroorat nahi"
          fi

          echo "✅ Networking fix apply ho gaya"

      # FIX: Public repo ka free runner 4-core CPU / 16GB RAM deta hai
      # (private repo hota to sirf 2-core/8GB milta) — ye confirm ho
      # chuka hai. Disk sirf ~14GB hoti hai total, isliye pehle usme se
      # unused pre-installed SDKs (dotnet, Android, GHC waghera) hata
      # ke jagah banate hain — ye ek well-known GitHub Actions trick hai,
      # isse aksar 10-20GB extra free space mil jaata hai. Ye Windows
      # image pull karne se PEHLE karna zaroori hai, warna cleanup
      # abhi-abhi pull ki hui image ko bhi hata sakta hai.
      - name: Free up disk space
        run: |
          echo "Pehle disk space (cleanup se pehle):"
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache 2>/dev/null || true
          sudo apt-get clean
          docker image prune --all --force 2>/dev/null || true
          echo "Baad me disk space (cleanup ke baad):"
          df -h /

      - name: Check available resources
        run: |
          echo "💾 Disk space:"
          df -h /
          echo ""
          echo "🧠 Memory:"
          free -h
          echo ""
          echo "⚙️ CPU cores:"
          nproc

      - name: Check Google Drive & restore Windows
        run: |
          if rclone lsf gdrive: --files-only | grep -qx "windows-backup.tar.gz"; then
            echo "✅ Drive par backup mila! Download ho raha hai..."
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              -d text="📦 Sir, your previous backup has been found on Drive. It will now be loaded — $(date '+%d-%m-%Y %I:%M %p')." > /dev/null || true
            rclone copy gdrive:windows-backup.tar.gz ./restore/ --progress
            sudo mkdir -p /opt/windows
            sudo tar -xzf ./restore/windows-backup.tar.gz -C /opt/
            echo "✅ Windows restore complete!"
          else
            echo "⚠️ Drive par backup nahi mila — fresh Windows install hoga"
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              -d text="⚠️ Sir, no backup was found on Drive. A new Windows instance is being created — $(date '+%d-%m-%Y %I:%M %p')." > /dev/null || true
          fi

      - name: Pull Windows image
        run: docker pull ghcr.io/dockur/windows

      - name: Start Windows
        run: |
          docker run -d --name windows \
            -e VERSION="11" \
            -e USERNAME="admin" \
            -e PASSWORD="Shrey222136" \
            -e RAM_SIZE="8G" \
            -e CPU_CORES="4" \
            -e DISK_SIZE="30G" \
            -p 3389:3389/tcp \
            -p 3389:3389/udp \
            -p 8006:8006 \
            -v /opt/windows:/storage \
            --device=/dev/kvm \
            --cap-add NET_ADMIN \
            ghcr.io/dockur/windows

      # tmate step yahan se hata diya — Tailscale se already SSH access
      # milta hai (biralo user se), isliye tmate ki zaroorat nahi thi.
      # Ye kabhi-kabhi apne server (tmate.io) se connect hone me permanently
      # atak jaata tha, jo pura workflow block kar deta tha.

      - name: Wait for RDP to be ready, then notify
        run: |
          echo "Windows boot hone ka wait kar rahe hain (RDP port 3389)..."
          READY=0
          for i in $(seq 1 210); do
            # sirf raw TCP connect nahi, asli RDP protocol ka pehla
            # response byte check kar rahe hain (RDP negotiation request
            # bhejke response dekhte hain) — isse false-positive nahi milega
            # jab tak Windows ke andar ka RDP service genuinely taiyar na ho.
            RESPONSE=$(timeout 3 bash -c '
              exec 3<>/dev/tcp/127.0.0.1/3389
              printf "\x03\x00\x00\x13\x0e\xe0\x00\x00\x00\x00\x00\x01\x00\x08\x00\x03\x00\x00\x00" >&3
              head -c 4 <&3 | xxd -p
            ' 2>/dev/null) || true
            if [ -n "$RESPONSE" ]; then
              READY=1
              break
            fi
            sleep 10
          done

          TS_IP=$(tailscale ip -4 2>/dev/null || echo "not available")

          if [ "$READY" = "1" ]; then
            echo "✅ RDP is genuinely up!"
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              -d text="🖥️ Sir, your RDP is now ready — $(date '+%d-%m-%Y %I:%M %p'). You can connect using this Tailscale IP: ${TS_IP}" > /dev/null || true
          else
            echo "⚠️ RDP abhi bhi ready nahi hua 35 min ke andar"
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              -d text="⚠️ Sir, RDP is taking longer than usual (35+ min) to come up — $(date '+%d-%m-%Y %I:%M %p'). Tailscale IP: ${TS_IP}. Please check via SSH: tailscale ssh biralo, then run: sudo docker logs windows --tail 50" > /dev/null || true
          fi

      - name: Show connection details
        run: |
          echo "🌐 Tailscale IP:"
          tailscale ip -4 || echo "not found"

      # FIX #2 (backup reliability): ab ek hi lamba "sleep" nahi hai.
      # Loop chal raha hai jo har 35 minute me Windows + Tailscale state
      # ka backup leke Drive par upload karta hai. Isliye agar beech me
      # runner crash ho jaye, error aaye, ya cancel ho jaye, to zyada se
      # zyada pichle 35 min ka hi data miss hoga — sab data nahi udega.
      # trap laga hai jo cancel/error/timeout signal milte hi turant
      # ek FINAL backup try karta hai (best-effort, kyunki timeout ke
      # baad runner ke paas sirf kuch second hi hote hain).
      - name: Keep alive with periodic backups
        run: |
          BACKUP_INTERVAL=2100   # 35 minute = 2100 sec
          TOTAL_SECONDS=19500    # ~5h25m total session
          ELAPSED=0

          # RDP (Windows) ke andar seedha popup bhejna is setup me reliable
          # nahi hai (VM isolated hai), isliye Telegram par turant message
          # jaata hai — RDP me ho ya na ho, phone pe turant pata chal jata hai.
          notify_telegram() {
            MSG=$1
            if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
              curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                -d chat_id="${TELEGRAM_CHAT_ID}" \
                -d text="${MSG}" > /dev/null || echo "   (Telegram notify fail hui, ignore kar ke aage badhte hain)"
            fi
          }

          # Ek file ko upload karta hai aur VERIFY karta hai ki Drive par
          # size match ho raha hai. Agar match nahi hua ya upload fail
          # hua, to 3 baar tak retry karta hai (5 sec gap ke saath).
          # Sirf tabhi "successful" bolta hai jab check pass ho.
          upload_and_verify() {
            LOCAL_FILE=$1
            REMOTE_NAME=$2
            ATTEMPT=1
            MAX_ATTEMPTS=3

            LOCAL_SIZE=$(stat -c%s "$LOCAL_FILE" 2>/dev/null) || LOCAL_SIZE=0

            while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
              echo "   Upload attempt $ATTEMPT/$MAX_ATTEMPTS: $REMOTE_NAME"
              rclone copy "$LOCAL_FILE" gdrive: --progress || true

              # rclone size command se Drive par actual size check karo
              REMOTE_SIZE=$(rclone size gdrive:"$REMOTE_NAME" --json 2>/dev/null | grep -o '"bytes":[0-9]*' | grep -o '[0-9]*') || REMOTE_SIZE=0

              if [ "$REMOTE_SIZE" = "$LOCAL_SIZE" ]; then
                echo "   ✅ Verified: $REMOTE_NAME ($LOCAL_SIZE bytes match)"
                return 0
              else
                echo "   ⚠️ Mismatch (local=$LOCAL_SIZE drive=$REMOTE_SIZE), retrying..."
                ATTEMPT=$((ATTEMPT + 1))
                sleep 5
              fi
            done

            echo "   ❌ FAILED to verify upload of $REMOTE_NAME after $MAX_ATTEMPTS tries!"
            return 1
          }

          backup_now() {
            echo "🔄 Backup shuru ho raha hai... ($(date))"
            OK=1

            if [ -d /opt/windows ] && [ "$(ls -A /opt/windows 2>/dev/null)" ]; then
              sudo tar -czf ~/windows-backup.tar.gz -C /opt windows
              sudo chown $USER:$USER ~/windows-backup.tar.gz
              upload_and_verify ~/windows-backup.tar.gz windows-backup.tar.gz || OK=0
            fi

            if [ -f /var/lib/tailscale/tailscaled.state ]; then
              sudo mkdir -p /tmp/ts-state
              sudo cp /var/lib/tailscale/tailscaled.state /tmp/ts-state/
              sudo tar -czf ~/tailscale-state.tar.gz -C /tmp/ts-state .
              sudo chown $USER:$USER ~/tailscale-state.tar.gz
              upload_and_verify ~/tailscale-state.tar.gz tailscale-state.tar.gz || OK=0
            fi

            rclone cleanup gdrive: || true

            if [ "$OK" = "1" ]; then
              echo "✅ Backup complete aur VERIFIED ($(date))"
              notify_telegram "✅ Sir, your backup has been completed and verified successfully — $(date '+%d-%m-%Y %I:%M %p')."
            else
              echo "❌ Backup me kuch verify nahi hua — agla cycle me phir try hoga ($(date))"
              notify_telegram "⚠️ Sir, there was an issue verifying your last backup. It will be retried automatically in the next cycle — $(date '+%d-%m-%Y %I:%M %p')."
            fi
          }

          # LOCK: agar timer-based aur RDP-disconnect-based backup ek
          # saath trigger ho jaye, to dono ek time pe tar/upload na karein
          # (isse file corrupt ho sakti hai). Ye lock ensure karta hai
          # ki ek waqt me sirf EK backup chale.
          LOCKFILE=/tmp/backup.lock

          run_backup_safely() {
            REASON=$1
            if ( set -o noclobber; echo "$$" > "$LOCKFILE" ) 2>/dev/null; then
              echo "🔔 Trigger: $REASON"
              backup_now
              rm -f "$LOCKFILE"
            else
              echo "⏭️ Backup already chal raha hai, skip ($REASON)"
            fi
          }

          # Cancel / error / timeout aate hi ek aakhri backup try karo
          trap 'echo "⚠️ Signal mila, emergency backup..."; notify_telegram "⚠️ Sir, your VPS session is shutting down. An emergency backup is being taken — $(date '"'"'+%d-%m-%Y %I:%M %p'"'"')."; run_backup_safely "shutdown signal"; exit 0' TERM INT

          notify_telegram "✅ Sir, your VPS setup is fully ready. Automatic backups will run every 35 minutes and on every RDP disconnect — $(date '+%d-%m-%Y %I:%M %p')."

          # ---- Background loop 1: har 35 min timer-based backup ----
          (
            ELAPSED=0
            while [ $ELAPSED -lt $TOTAL_SECONDS ]; do
              SLEEP_NOW=$BACKUP_INTERVAL
              REMAINING=$((TOTAL_SECONDS - ELAPSED))
              if [ $REMAINING -lt $BACKUP_INTERVAL ]; then
                SLEEP_NOW=$REMAINING
              fi
              sleep $SLEEP_NOW
              ELAPSED=$((ELAPSED + SLEEP_NOW))
              run_backup_safely "35-min timer"
            done
          ) &
          TIMER_PID=$!

          # ---- Background loop 2: RDP (port 3389) connect/disconnect detect ----
          # Har 15 sec check karta hai ki koi RDP client connected hai ya nahi.
          # CONNECT hote hi ek welcome message jaata hai, aur DISCONNECT hote hi
          # ek thank-you message + backup trigger hota hai. 3 min cooldown hai
          # taaki baar-baar connect/disconnect hone par backup spam na ho
          # (welcome/thank-you messages har baar jaate hain, sirf backup trigger
          # cooldown follow karta hai).
          (
            WAS_CONNECTED=0
            COOLDOWN_UNTIL=0
            NOW=0
            while [ $NOW -lt $TOTAL_SECONDS ]; do
              sleep 15
              NOW=$((NOW + 15))
              ACTIVE=$(ss -tn state established '( dport = :3389 or sport = :3389 )' 2>/dev/null | grep -c ESTAB || true)
              if [ "$ACTIVE" -gt 0 ] && [ "$WAS_CONNECTED" = "0" ]; then
                # abhi connect hua hai
                WAS_CONNECTED=1
                notify_telegram "🟢 Sir, you are now connected to your RDP. Enjoy! — $(date '+%d-%m-%Y %I:%M %p')"
              elif [ "$ACTIVE" -eq 0 ] && [ "$WAS_CONNECTED" = "1" ]; then
                # abhi disconnect hua hai
                WAS_CONNECTED=0
                notify_telegram "👋 Sir, thanks for coming. See you soon! — $(date '+%d-%m-%Y %I:%M %p')"
                if [ $NOW -ge $COOLDOWN_UNTIL ]; then
                  run_backup_safely "RDP disconnect detected"
                  COOLDOWN_UNTIL=$((NOW + 180))
                fi
              fi
            done
          ) &
          MONITOR_PID=$!

          wait $TIMER_PID $MONITOR_PID

      - name: Stop Windows cleanly
        if: always()
        run: |
          echo "Windows ko gracefully stop karne ki koshish (max 60 sec)..."
          timeout 60 sudo docker stop windows || true
          echo "Agar abhi bhi chal raha hai to force-kill kar rahe hain..."
          sudo docker kill windows || true
          sleep 5

      # Ye final backup ab safety-net hai — normal case me upar wale
      # loop ne already sab kuch upload kar diya hoga.
      - name: Final backup (safety net)
        if: always()
        run: |
          if [ -d /opt/windows ] && [ "$(ls -A /opt/windows 2>/dev/null)" ]; then
            sudo tar -czf ~/windows-backup.tar.gz -C /opt windows
            sudo chown $USER:$USER ~/windows-backup.tar.gz
            rclone copy ~/windows-backup.tar.gz gdrive: --progress
            rclone cleanup gdrive: || true
          fi
          if [ -f /var/lib/tailscale/tailscaled.state ]; then
            sudo mkdir -p /tmp/ts-state
            sudo cp /var/lib/tailscale/tailscaled.state /tmp/ts-state/
            sudo tar -czf ~/tailscale-state.tar.gz -C /tmp/ts-state .
            sudo chown $USER:$USER ~/tailscale-state.tar.gz
            rclone copy ~/tailscale-state.tar.gz gdrive: --progress
          fi
