name: Continuous Persistent VPS

on:
  workflow_dispatch:

concurrency:
  group: vps-session
  cancel-in-progress: false

env:
  RCLONE_CONFIG_GDRIVE_TYPE: drive
  RCLONE_CONFIG_GDRIVE_SCOPE: drive
  RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.RCLONE_DRIVE_TOKEN }}

  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

  TZ: Asia/Kolkata

jobs:
  vps-session:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. INSTALL REQUIRED PACKAGES
      # ============================================================

      - name: Install prerequisites
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            curl \
            unzip \
            sudo \
            net-tools \
            neofetch \
            iproute2 \
            openssh-server \
            jq \
            util-linux \
            ca-certificates \
            tar

          curl -fsSL https://rclone.org/install.sh | sudo bash

          echo "rclone:"
          rclone version | head -3

          echo "Docker:"
          docker --version


      # ============================================================
      # 3. TELEGRAM FUNCTIONS + VALIDATION
      # ============================================================

      - name: Setup Telegram
        run: |
          set -u

          API="https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}"

          telegram_send() {
            local MESSAGE="$1"
            local NOW

            NOW=$(TZ=Asia/Kolkata date '+%I:%M:%S %p')

            RESPONSE=$(curl -fsS \
              --max-time 20 \
              -X POST \
              "$API/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=${NOW} : ${MESSAGE}" \
              2>&1) || {
                echo "Telegram send failed:"
                echo "$RESPONSE"
                return 1
              }

            if ! echo "$RESPONSE" | jq -e '.ok == true' >/dev/null 2>&1; then
              echo "Telegram API returned an error:"
              echo "$RESPONSE"
              return 1
            fi

            return 0
          }

          export API

          # Test token
          GETME=$(curl -fsS \
            --max-time 20 \
            "$API/getMe" \
            2>&1) || {
              echo "ERROR: Telegram bot token/API connection failed."
              echo "$GETME"
              exit 1
            }

          if ! echo "$GETME" | jq -e '.ok == true' >/dev/null 2>&1; then
            echo "ERROR: Telegram token is invalid."
            echo "$GETME"
            exit 1
          fi

          BOT_NAME=$(echo "$GETME" | jq -r '.result.username // "unknown"')

          echo "Telegram bot: @$BOT_NAME"

          # Export helper for later steps
          cat > /tmp/telegram_functions.sh <<'EOF'
          telegram_send() {
            local MESSAGE="$1"
            local NOW
            local API="https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}"

            NOW=$(TZ=Asia/Kolkata date '+%I:%M:%S %p')

            RESPONSE=$(curl -fsS \
              --max-time 20 \
              -X POST \
              "$API/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=${NOW} : ${MESSAGE}" \
              2>&1) || {
                echo "Telegram send failed:"
                echo "$RESPONSE"
                return 1
              }

            if ! echo "$RESPONSE" | jq -e '.ok == true' >/dev/null 2>&1; then
              echo "Telegram API error:"
              echo "$RESPONSE"
              return 1
            fi

            return 0
          }

          telegram_keyboard() {
            local MESSAGE="$1"
            local KEYBOARD

            KEYBOARD='{"inline_keyboard":[[{"text":"💾 BACKUP & STOP","callback_data":"backup_stop"}],[{"text":"❌ STOP WITHOUT BACKUP","callback_data":"stop_no_backup"}]]}'

            local NOW
            local API="https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}"

            NOW=$(TZ=Asia/Kolkata date '+%I:%M:%S %p')

            curl -fsS \
              --max-time 20 \
              -X POST \
              "$API/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=${NOW} : ${MESSAGE}" \
              --data-urlencode "reply_markup=${KEYBOARD}" \
              >/tmp/telegram-keyboard-response.json 2>&1 || {
                echo "Telegram keyboard send failed:"
                cat /tmp/telegram-keyboard-response.json 2>/dev/null || true
                return 1
              }
          }

          telegram_answer_callback() {
            local CALLBACK_ID="$1"
            local TEXT="$2"
            local API="https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}"

            curl -fsS \
              --max-time 20 \
              -X POST \
              "$API/answerCallbackQuery" \
              --data-urlencode "callback_query_id=${CALLBACK_ID}" \
              --data-urlencode "text=${TEXT}" \
              >/dev/null 2>&1 || true
          }

          telegram_send || true

          # Send first startup message
          telegram_send "🚀 VPS workflow started. Telegram connection is working." || true

          echo "Telegram setup complete."


      # ============================================================
      # 4. HOSTNAME
      # ============================================================

      - name: Set hostname
        run: |
          sudo hostnamectl set-hostname biralo
          hostname


      # ============================================================
      # 5. TAILSCALE
      # ============================================================

      - name: Install Tailscale
        run: |
          set -e

          curl -fsSL https://tailscale.com/install.sh | sh


      # ============================================================
      # 6. RESTORE TAILSCALE STATE
      # ============================================================

      - name: Restore Tailscale state
        run: |
          set -u

          source /tmp/telegram_functions.sh

          mkdir -p ./restore

          if rclone lsf gdrive: --files-only | grep -Fxq "tailscale-state.tar.gz"; then

            telegram_send "🔄 Previous Tailscale state found. Restoring it..." || true

            if rclone copyto \
              "gdrive:tailscale-state.tar.gz" \
              "./restore/tailscale-state.tar.gz"; then

              sudo mkdir -p /var/lib/tailscale

              sudo tar \
                -xzf ./restore/tailscale-state.tar.gz \
                -C /var/lib/tailscale/

              sudo chmod 600 \
                /var/lib/tailscale/tailscaled.state \
                2>/dev/null || true

              telegram_send "✅ Tailscale state restored successfully." || true

            else
              telegram_send "⚠️ Tailscale state download failed. A new Tailscale state will be created." || true
            fi

          else

            telegram_send "ℹ️ No previous Tailscale state found. Creating a new one." || true

          fi


      # ============================================================
      # 7. START TAILSCALE
      # ============================================================

      - name: Start Tailscale
        run: |
          set -e

          sudo tailscaled >/tmp/tailscaled.log 2>&1 &

          sleep 8

          sudo tailscale up \
            --authkey "${{ secrets.TAILSCALE_AUTHKEY }}" \
            --hostname=biralo \
            --ssh

          echo "Tailscale IPv4:"
          tailscale ip -4

          source /tmp/telegram_functions.sh

          TSIP=$(tailscale ip -4 | head -1)

          telegram_send "🌐 Tailscale is online. VPS IP: ${TSIP}" || true


      # ============================================================
      # 8. CREATE LINUX USER
      # ============================================================

      - name: Create user biralo
        run: |
          set -e

          if ! id -u biralo >/dev/null 2>&1; then

            sudo useradd \
              -m \
              -s /bin/bash \
              biralo

            echo "biralo:biralo" | sudo chpasswd

            sudo usermod -aG sudo biralo

            echo "biralo ALL=(ALL) NOPASSWD:ALL" \
              | sudo tee /etc/sudoers.d/biralo >/dev/null

            sudo chmod 440 /etc/sudoers.d/biralo

          fi


      # ============================================================
      # 9. SSH
      # ============================================================

      - name: Start SSH
        run: |
          set -e

          sudo sed -i \
            's/^#\?PasswordAuthentication.*/PasswordAuthentication yes/' \
            /etc/ssh/sshd_config

          sudo sed -i \
            's/^#\?PermitRootLogin.*/PermitRootLogin no/' \
            /etc/ssh/sshd_config

          sudo systemctl enable ssh
          sudo systemctl restart ssh

          sudo systemctl status ssh --no-pager || true


      # ============================================================
      # 10. NETWORK
      # ============================================================

      - name: Configure networking
        run: |
          set -e

          sudo sysctl -w net.ipv4.ip_forward=1

          sudo sysctl -w net.ipv4.conf.all.rp_filter=2
          sudo sysctl -w net.ipv4.conf.default.rp_filter=2

          for iface in /proc/sys/net/ipv4/conf/*/rp_filter; do
            echo 2 | sudo tee "$iface" >/dev/null || true
          done

          if sudo ufw status 2>/dev/null | grep -q "Status: active"; then
            sudo ufw allow 3389/tcp
            sudo ufw allow 3389/udp
            sudo ufw allow 8006/tcp
          fi


      # ============================================================
      # 11. DISK CLEANUP
      # ============================================================

      - name: Free disk space
        run: |
          echo "Before:"
          df -h /

          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache \
            2>/dev/null || true

          sudo apt-get clean

          docker image prune -af 2>/dev/null || true

          echo "After:"
          df -h /


      # ============================================================
      # 12. RESOURCE CHECK
      # ============================================================

      - name: Check resources
        run: |
          echo "===== DISK ====="
          df -h /

          echo
          echo "===== MEMORY ====="
          free -h

          echo
          echo "===== CPU ====="
          nproc


      # ============================================================
      # 13. TELEGRAM STOP LISTENER
      # ============================================================

      - name: Start Telegram stop listener
        run: |
          set -u

          source /tmp/telegram_functions.sh

          REQUEST_FILE="/tmp/vps-stop-request"
          OFFSET_FILE="/tmp/telegram-offset"

          rm -f "$REQUEST_FILE"
          rm -f "$OFFSET_FILE"

          API="https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}"

          # Check whether webhook is blocking getUpdates
          WEBHOOK=$(curl -fsS \
            --max-time 20 \
            "$API/getWebhookInfo" \
            2>/dev/null || echo '{}')

          WEBHOOK_URL=$(echo "$WEBHOOK" | jq -r '.result.url // ""')

          if [ -n "$WEBHOOK_URL" ]; then
            echo "Telegram webhook detected: $WEBHOOK_URL"

            telegram_send \
              "⚠️ Telegram webhook detected. /stop control may not work until the webhook is removed." \
              || true
          fi

          # Ignore old pending messages.
          INITIAL=$(curl -fsS \
            --max-time 30 \
            "$API/getUpdates?limit=100&timeout=0" \
            2>/dev/null || echo '{"ok":false,"result":[]}')

          LAST_ID=$(echo "$INITIAL" \
            | jq -r '[.result[]?.update_id] | max // -1')

          NEXT_OFFSET=$((LAST_ID + 1))

          echo "$NEXT_OFFSET" > "$OFFSET_FILE"

          echo "Telegram listener starting with offset $NEXT_OFFSET"

          telegram_send \
            "🟢 Stop controller is active. Send /stop anytime to safely shut down this VPS." \
            || true

          while true; do

            if [ -f "$REQUEST_FILE" ]; then
              exit 0
            fi

            OFFSET=$(cat "$OFFSET_FILE" 2>/dev/null || echo "0")

            RESPONSE=$(curl -fsS \
              --max-time 30 \
              --get \
              "$API/getUpdates" \
              --data-urlencode "offset=${OFFSET}" \
              --data-urlencode "limit=20" \
              --data-urlencode "timeout=20" \
              --data-urlencode 'allowed_updates=["message","callback_query"]' \
              2>/tmp/telegram-poll-error.log || true)

            if ! echo "$RESPONSE" | jq -e '.ok == true' >/dev/null 2>&1; then
              echo "Telegram polling error:"
              cat /tmp/telegram-poll-error.log 2>/dev/null || true
              echo "$RESPONSE"

              sleep 5
              continue
            fi

            echo "$RESPONSE" \
              | jq -c '.result[]?' \
              | while IFS= read -r UPDATE; do

                UPDATE_ID=$(echo "$UPDATE" | jq -r '.update_id')

                echo $((UPDATE_ID + 1)) > "$OFFSET_FILE"

                CHAT_ID=$(echo "$UPDATE" \
                  | jq -r '.message.chat.id // .callback_query.message.chat.id // empty')

                if [ -z "$CHAT_ID" ]; then
                  continue
                fi

                if [ "$CHAT_ID" != "$TELEGRAM_CHAT_ID" ]; then
                  echo "Ignoring Telegram update from unauthorized chat."
                  continue
                fi

                TEXT=$(echo "$UPDATE" \
                  | jq -r '.message.text // empty')

                CALLBACK=$(echo "$UPDATE" \
                  | jq -r '.callback_query.data // empty')

                CALLBACK_ID=$(echo "$UPDATE" \
                  | jq -r '.callback_query.id // empty')

                # --------------------------------------------------
                # /stop command
                # --------------------------------------------------

                if [[ "$TEXT" == "/stop" || "$TEXT" == "/stop@"* ]]; then

                  telegram_keyboard \
                    "🛑 Shutdown request received. Choose what should happen:" \
                    || true

                  continue
                fi

                # --------------------------------------------------
                # BACKUP + STOP
                # --------------------------------------------------

                if [ "$CALLBACK" = "backup_stop" ]; then

                  telegram_answer_callback \
                    "$CALLBACK_ID" \
                    "Backup + shutdown selected." \
                    || true

                  echo "backup" > "$REQUEST_FILE"

                  continue
                fi

                # --------------------------------------------------
                # STOP WITHOUT BACKUP
                # --------------------------------------------------

                if [ "$CALLBACK" = "stop_no_backup" ]; then

                  telegram_answer_callback \
                    "$CALLBACK_ID" \
                    "Shutdown without backup selected." \
                    || true

                  echo "nobackup" > "$REQUEST_FILE"

                  continue
                fi

              done

          done
        background: true


      # ============================================================
      # 14. CHECK WINDOWS BACKUP
      # ============================================================

      - name: Check and restore Windows backup
        run: |
          set -u

          source /tmp/telegram_functions.sh

          mkdir -p ./restore

          if rclone lsf gdrive: --files-only \
            | grep -Fxq "windows-backup.tar.gz"; then

            echo "Windows backup found."

            echo "WINDOWS_MODE=restore" >> "$GITHUB_ENV"

            telegram_send \
              "📦 Previous Windows backup found on Google Drive." \
              || true

            telegram_send \
              "⬇️ Backup load ho raha hai. Please wait..." \
              || true

            LOGFILE="/tmp/restore-progress.log"

            rm -f "$LOGFILE"

            rclone copyto \
              "gdrive:windows-backup.tar.gz" \
              "./restore/windows-backup.tar.gz" \
              --stats 5s \
              --stats-one-line \
              --stats-log-level NOTICE \
              >"$LOGFILE" 2>&1 &

            RCLONE_PID=$!

            LAST_MILESTONE=0

            while kill -0 "$RCLONE_PID" 2>/dev/null; do

              sleep 5

              LINE=$(tail -n 30 "$LOGFILE" 2>/dev/null \
                | grep '%' \
                | tail -1 || true)

              PCT=$(echo "$LINE" \
                | grep -oE '[0-9]{1,3}%' \
                | tail -1 \
                | tr -d '%' || true)

              ETA=$(echo "$LINE" \
                | grep -oE 'ETA [^,]+' \
                | tail -1 || true)

              if [[ "$PCT" =~ ^[0-9]+$ ]]; then

                MILESTONE=$((PCT / 10 * 10))

                if [ "$MILESTONE" -ge 10 ] &&
                   [ "$MILESTONE" -le 90 ] &&
                   [ "$MILESTONE" -gt "$LAST_MILESTONE" ]; then

                  if [ -n "$ETA" ]; then
                    telegram_send \
                      "⬇️ Backup loading: ${MILESTONE}% complete — ${ETA} remaining." \
                      || true
                  else
                    telegram_send \
                      "⬇️ Backup loading: ${MILESTONE}% complete." \
                      || true
                  fi

                  echo "Restore: ${MILESTONE}% ${ETA}"

                  LAST_MILESTONE=$MILESTONE
                fi
              fi

            done

            if wait "$RCLONE_PID"; then
              RCLONE_RC=0
            else
              RCLONE_RC=$?
            fi

            if [ "$RCLONE_RC" -ne 0 ]; then

              echo "Restore download failed."

              telegram_send \
                "❌ Windows backup download failed." \
                || true

              exit 1
            fi

            telegram_send \
              "⬇️ Backup loading: 100% complete." \
              || true

            echo "Extracting Windows backup..."

            sudo rm -rf /opt/windows
            sudo mkdir -p /opt/windows

            sudo tar \
              -xzf ./restore/windows-backup.tar.gz \
              -C /opt/

            rm -f ./restore/windows-backup.tar.gz

            telegram_send \
              "📦 Backup extracted successfully. Windows is starting." \
              || true

          else

            echo "No Windows backup found."

            echo "WINDOWS_MODE=fresh" >> "$GITHUB_ENV"

            telegram_send \
              "⚠️ No previous Windows backup was found." \
              || true

            telegram_send \
              "🪟 Fresh Windows installation is starting. I will report download progress when available." \
              || true

          fi


      # ============================================================
      # 15. PULL DOCKER WINDOWS IMAGE
      # ============================================================

      - name: Pull Windows Docker image
        run: |
          docker pull ghcr.io/dockur/windows


      # ============================================================
      # 16. START WINDOWS
      # ============================================================

      - name: Start Windows
        run: |
          set -e

          docker rm -f windows 2>/dev/null || true

          docker run -d \
            --name windows \
            -e VERSION="11" \
            -e USERNAME="admin" \
            -e PASSWORD="Shrey222136" \
            -e RAM_SIZE="10G" \
            -e CPU_CORES="4" \
            -e DISK_SIZE="60G" \
            -p 3389:3389/tcp \
            -p 3389:3389/udp \
            -p 8006:8006 \
            -v /opt/windows:/storage \
            --device=/dev/kvm \
            --cap-add NET_ADMIN \
            --stop-timeout 120 \
            ghcr.io/dockur/windows

          echo "Windows container started."


      # ============================================================
      # 17. WINDOWS INSTALL / RDP READY
      # ============================================================

      - name: Wait for Windows and RDP
        run: |
          set -u

          source /tmp/telegram_functions.sh

          READY=0
          LAST_INSTALL_MILESTONE=0
          LAST_STAGE=""

          telegram_send \
            "⏳ Windows is booting. Waiting for RDP..." \
            || true

          for i in $(seq 1 240); do

            # ------------------------------------------------------
            # Check container
            # ------------------------------------------------------

            if ! docker inspect windows >/dev/null 2>&1; then

              telegram_send \
                "❌ Windows container disappeared unexpectedly." \
                || true

              exit 1
            fi

            if ! docker inspect \
              -f '{{.State.Running}}' \
              windows 2>/dev/null \
              | grep -q true; then

              echo "Windows container is not running."

            fi


            # ------------------------------------------------------
            # Fresh installation progress
            # ------------------------------------------------------

            if [ "${WINDOWS_MODE:-fresh}" = "fresh" ]; then

              LOGS=$(docker logs windows 2>&1 | tail -n 150 || true)

              PROGRESS_LINE=$(printf '%s\n' "$LOGS" \
                | grep -Ei \
                  'download|downloading|windows.*%|iso.*%' \
                | grep -E '[0-9]{1,3}%' \
                | tail -1 || true)

              PCT=$(printf '%s\n' "$PROGRESS_LINE" \
                | grep -oE '[0-9]{1,3}%' \
                | tail -1 \
                | tr -d '%' || true)

              ETA=$(printf '%s\n' "$PROGRESS_LINE" \
                | grep -oE 'ETA [^,]+' \
                | tail -1 || true)

              if [[ "$PCT" =~ ^[0-9]+$ ]]; then

                MILESTONE=$((PCT / 10 * 10))

                if [ "$MILESTONE" -ge 10 ] &&
                   [ "$MILESTONE" -le 90 ] &&
                   [ "$MILESTONE" -gt "$LAST_INSTALL_MILESTONE" ]; then

                  if [ -n "$ETA" ]; then
                    telegram_send \
                      "🪟 Windows download: ${MILESTONE}% complete — ${ETA} remaining." \
                      || true
                  else
                    telegram_send \
                      "🪟 Windows download: ${MILESTONE}% complete." \
                      || true
                  fi

                  echo "Windows download: ${MILESTONE}%"

                  LAST_INSTALL_MILESTONE=$MILESTONE
                fi

              fi


              # ----------------------------------------------------
              # Stage notifications
              # ----------------------------------------------------

              if printf '%s\n' "$LOGS" | grep -qi "Downloading Windows"; then

                if [ "$LAST_STAGE" != "download" ]; then
                  telegram_send \
                    "⬇️ Windows image download has started." \
                    || true

                  LAST_STAGE="download"
                fi

              elif printf '%s\n' "$LOGS" | grep -qi "Booting Windows"; then

                if [ "$LAST_STAGE" != "boot"; then
                  telegram_send \
                    "🪟 Windows image is ready and Windows is booting." \
                    || true

                  LAST_STAGE="boot"
                fi

              fi

            fi


            # ------------------------------------------------------
            # RDP port test
            # ------------------------------------------------------

            if timeout 3 bash -c '</dev/tcp/127.0.0.1/3389' \
              >/dev/null 2>&1; then

              if [ "$READY" -eq 0 ]; then

                READY=1

                TSIP=$(tailscale ip -4 | head -1 || true)

                telegram_send \
                  "🟢 RDP READY! Connect using ${TSIP}:3389 — Windows user: admin" \
                  || true

                echo "RDP is READY."
                break
              fi
            fi

            sleep 5

          done

          if [ "$READY" -ne 1 ]; then

            echo "RDP did not become ready."

            docker logs windows --tail 100 || true

            telegram_send \
              "❌ RDP did not become ready within the expected time." \
              || true

            exit 1
          fi


      # ============================================================
      # 18. MAIN VPS MONITOR
      # ============================================================

      - name: Keep VPS alive, monitor RDP, backup timer and Telegram
        run: |
          set -u

          source /tmp/telegram_functions.sh

          BACKUP_INTERVAL=2100
          LAST_BACKUP=$(date +%s)

          WAS_CONNECTED=0
          CONTROLLED_STOP=0

          REQUEST_FILE="/tmp/vps-stop-request"

          echo "Main VPS monitor started."

          telegram_send \
            "🟢 VPS is fully ready. Automatic backup every 35 minutes is active." \
            || true

          telegram_send \
            "📱 You can send /stop in Telegram anytime to safely shut down." \
            || true


          # ========================================================
          # BACKUP FUNCTION
          # ========================================================

          run_backup() {

            local REASON="$1"

            if ! mkdir /tmp/windows-backup.lock 2>/dev/null; then

              telegram_send \
                "ℹ️ Backup requested (${REASON}), but another backup is already running. Skipping duplicate backup." \
                || true

              return 0
            fi

            trap 'rmdir /tmp/windows-backup.lock 2>/dev/null || true' RETURN

            echo
            echo "=========================================="
            echo "BACKUP START"
            echo "Reason: $REASON"
            echo "Time: $(date)"
            echo "=========================================="

            telegram_send \
              "💾 Backup liya ja raha hai — reason: ${REASON}" \
              || true

            BACKUP_FILE="/opt/windows-backup.tar.gz"

            # ------------------------------------------------------
            # Pause Windows
            # ------------------------------------------------------

            PAUSED=0

            if docker inspect windows >/dev/null 2>&1; then

              RUNNING=$(docker inspect \
                -f '{{.State.Running}}' \
                windows 2>/dev/null || echo false)

              if [ "$RUNNING" = "true" ]; then

                echo "Pausing Windows..."

                docker pause windows >/dev/null 2>&1 || true

                PAUSED=1
              fi
            fi


            # ------------------------------------------------------
            # Create compressed backup
            # ------------------------------------------------------

            echo "Creating backup archive..."

            if sudo tar \
              --sparse \
              -C /opt \
              -czf "$BACKUP_FILE" \
              windows; then

              TAR_RC=0
            else
              TAR_RC=$?
            fi


            # ------------------------------------------------------
            # Unpause Windows
            # ------------------------------------------------------

            if [ "$PAUSED" -eq 1 ]; then
              docker unpause windows >/dev/null 2>&1 || true
            fi


            if [ "$TAR_RC" -ne 0 ]; then

              echo "Backup archive creation failed."

              telegram_send \
                "❌ Backup archive create nahi ho paya." \
                || true

              return 1
            fi


            LOCAL_SIZE=$(stat -c%s "$BACKUP_FILE" 2>/dev/null || echo 0)

            if [ "$LOCAL_SIZE" -le 0 ]; then

              telegram_send \
                "❌ Backup file empty hai. Upload nahi kiya jayega." \
                || true

              return 1
            fi

            LOCAL_HUMAN=$(numfmt --to=iec "$LOCAL_SIZE" 2>/dev/null || echo "${LOCAL_SIZE} bytes")

            echo "Local backup size: $LOCAL_SIZE bytes ($LOCAL_HUMAN)"

            telegram_send \
              "📦 Backup archive ready: ${LOCAL_HUMAN}. Google Drive upload start ho raha hai." \
              || true


            # ------------------------------------------------------
            # UPLOAD + EXACT VERIFICATION
            # ------------------------------------------------------

            LOGFILE="/tmp/rclone-upload.log"

            UPLOAD_OK=0

            for ATTEMPT in 1 2 3; do

              echo
              echo "Upload attempt $ATTEMPT/3"

              rm -f "$LOGFILE"

              rclone copyto \
                "$BACKUP_FILE" \
                "gdrive:windows-backup.tar.gz" \
                --stats 5s \
                --stats-one-line \
                --stats-log-level NOTICE \
                --retries 3 \
                --low-level-retries 10 \
                --drive-chunk-size 64M \
                >"$LOGFILE" 2>&1 &

              RCLONE_PID=$!

              LAST_MILESTONE=0

              while kill -0 "$RCLONE_PID" 2>/dev/null; do

                sleep 5

                LINE=$(tail -n 30 "$LOGFILE" 2>/dev/null \
                  | grep '%' \
                  | tail -1 || true)

                PCT=$(echo "$LINE" \
                  | grep -oE '[0-9]{1,3}%' \
                  | tail -1 \
                  | tr -d '%' || true)

                ETA=$(echo "$LINE" \
                  | grep -oE 'ETA [^,]+' \
                  | tail -1 || true)

                if [[ "$PCT" =~ ^[0-9]+$ ]]; then

                  MILESTONE=$((PCT / 10 * 10))

                  if [ "$MILESTONE" -ge 10 ] &&
                     [ "$MILESTONE" -le 90 ] &&
                     [ "$MILESTONE" -gt "$LAST_MILESTONE" ]; then

                    if [ -n "$ETA" ]; then

                      telegram_send \
                        "📤 Backup upload: ${MILESTONE}% complete — ${ETA} remaining." \
                        || true

                      echo "Upload: ${MILESTONE}% | $ETA"

                    else

                      telegram_send \
                        "📤 Backup upload: ${MILESTONE}% complete." \
                        || true

                      echo "Upload: ${MILESTONE}%"

                    fi

                    LAST_MILESTONE=$MILESTONE

                  fi

                fi

              done


              if wait "$RCLONE_PID"; then
                RCLONE_RC=0
              else
                RCLONE_RC=$?
              fi


              if [ "$RCLONE_RC" -ne 0 ]; then

                echo "rclone upload failed with code $RCLONE_RC"

                tail -n 50 "$LOGFILE" || true

                telegram_send \
                  "⚠️ Backup upload attempt ${ATTEMPT}/3 failed. Retrying..." \
                  || true

                sleep 10

                continue
              fi


              # ----------------------------------------------------
              # FINAL 100%
              # ----------------------------------------------------

              telegram_send \
                "📤 Backup upload: 100% complete. Google Drive verification starting..." \
                || true


              # ----------------------------------------------------
              # EXACT REMOTE FILE VERIFICATION
              # ----------------------------------------------------

              VERIFY_JSON=$(mktemp)

              if rclone lsjson \
                "gdrive:windows-backup.tar.gz" \
                --stat \
                --no-modtime \
                --no-mimetype \
                >"$VERIFY_JSON" 2>/tmp/rclone-verify-error.log; then

                REMOTE_SIZE=$(jq -r '.Size // -1' "$VERIFY_JSON" 2>/dev/null || echo -1)
                REMOTE_ID=$(jq -r '.ID // ""' "$VERIFY_JSON" 2>/dev/null || echo "")

              else

                REMOTE_SIZE=-1
                REMOTE_ID=""

              fi


              echo "Local size : $LOCAL_SIZE"
              echo "Remote size: $REMOTE_SIZE"
              echo "Remote ID  : $REMOTE_ID"


              if [ "$REMOTE_SIZE" = "$LOCAL_SIZE" ] &&
                 [ "$REMOTE_SIZE" -gt 0 ] &&
                 [ -n "$REMOTE_ID" ]; then

                UPLOAD_OK=1

                rm -f "$VERIFY_JSON"

                telegram_send \
                  "✅ Backup successfully uploaded and verified on Google Drive. Size: ${LOCAL_HUMAN}" \
                  || true

                break

              else

                echo "Verification mismatch."

                echo "Verification JSON:"
                cat "$VERIFY_JSON" 2>/dev/null || true

                echo "Verification error:"
                cat /tmp/rclone-verify-error.log 2>/dev/null || true

                rm -f "$VERIFY_JSON"

                telegram_send \
                  "⚠️ Drive verification mismatch on attempt ${ATTEMPT}/3. Local=${LOCAL_SIZE} bytes, Drive=${REMOTE_SIZE} bytes. Retrying..." \
                  || true

                sleep 15

              fi

            done


            # ------------------------------------------------------
            # BACKUP RESULT
            # ------------------------------------------------------

            if [ "$UPLOAD_OK" -eq 1 ]; then

              rm -f "$BACKUP_FILE"

              telegram_send \
                "🎉 Backup complete. VPS data is safely backed up on Google Drive." \
                || true

              echo "BACKUP SUCCESS"

              return 0

            else

              telegram_send \
                "❌ Backup upload/verification failed after 3 attempts. Local backup is being kept for safety." \
                || true

              echo "BACKUP FAILED"

              return 1
            fi
          }


          # ========================================================
          # MAIN LOOP
          # ========================================================

          while true; do

            NOW_SECONDS=$(date +%s)


            # ======================================================
            # TELEGRAM STOP REQUEST
            # ======================================================

            if [ -f "$REQUEST_FILE" ]; then

              REQUEST=$(cat "$REQUEST_FILE" 2>/dev/null || echo "")

              rm -f "$REQUEST_FILE"

              CONTROLLED_STOP=1

              if [ "$REQUEST" = "backup" ]; then

                telegram_send \
                  "🛑 Backup & Stop selected. VPS ko safely backup karke shutdown kar raha hoon." \
                  || true

                run_backup "Telegram BACKUP & STOP" || true

              elif [ "$REQUEST" = "nobackup" ]; then

                telegram_send \
                  "🛑 Stop without backup selected. Is baar backup nahi liya jayega." \
                  || true

              fi

              break
            fi


            # ======================================================
            # 35-MINUTE BACKUP
            # ======================================================

            ELAPSED=$((NOW_SECONDS - LAST_BACKUP))

            if [ "$ELAPSED" -ge "$BACKUP_INTERVAL" ]; then

              echo "35-minute backup timer triggered."

              run_backup "35-minute timer" || true

              LAST_BACKUP=$(date +%s)

            fi


            # ======================================================
            # RDP CONNECTION DETECTION
            # ======================================================

            CONNECTIONS=$(sudo ss -Htn state established \
              '( sport = :3389 or dport = :3389 )' \
              2>/dev/null \
              | awk '
                {
                  local_addr=$4
                  remote_addr=$5

                  if (
                    local_addr !~ /^127\.0\.0\.1:/ &&
                    local_addr !~ /^\[::1\]:/
                  ) {
                    count++
                  }
                }
                END {
                  print count+0
                }
              ')


            CONNECTIONS=${CONNECTIONS:-0}


            # ------------------------------------------------------
            # RDP CONNECTED
            # ------------------------------------------------------

            if [ "$CONNECTIONS" -gt 0 ] &&
               [ "$WAS_CONNECTED" -eq 0 ]; then

              WAS_CONNECTED=1

              echo "RDP connection detected."

              telegram_send \
                "🟢 RDP CONNECTED. Your Windows VPS is being used." \
                || true

            fi


            # ------------------------------------------------------
            # RDP DISCONNECTED
            # ------------------------------------------------------

            if [ "$CONNECTIONS" -eq 0 ] &&
               [ "$WAS_CONNECTED" -eq 1 ]; then

              WAS_CONNECTED=0

              echo "RDP disconnected."

              telegram_send \
                "🔴 RDP DISCONNECTED. Automatic backup is starting now." \
                || true

              run_backup "RDP disconnect" || true

              LAST_BACKUP=$(date +%s)

            fi


            sleep 5

          done


          # ========================================================
          # CONTROLLED STOP
          # ========================================================

          echo "Controlled shutdown requested."

          echo "CONTROLLED_STOP=1" >> "$GITHUB_ENV"

          if [ "$CONTROLLED_STOP" -eq 1 ]; then

            if [ -f "/tmp/vps-stop-request" ]; then
              rm -f "/tmp/vps-stop-request"
            fi

            telegram_send \
              "⏹️ VPS shutdown process started." \
              || true

          fi


      # ============================================================
      # 19. STOP WINDOWS SAFELY
      # ============================================================

      - name: Stop Windows safely
        if: ${{ success() }}
        run: |
          set -u

          source /tmp/telegram_functions.sh

          if docker inspect windows >/dev/null 2>&1; then

            RUNNING=$(docker inspect \
              -f '{{.State.Running}}' \
              windows 2>/dev/null || echo false)

            if [ "$RUNNING" = "true" ]; then

              telegram_send \
                "⏹️ Windows container ko safely stop kiya ja raha hai..." \
                || true

              timeout 150 \
                docker stop --time 120 windows \
                || true

            fi

          fi

          docker rm windows 2>/dev/null || true

          telegram_send \
            "✅ Windows stopped safely." \
            || true


      # ============================================================
      # 20. SAVE TAILSCALE STATE
      # ============================================================

      - name: Save Tailscale state
        if: ${{ success() }}
        run: |
          set -u

          source /tmp/telegram_functions.sh

          mkdir -p /tmp/tailscale-backup

          if [ -f /var/lib/tailscale/tailscaled.state ]; then

            sudo tar \
              -czf /tmp/tailscale-state.tar.gz \
              -C /var/lib/tailscale \
              tailscaled.state

            rclone copyto \
              /tmp/tailscale-state.tar.gz \
              gdrive:tailscale-state.tar.gz \
              --retries 3 \
              --low-level-retries 10 \
              || true

            telegram_send \
              "🌐 Tailscale state saved for the next VPS run." \
              || true

          fi


      # ============================================================
      # 21. FINAL TELEGRAM
      # ============================================================

      - name: Final Telegram notification
        if: ${{ success() }}
        run: |
          set -u

          source /tmp/telegram_functions.sh

          telegram_send \
            "🏁 VPS workflow has finished. The Windows VPS has been stopped cleanly." \
            || true


      # ============================================================
      # 22. BEST-EFFORT EMERGENCY NOTICE ON FAILURE/CANCEL
      # ============================================================

      - name: Emergency Telegram notification
        if: ${{ failure() || cancelled() }}
        continue-on-error: true
        run: |
          set -u

          source /tmp/telegram_functions.sh

          telegram_send \
            "⚠️ GitHub workflow failure/cancellation detected. The automatic controlled Telegram shutdown was not used. Please check the Actions log." \
            || true
