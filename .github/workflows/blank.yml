name: Continuous Persistent VPS

on:
  workflow_dispatch:

concurrency:
  group: vps-session
  cancel-in-progress: false

env:
  RCLONE_CONFIG_GDRIVE_TYPE: drive
  RCLONE_CONFIG_GDRIVE_SCOPE: drive
  RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.RCLONE_DRIVE_TOKEN }}

  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

  TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
  WINDOWS_PASSWORD: ${{ secrets.WINDOWS_PASSWORD }}

  TZ: Asia/Kolkata

jobs:
  vps-session:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # 2. INSTALL TOOLS
      # ============================================================
      - name: Install tools
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            curl \
            jq \
            unzip \
            sudo \
            net-tools \
            iproute2 \
            openssh-server \
            util-linux \
            ca-certificates

          curl -fsSL https://rclone.org/install.sh | sudo bash

          rclone version | head -3


      # ============================================================
      # 3. TELEGRAM + SECRET VALIDATION
      # ============================================================
      - name: Validate secrets and Telegram
        run: |
          set -e

          test -n "$WINDOWS_PASSWORD" || {
            echo "WINDOWS_PASSWORD secret is missing"
            exit 1
          }

          test -n "$TELEGRAM_BOT_TOKEN" || {
            echo "TELEGRAM_BOT_TOKEN secret is missing"
            exit 1
          }

          test -n "$TELEGRAM_CHAT_ID" || {
            echo "TELEGRAM_CHAT_ID secret is missing"
            exit 1
          }

          test -n "$TAILSCALE_AUTHKEY" || {
            echo "TAILSCALE_AUTHKEY secret is missing"
            exit 1
          }

          telegram_send() {
            curl -fsS \
              --max-time 20 \
              -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=$(date '+%I:%M:%S %p') : $1" \
              >/dev/null || true
          }

          curl -fsS \
            --max-time 20 \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getMe" \
            | jq -e '.ok == true' >/dev/null

          curl -fsS \
            --max-time 20 \
            -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/deleteWebhook" \
            -d "drop_pending_updates=true" \
            >/dev/null || true

          telegram_send "🚀 VPS workflow started."
          telegram_send "🧰 Step 1/6: Installing and checking VPS tools..."


      # ============================================================
      # 4. TAILSCALE
      # ============================================================
      - name: Setup Tailscale
        run: |
          set -e

          telegram_send() {
            curl -fsS \
              --max-time 20 \
              -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=$(date '+%I:%M:%S %p') : $1" \
              >/dev/null || true
          }

          telegram_send "📡 Step 2/6: Setting up Tailscale..."

          curl -fsSL https://tailscale.com/install.sh | sh

          sudo systemctl stop tailscaled 2>/dev/null || true
          sudo pkill -x tailscaled 2>/dev/null || true

          sudo mkdir -p \
            /var/lib/tailscale \
            /tmp/ts-restore

          found=""

          while IFS= read -r p; do
            [ -n "$p" ] || continue

            if rclone lsjson \
              "gdrive:${p}" \
              --stat \
              --no-modtime \
              --no-mimetype \
              >/tmp/ts.json 2>/dev/null \
              && jq -e '.Size > 0' /tmp/ts.json >/dev/null 2>&1
            then
              found="$p"
              break
            fi

          done < <(
            rclone lsf gdrive: \
              --recursive \
              --files-only \
              2>/dev/null \
              | grep -E '(^|/)tailscale-state\.tar\.gz$' || true
          )

          if [ -n "$found" ]; then

            telegram_send "🔄 Previous Tailscale state found. Restoring it..."

            rclone copyto \
              "gdrive:${found}" \
              /tmp/ts-restore/tailscale-state.tar.gz \
              --retries 5 \
              --low-level-retries 20

            sudo tar \
              -xzf \
              /tmp/ts-restore/tailscale-state.tar.gz \
              -C /var/lib/tailscale

            test -f /var/lib/tailscale/tailscaled.state

            sudo chmod 600 \
              /var/lib/tailscale/tailscaled.state

            telegram_send "✅ Tailscale state restored."

          else

            telegram_send "🆕 No Tailscale state backup found. A new Tailscale state will be created."

          fi

          sudo systemctl start tailscaled

          sleep 4

          sudo tailscale up \
            --authkey "${TAILSCALE_AUTHKEY}" \
            --hostname=biralo \
            --ssh

          TS_IP="$(tailscale ip -4 | head -1)"

          test -n "$TS_IP"

          echo "TAILSCALE_IP=$TS_IP" >> "$GITHUB_ENV"

          telegram_send "🌐 Tailscale is online. IPv4: $TS_IP"


      # ============================================================
      # 5. PREPARE LINUX HOST
      # ============================================================
      - name: Prepare host
        run: |
          set -e

          telegram_send() {
            curl -fsS \
              --max-time 20 \
              -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=$(date '+%I:%M:%S %p') : $1" \
              >/dev/null || true
          }

          telegram_send "🖥️ Step 3/6: Preparing the Linux host..."

          sudo hostnamectl set-hostname biralo

          if ! id -u biralo >/dev/null 2>&1; then

            sudo useradd \
              -m \
              -s /bin/bash \
              biralo

            echo "biralo:biralo" | sudo chpasswd

            sudo usermod \
              -aG sudo \
              biralo

            echo "biralo ALL=(ALL) NOPASSWD:ALL" \
              | sudo tee /etc/sudoers.d/biralo >/dev/null

            sudo chmod 440 \
              /etc/sudoers.d/biralo

          fi

          sudo sed -i \
            's/^#\?PasswordAuthentication.*/PasswordAuthentication yes/' \
            /etc/ssh/sshd_config

          sudo sed -i \
            's/^#\?PermitRootLogin.*/PermitRootLogin no/' \
            /etc/ssh/sshd_config

          sudo systemctl enable ssh
          sudo systemctl restart ssh

          sudo sysctl -w \
            net.ipv4.ip_forward=1 >/dev/null

          sudo sysctl -w \
            net.ipv4.conf.all.rp_filter=2 >/dev/null

          sudo sysctl -w \
            net.ipv4.conf.default.rp_filter=2 >/dev/null

          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache \
            2>/dev/null || true

          sudo apt-get clean

          docker system prune -af \
            2>/dev/null || true

          telegram_send "✅ Linux host prepared."


      # ============================================================
      # 6. RESTORE WINDOWS
      # ============================================================
      - name: Restore Windows backup or prepare fresh install
        run: |
          set -e

          telegram_send() {
            curl -fsS \
              --max-time 20 \
              -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=$(date '+%I:%M:%S %p') : $1" \
              >/dev/null || true
          }

          telegram_send "💾 Step 4/6: Checking Google Drive for the Windows backup..."

          mkdir -p /tmp/windows-restore

          found=""

          while IFS= read -r p; do

            [ -n "$p" ] || continue

            if rclone lsjson \
              "gdrive:${p}" \
              --stat \
              --no-modtime \
              --no-mimetype \
              >/tmp/win.json 2>/dev/null \
              && jq -e '.Size > 0' /tmp/win.json >/dev/null 2>&1
            then

              found="$p"
              break

            fi

          done < <(
            rclone lsf gdrive: \
              --recursive \
              --files-only \
              2>/dev/null \
              | grep -E '(^|/)windows-backup\.tar\.gz$' || true
          )

          if [ -n "$found" ]; then

            echo "WINDOWS_MODE=restore" >> "$GITHUB_ENV"

            telegram_send "📦 Windows backup found. Starting restore; this is NOT a fresh Windows install."

            rclone copyto \
              "gdrive:${found}" \
              /tmp/windows-restore/windows-backup.tar.gz \
              --stats 5s \
              --stats-one-line \
              --stats-log-level NOTICE \
              --retries 5 \
              --low-level-retries 20 \
              --drive-chunk-size 64M \
              >/tmp/win-restore.log 2>&1 &

            pid=$!
            last=0

            while kill -0 "$pid" 2>/dev/null; do

              sleep 5

              line="$(
                grep -E '[0-9]{1,3}%' \
                /tmp/win-restore.log \
                | tail -1 || true
              )"

              pct="$(
                printf '%s' "$line" \
                | grep -oE '[0-9]{1,3}%' \
                | tail -1 \
                | tr -d '%' || true
              )"

              if [[ "$pct" =~ ^[0-9]+$ ]]; then

                m=$((pct / 10 * 10))

                if [ "$m" -ge 10 ] \
                  && [ "$m" -le 100 ] \
                  && [ "$m" -gt "$last"
                ]; then

                  telegram_send \
                    "⬇️ Windows backup restore: ${m}%"

                  last="$m"

                fi

              fi

            done

            wait "$pid"

            test -s \
              /tmp/windows-restore/windows-backup.tar.gz

            sudo rm -rf /opt/windows

            sudo mkdir -p /opt

            sudo tar \
              -xzf \
              /tmp/windows-restore/windows-backup.tar.gz \
              -C /opt

            test -d /opt/windows

            telegram_send \
              "✅ Windows backup restored successfully."

          else

            echo "WINDOWS_MODE=fresh" >> "$GITHUB_ENV"

            sudo rm -rf /opt/windows

            sudo mkdir -p /opt/windows

            telegram_send \
              "⚠️ No Windows backup found. A fresh Windows 11 installation will start."

          fi


      # ============================================================
      # 7. DOCKUR IMAGE
      # ============================================================
      - name: Pull Dockur image
        run: |
          set -e

          telegram_send() {
            curl -fsS \
              --max-time 20 \
              -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=$(date '+%I:%M:%S %p') : $1" \
              >/dev/null || true
          }

          telegram_send \
            "📥 Step 5/6: Downloading the Windows container image..."

          docker pull \
            ghcr.io/dockur/windows

          telegram_send \
            "✅ Windows container image is ready."


      # ============================================================
      # 8. WINDOWS + TELEGRAM CONTROL + BACKUPS
      # ============================================================
      - name: Start Windows and monitor VPS
        run: |

          set -u

          REQUEST="/tmp/vps-stop-request"

          rm -f "$REQUEST"


          # --------------------------------------------------------
          # TELEGRAM SEND
          # --------------------------------------------------------
          telegram_send() {

            curl -fsS \
              --max-time 20 \
              -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=$(date '+%I:%M:%S %p') : $1" \
              >/dev/null || true

          }


          # --------------------------------------------------------
          # STOP MENU
          # --------------------------------------------------------
          stop_keyboard() {

            curl -fsS \
              --max-time 20 \
              -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode \
              "text=$(date '+%I:%M:%S %p') : 🛑 Choose how to stop the VPS:" \
              --data-urlencode \
              'reply_markup={"inline_keyboard":[[{"text":"💾 BACKUP & STOP","callback_data":"backup_stop"}],[{"text":"❌ STOP WITHOUT BACKUP","callback_data":"stop_no_backup"}]]}' \
              >/dev/null || true

          }


          # --------------------------------------------------------
          # PERMANENT STOP BUTTON
          # --------------------------------------------------------
          send_stop_button() {

            curl -fsS \
              --max-time 20 \
              -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode \
              "text=$(date '+%I:%M:%S %p') : 🎮 VPS CONTROL PANEL" \
              --data-urlencode \
              'reply_markup={"inline_keyboard":[[{"text":"🛑 STOP VPS","callback_data":"show_stop_menu"}]]}' \
              >/dev/null || true

          }


          # --------------------------------------------------------
          # TELEGRAM POLLER
          # --------------------------------------------------------
          poller() {

            local offset=0
            local init
            local maxid
            local resp
            local count
            local update
            local uid
            local chat
            local text
            local cb
            local cbid

            init="$(
              curl -fsS \
                --max-time 20 \
                "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getUpdates?limit=100&timeout=0" \
                2>/dev/null || true
            )"

            maxid="$(
              echo "$init" \
              | jq -r '[.result[]?.update_id] | max // -1' \
              2>/dev/null \
              || echo -1
            )"

            if [[ "$maxid" =~ ^[0-9]+$ ]]; then
              offset=$((maxid + 1))
            fi


            while [ ! -f "$REQUEST" ]; do

              resp="$(
                curl -fsS \
                  --max-time 40 \
                  "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getUpdates?offset=${offset}&timeout=30&limit=20" \
                  2>/dev/null || true
              )"


              echo "$resp" \
                | jq -e '.ok == true' \
                >/dev/null 2>&1 \
                || {
                  sleep 2
                  continue
                }


              count="$(
                echo "$resp" \
                | jq '.result|length'
              )"

              [ "$count" -gt 0 ] || continue


              while IFS= read -r update; do

                uid="$(
                  echo "$update" \
                  | jq -r '.update_id'
                )"

                offset=$((uid + 1))


                chat="$(
                  echo "$update" \
                  | jq -r \
                  '.message.chat.id // .callback_query.message.chat.id // empty'
                )"


                [ "$chat" = "$TELEGRAM_CHAT_ID" ] || continue


                text="$(
                  echo "$update" \
                  | jq -r \
                  '.message.text // empty'
                )"


                cb="$(
                  echo "$update" \
                  | jq -r \
                  '.callback_query.data // empty'
                )"


                cbid="$(
                  echo "$update" \
                  | jq -r \
                  '.callback_query.id // empty'
                )"


                # --------------------------------------------------
                # /stop
                # --------------------------------------------------
                if [ "$text" = "/stop" ]; then

                  stop_keyboard


                # --------------------------------------------------
                # STOP VPS BUTTON
                # --------------------------------------------------
                elif [ "$cb" = "show_stop_menu" ]; then

                  stop_keyboard

                  if [ -n "$cbid" ]; then

                    curl -fsS \
                      --max-time 10 \
                      -X POST \
                      "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/answerCallbackQuery" \
                      -d "callback_query_id=$cbid" \
                      -d "text=Stop menu opened." \
                      >/dev/null || true

                  fi


                # --------------------------------------------------
                # BACKUP + STOP
                # --------------------------------------------------
                elif [ "$cb" = "backup_stop" ]; then

                  echo "backup" > "$REQUEST"

                  if [ -n "$cbid" ]; then

                    curl -fsS \
                      --max-time 10 \
                      -X POST \
                      "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/answerCallbackQuery" \
                      -d "callback_query_id=$cbid" \
                      -d "text=Backup + stop selected." \
                      >/dev/null || true

                  fi

                  telegram_send \
                    "💾 BACKUP & STOP selected. Backup will finish before Windows shuts down."

                  break


                # --------------------------------------------------
                # STOP WITHOUT BACKUP
                # --------------------------------------------------
                elif [ "$cb" = "stop_no_backup" ]; then

                  echo "nobackup" > "$REQUEST"

                  if [ -n "$cbid" ]; then

                    curl -fsS \
                      --max-time 10 \
                      -X POST \
                      "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/answerCallbackQuery" \
                      -d "callback_query_id=$cbid" \
                      -d "text=Stop without backup selected." \
                      >/dev/null || true

                  fi

                  telegram_send \
                    "❌ STOP WITHOUT BACKUP selected."

                  break

                fi

              done < <(
                echo "$resp" \
                | jq -c '.result[]'
              )

            done

          }


          # ========================================================
          # WINDOWS BACKUP
          # ========================================================
          backup_windows() {

            if [ ! -d /opt/windows ]; then

              telegram_send \
                "⚠️ Windows storage is missing; backup skipped."

              return 1

            fi


            mkdir /tmp/windows-backup.lock \
              2>/dev/null \
              || {

                telegram_send \
                  "⏳ Another Windows backup is already running."

                return 1

              }


            local paused=0
            local file="/opt/windows-backup.tar.gz"
            local log="/tmp/windows-backup.log"
            local pid
            local rc
            local local_size
            local remote_size
            local remote_id
            local line
            local pct
            local last
            local m


            rm -f "$file" "$log"


            if docker inspect \
              -f '{{.State.Running}}' \
              windows \
              2>/dev/null \
              | grep -qx true
            then

              docker pause windows \
                >/dev/null 2>&1 \
                || true

              paused=1

            fi


            telegram_send \
              "🔄 Windows backup started. Windows is paused briefly for a consistent disk snapshot."


            if ! sudo tar \
              --sparse \
              -C /opt \
              -czf "$file" \
              windows
            then

              [ "$paused" -eq 1 ] \
                && docker unpause windows >/dev/null 2>&1 \
                || true

              rmdir /tmp/windows-backup.lock \
                2>/dev/null || true

              telegram_send \
                "❌ Windows backup archive creation failed."

              return 1

            fi


            [ "$paused" -eq 1 ] \
              && docker unpause windows >/dev/null 2>&1 \
              || true


            local_size="$(
              stat -c '%s' "$file"
            )"


            telegram_send \
              "📦 Windows backup archive created (${local_size} bytes). Uploading to Google Drive..."


            rclone copyto \
              "$file" \
              "gdrive:windows-backup.tar.gz" \
              --ignore-times \
              --stats 5s \
              --stats-one-line \
              --stats-log-level NOTICE \
              --retries 5 \
              --low-level-retries 20 \
              --drive-chunk-size 64M \
              >"$log" 2>&1 &


            pid=$!
            last=0


            while kill -0 "$pid" 2>/dev/null; do

              sleep 5

              line="$(
                grep -E '[0-9]{1,3}%' "$log" \
                | tail -1 \
                || true
              )"


              pct="$(
                printf '%s' "$line" \
                | grep -oE '[0-9]{1,3}%' \
                | tail -1 \
                | tr -d '%' \
                || true
              )"


              if [[ "$pct" =~ ^[0-9]+$ ]]; then

                m=$((pct / 10 * 10))

                if [ "$m" -ge 10 ] \
                  && [ "$m" -le 100 ] \
                  && [ "$m" -gt "$last"
                ]; then

                  telegram_send \
                    "⬆️ Windows backup upload: ${m}%"

                  last="$m"

                fi

              fi

            done


            wait "$pid"
            rc=$?


            if [ "$rc" -ne 0 ]; then

              telegram_send \
                "❌ Windows backup upload failed. Local archive kept for retry."

              rmdir /tmp/windows-backup.lock \
                2>/dev/null || true

              return 1

            fi


            sleep 5


            rclone lsjson \
              "gdrive:windows-backup.tar.gz" \
              --stat \
              --no-modtime \
              --no-mimetype \
              >/tmp/wverify.json \
              2>/dev/null \
              || true


            remote_size="$(
              jq -r '.Size // -1' \
              /tmp/wverify.json \
              2>/dev/null \
              || echo -1
            )"


            remote_id="$(
              jq -r '.ID // empty' \
              /tmp/wverify.json \
              2>/dev/null \
              || true
            )"


            if [ "$remote_size" = "$local_size" ] \
              && [ -n "$remote_id" ]
            then

              rm -f "$file"

              telegram_send \
                "✅ Windows backup verified. Temporary local archive deleted."

              rmdir /tmp/windows-backup.lock \
                2>/dev/null || true

              return 0

            fi


            telegram_send \
              "❌ Windows backup verification failed. Local archive kept. Local=${local_size} Remote=${remote_size}"

            rmdir /tmp/windows-backup.lock \
              2>/dev/null || true

            return 1

          }


          # ========================================================
          # TAILSCALE BACKUP
          # ========================================================
          backup_tailscale() {

            if [ ! -f /var/lib/tailscale/tailscaled.state ]; then

              telegram_send \
                "⚠️ Tailscale state file not found; state backup skipped."

              return 1

            fi


            sudo tar \
              -czf \
              /tmp/tailscale-state.tar.gz \
              -C /var/lib/tailscale \
              tailscaled.state \
              || {

                telegram_send \
                  "❌ Tailscale state archive failed."

                return 1

              }


            telegram_send \
              "📡 Uploading Tailscale state backup..."


            rclone copyto \
              /tmp/tailscale-state.tar.gz \
              gdrive:tailscale-state.tar.gz \
              --ignore-times \
              --retries 5 \
              --low-level-retries 20 \
              --drive-chunk-size 16M \
              >/tmp/ts-upload.log 2>&1 \
              || {

                telegram_send \
                  "❌ Tailscale state upload failed."

                return 1

              }


            rm -f \
              /tmp/tailscale-state.tar.gz


            telegram_send \
              "✅ Tailscale state backup uploaded."

          }


          # ========================================================
          # START WINDOWS
          # ========================================================
          telegram_send \
            "🪟 Step 6/6: Starting Windows. Waiting for the real Windows boot message..."


          docker rm -f windows \
            2>/dev/null \
            || true


          docker run -d \
            --name windows \
            -e VERSION="11" \
            -e USERNAME="admin" \
            -e PASSWORD="$WINDOWS_PASSWORD" \
            -e RAM_SIZE="12G" \
            -e CPU_CORES="4" \
            -e DISK_SIZE="70G" \
            -p 3389:3389/tcp \
            -p 3389:3389/udp \
            -p 8006:8006 \
            -v /opt/windows:/storage \
            --device=/dev/kvm \
            --device=/dev/net/tun \
            --cap-add NET_ADMIN \
            --stop-timeout 120 \
            ghcr.io/dockur/windows \
            >/dev/null


          # ========================================================
          # START TELEGRAM POLLER
          # ========================================================
          poller &

          POLLER_PID=$!


          telegram_send \
            "⏳ Windows container started. 8006 will NOT be treated as RDP-ready."


          # ========================================================
          # WAIT FOR REAL WINDOWS START
          # ========================================================
          READY=0
          stable=0
          start_ts="$(date +%s)"
          next_report=10


          while [ "$READY" -eq 0 ]; do

            if [ -f "$REQUEST" ]; then
              break
            fi


            logs="$(
              docker logs windows 2>&1 \
              | tail -160 \
              || true
            )"


            # ------------------------------------------------------
            # DOCKUR ERROR
            # ------------------------------------------------------
            if echo "$logs" \
              | grep -qiE \
                'ERROR:|failed to download|Microsoft blocked'
            then

              err="$(
                echo "$logs" \
                | grep -iE \
                  'ERROR:|failed to download|Microsoft blocked' \
                | tail -1
              )"

              telegram_send \
                "❌ Dockur reported an error: ${err}"

              break

            fi


            # ------------------------------------------------------
            # REAL WINDOWS DOWNLOAD PROGRESS
            # ------------------------------------------------------
            if [ "${WINDOWS_MODE:-fresh}" = "fresh" ] \
              && echo "$logs" \
              | grep -q "Downloading Windows"
            then

              p="$(
                echo "$logs" \
                | grep -oE '[0-9]{1,3}%' \
                | tail -1 \
                | tr -d '%' \
                || true
              )"


              if [[ "$p" =~ ^[0-9]+$ ]] \
                && [ "$p" -ge "$next_report"
              ]; then

                telegram_send \
                  "🪟 Windows installation/download progress: ${p}%"

                next_report=$((p + 10))

              fi

            fi


            # ------------------------------------------------------
            # REAL WINDOWS SUCCESS MESSAGE
            # ------------------------------------------------------
            if echo "$logs" \
              | grep -qiE \
                'Windows started successfully|Windows started succesfully'
            then

              if timeout 3 \
                bash -c '</dev/tcp/127.0.0.1/3389' \
                2>/dev/null
              then

                stable=$((stable + 1))

              else

                stable=0

              fi


              if [ "$stable" -ge 3 ]; then

                READY=1

                break

              fi

            else

              stable=0

            fi


            # ------------------------------------------------------
            # MAXIMUM WAIT
            # ------------------------------------------------------
            if [ $(( $(date +%s) - start_ts )) -ge 18000 ]; then

              telegram_send \
                "❌ Windows did not become ready within the allowed time."

              break

            fi


            sleep 5

          done


          # ========================================================
          # STOP REQUEST DURING WINDOWS START
          # ========================================================
          if [ -f "$REQUEST" ]; then

            action="$(cat "$REQUEST")"


            if [ "$action" = "backup" ]; then

              telegram_send \
                "🛑 Stop requested during Windows setup. Starting backup before shutdown."

              backup_windows || true

              backup_tailscale || true

            else

              telegram_send \
                "🛑 Stop requested without backup. Shutting Windows down."

            fi


            docker stop \
              -t 120 \
              windows \
              >/dev/null 2>&1 \
              || docker rm -f windows \
              >/dev/null 2>&1 \
              || true


            kill "$POLLER_PID" \
              2>/dev/null \
              || true


            telegram_send \
              "🛑 VPS session stopped."

            exit 0

          fi


          # ========================================================
          # WINDOWS FAILED
          # ========================================================
          if [ "$READY" -ne 1 ]; then

            docker logs \
              --tail 200 \
              windows \
              || true

            kill "$POLLER_PID" \
              2>/dev/null \
              || true

            exit 1

          fi


          # ========================================================
          # RDP READY
          # ========================================================
          telegram_send \
            "🟢 RDP IS READY. Tailscale IPv4: ${TAILSCALE_IP}"


          # ========================================================
          # AUTOMATIC STOP BUTTON
          # ========================================================
          send_stop_button


          telegram_send \
            "📡 VPS monitor is active. Automatic Windows + Tailscale backups run every 35 minutes."


          # ========================================================
          # BACKUP TIMER
          # ========================================================
          last_backup="$(date +%s)"


          # ========================================================
          # RDP DISCONNECT STATE
          # ========================================================
          was_connected=0
          disconnect_backup=0


          # ========================================================
          # MAIN VPS MONITOR
          # ========================================================
          while true; do


            # ------------------------------------------------------
            # TELEGRAM STOP REQUEST
            # ------------------------------------------------------
            if [ -f "$REQUEST" ]; then

              action="$(cat "$REQUEST")"


              if [ "$action" = "backup" ]; then

                telegram_send \
                  "💾 Backup & Stop selected. Starting Windows backup..."

                backup_windows || true

                backup_tailscale || true

              else

                telegram_send \
                  "❌ Stop without backup selected."

              fi


              docker stop \
                -t 120 \
                windows \
                >/dev/null 2>&1 \
                || docker rm -f windows \
                >/dev/null 2>&1 \
                || true


              break

            fi


            # ------------------------------------------------------
            # 35 MINUTE BACKUP
            # ------------------------------------------------------
            now="$(date +%s)"


            if [ $((now - last_backup)) -ge 2100 ]; then

              telegram_send \
                "⏰ 35-minute timer reached. Starting Windows + Tailscale backup..."


              backup_windows || true

              backup_tailscale || true


              last_backup="$(date +%s)"

            fi


            # ------------------------------------------------------
            # RDP CONNECTION CHECK
            # ------------------------------------------------------
            connections="$(
              sudo ss -tn 2>/dev/null \
              | awk '
                  $1=="ESTAB" &&
                  ($4 ~ /:3389$/ || $5 ~ /:3389$/) {
                    c++
                  }
                  END {
                    print c+0
                  }
                '
            )"


            if [ "$connections" -gt 0 ]; then

              was_connected=1
              disconnect_backup=0


            elif [ "$was_connected" -eq 1 ]; then

              if [ "$disconnect_backup" -eq 0 ]; then

                telegram_send \
                  "🔌 RDP connection disconnected. Starting a safety backup..."


                backup_windows || true

                backup_tailscale || true


                last_backup="$(date +%s)"

                disconnect_backup=1

              fi


              was_connected=0

            fi


            sleep 10

          done


          # ========================================================
          # CLEANUP
          # ========================================================
          kill "$POLLER_PID" \
            2>/dev/null \
            || true


          telegram_send \
            "🏁 VPS workflow finished safely."
