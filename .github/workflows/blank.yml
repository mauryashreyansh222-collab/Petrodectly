name: Continuous Persistent VPS

on:
  workflow_dispatch:

concurrency:
  group: vps-session
  cancel-in-progress: false

env:
  RCLONE_CONFIG_GDRIVE_TYPE: drive
  RCLONE_CONFIG_GDRIVE_SCOPE: drive
  RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.RCLONE_DRIVE_TOKEN }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  TZ: Asia/Kolkata

jobs:
  vps-session:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install prerequisites and rclone
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y curl jq unzip sudo net-tools iproute2 openssh-server util-linux ca-certificates cloud-guest-utils
          curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone version | head -3

      - name: Telegram startup check
        run: |
          set -e
          telegram_send() {
            local msg="$1"
            local now
            now="$(date '+%I:%M:%S %p')"
            curl -fsS --max-time 20 -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=${now} : ${msg}" \
              >/tmp/telegram-last.json
            jq -e '.ok == true' /tmp/telegram-last.json >/dev/null
          }
          curl -fsS --max-time 20 \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getMe" \
            -o /tmp/telegram-me.json
          jq -e '.ok == true' /tmp/telegram-me.json >/dev/null
          telegram_send "🚀 VPS workflow started. Setup is in progress..."

      - name: Set hostname
        run: sudo hostnamectl set-hostname biralo

      - name: Install and restore Tailscale state
        run: |
          set -e
          curl -fsSL https://tailscale.com/install.sh | sh

          sudo systemctl stop tailscaled 2>/dev/null || true
          sudo pkill -x tailscaled 2>/dev/null || true
          sudo mkdir -p /var/lib/tailscale
          mkdir -p /tmp/ts-restore

          if rclone lsjson "gdrive:tailscale-state.tar.gz" --stat --no-modtime --no-mimetype >/tmp/ts-remote.json 2>/dev/null && jq -e '.Size != null and .Size > 0' /tmp/ts-remote.json >/dev/null; then
            curl -fsS --max-time 20 -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=$(date '+%I:%M:%S %p') : 🔄 Previous Tailscale state found. Restoring it before Tailscale starts..." \
              >/dev/null || true

            rclone copyto "gdrive:tailscale-state.tar.gz" /tmp/ts-restore/tailscale-state.tar.gz --retries 3 --low-level-retries 10
            sudo tar -xzf /tmp/ts-restore/tailscale-state.tar.gz -C /var/lib/tailscale
            sudo chmod 600 /var/lib/tailscale/tailscaled.state
            echo "TAILSCALE_STATE_RESTORED=1" >> "$GITHUB_ENV"
          else
            echo "TAILSCALE_STATE_RESTORED=0" >> "$GITHUB_ENV"
            echo "No previous Tailscale state found."
          fi

          sudo systemctl start tailscaled
          sleep 5

          sudo tailscale up \
            --authkey "${{ secrets.TAILSCALE_AUTHKEY }}" \
            --hostname=biralo \
            --ssh

          TS_IP="$(tailscale ip -4 | head -1)"
          echo "TAILSCALE_IP=${TS_IP}" >> "$GITHUB_ENV"

          if [ "${TAILSCALE_STATE_RESTORED:-0}" = "1" ]; then
            MSG="✅ Tailscale restored. IPv4: ${TS_IP}"
          else
            MSG="🆕 Tailscale started with a new state. IPv4: ${TS_IP}"
          fi

          curl -fsS --max-time 20 -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=$(date '+%I:%M:%S %p') : ${MSG}" \
            >/dev/null || true

      - name: Create SSH user
        run: |
          set -e
          if ! id -u biralo >/dev/null 2>&1; then
            sudo useradd -m -s /bin/bash biralo
            echo 'biralo:biralo' | sudo chpasswd
            sudo usermod -aG sudo biralo
            echo 'biralo ALL=(ALL) NOPASSWD:ALL' | sudo tee /etc/sudoers.d/biralo >/dev/null
            sudo chmod 440 /etc/sudoers.d/biralo
          fi

      - name: Configure SSH
        run: |
          set -e
          sudo sed -i 's/^#\?PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/^#\?PermitRootLogin.*/PermitRootLogin no/' /etc/ssh/sshd_config
          sudo systemctl enable ssh
          sudo systemctl restart ssh

      - name: Configure networking
        run: |
          set -e
          sudo sysctl -w net.ipv4.ip_forward=1
          sudo sysctl -w net.ipv4.conf.all.rp_filter=2
          sudo sysctl -w net.ipv4.conf.default.rp_filter=2
          for f in /proc/sys/net/ipv4/conf/*/rp_filter; do echo 2 | sudo tee "$f" >/dev/null || true; done
          if command -v ufw >/dev/null 2>&1 && sudo ufw status | grep -q 'Status: active'; then
            sudo ufw allow 3389/tcp
            sudo ufw allow 3389/udp
            sudo ufw allow 8006/tcp
          fi

      - name: Free runner disk space
        run: |
          echo 'Disk before cleanup:'
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache 2>/dev/null || true
          sudo apt-get clean
          docker system prune -af 2>/dev/null || true
          echo 'Disk after cleanup:'
          df -h /
          echo 'Memory:'
          free -h
          echo 'CPU:'
          nproc

      - name: Restore or prepare Windows storage
        run: |
          set -e
          mkdir -p /tmp/windows-restore

          if rclone lsjson "gdrive:windows-backup.tar.gz" --stat --no-modtime --no-mimetype >/tmp/windows-remote.json 2>/dev/null && jq -e '.Size != null and .Size > 0' /tmp/windows-remote.json >/dev/null; then
            echo 'WINDOWS_MODE=restore' >> "$GITHUB_ENV"

            curl -fsS --max-time 20 -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=$(date '+%I:%M:%S %p') : 📦 Previous Windows backup found on Google Drive." \
              >/dev/null || true

            curl -fsS --max-time 20 -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=$(date '+%I:%M:%S %p') : ⬇️ Windows backup is loading now. Progress will be reported every 10%." \
              >/dev/null || true

            LOG=/tmp/windows-restore.log
            rm -f "$LOG"
            rclone copyto "gdrive:windows-backup.tar.gz" /tmp/windows-restore/windows-backup.tar.gz \
              --stats 5s --stats-one-line --stats-log-level NOTICE \
              --retries 5 --low-level-retries 20 --drive-chunk-size 64M \
              >"$LOG" 2>&1 &
            PID=$!
            LAST=0
            while kill -0 "$PID" 2>/dev/null; do
              sleep 5
              LINE="$(grep -E '[0-9]{1,3}%' "$LOG" | tail -1 || true)"
              PCT="$(printf '%s' "$LINE" | grep -oE '[0-9]{1,3}%' | tail -1 | tr -d '%' || true)"
              ETA="$(printf '%s' "$LINE" | grep -oE 'ETA [^,]+' | tail -1 || true)"
              if [[ "$PCT" =~ ^[0-9]+$ ]]; then
                M=$((PCT/10*10))
                if [ "$M" -ge 10 ] && [ "$M" -le 100 ] && [ "$M" -gt "$LAST" ]; then
                  if [ -n "$ETA" ]; then TEXT="⬇️ Windows restore: ${M}% — ${ETA} remaining."; else TEXT="⬇️ Windows restore: ${M}%."; fi
                  curl -fsS --max-time 20 -X POST \
                    "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                    -d "chat_id=${TELEGRAM_CHAT_ID}" \
                    --data-urlencode "text=$(date '+%I:%M:%S %p') : ${TEXT}" \
                    >/dev/null || true
                  LAST=$M
                fi
              fi
            done
            set +e
            wait "$PID"
            RC=$?
            set -e
            if [ "$RC" -ne 0 ]; then
              echo 'Windows backup download failed.'
              tail -50 "$LOG" || true
              exit 1
            fi

            sudo rm -rf /opt/windows
            sudo mkdir -p /opt
            sudo tar -xzf /tmp/windows-restore/windows-backup.tar.gz -C /opt
            test -d /opt/windows

            curl -fsS --max-time 20 -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=$(date '+%I:%M:%S %p') : ✅ Windows backup restored to the persistent storage folder." \
              >/dev/null || true
          else
            echo 'WINDOWS_MODE=fresh' >> "$GITHUB_ENV"
            sudo rm -rf /opt/windows
            sudo mkdir -p /opt/windows
            curl -fsS --max-time 20 -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=$(date '+%I:%M:%S %p') : ⚠️ No Windows backup found. A fresh Windows 11 installation will start." \
              >/dev/null || true
          fi

      - name: Pull Dockur Windows image
        run: docker pull ghcr.io/dockur/windows

      - name: Start Windows VM
        run: |
          set -e
          docker rm -f windows 2>/dev/null || true
          docker run -d \
            --name windows \
            -e VERSION="11" \
            -e USERNAME="admin" \
            -e PASSWORD="Shrey222136" \
            -e RAM_SIZE="12G" \
            -e CPU_CORES="4" \
            -e DISK_SIZE="70G" \
            -p 3389:3389/tcp \
            -p 3389:3389/udp \
            -p 8006:8006 \
            -v /opt/windows:/storage \
            --device=/dev/kvm \
            --device=/dev/net/tun \
            --cap-add NET_ADMIN \
            --stop-timeout 120 \
            ghcr.io/dockur/windows
          echo 'Windows container started.'

      - name: Wait for Windows and RDP
        run: |
          set -e
          SENT=0
          for i in $(seq 1 360); do
            if timeout 3 bash -c '</dev/tcp/127.0.0.1/3389' 2>/dev/null; then
              if [ "$SENT" -eq 0 ]; then
                curl -fsS --max-time 20 -X POST \
                  "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                  -d "chat_id=${TELEGRAM_CHAT_ID}" \
                  --data-urlencode "text=$(date '+%I:%M:%S %p') : 🟢 RDP is ready. Tailscale IPv4: ${TAILSCALE_IP}" \
                  >/dev/null || true
                SENT=1
              fi
              break
            fi

            if [ "$((i % 12))" -eq 0 ]; then
              LOGS="$(docker logs windows 2>&1 | tail -80 || true)"
              P="$(printf '%s\n' "$LOGS" | grep -oE '[0-9]{1,3}%' | tail -1 | tr -d '%' || true)"
              if [[ "$P" =~ ^[0-9]+$ ]]; then
                M=$((P/10*10))
                if [ "$M" -ge 10 ] && [ "$M" -le 100 ]; then
                  curl -fsS --max-time 20 -X POST \
                    "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                    -d "chat_id=${TELEGRAM_CHAT_ID}" \
                    --data-urlencode "text=$(date '+%I:%M:%S %p') : 🪟 Windows setup/download progress: ${M}% (Docker log milestone)." \
                    >/dev/null || true
                fi
              fi
            fi
            sleep 5
          done

          if [ "$SENT" -eq 0 ]; then
            echo 'RDP did not become ready in time.'
            docker logs --tail 120 windows || true
            exit 1
          fi

      - name: Monitor VPS, Telegram stop control and backups
        run: |
          set -u

          REQUEST=/tmp/vps-stop-request
          rm -f "$REQUEST"
          touch /tmp/vps-monitor-started

          telegram_send() {
            local msg="$1"
            curl -fsS --max-time 20 -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=$(date '+%I:%M:%S %p') : ${msg}" \
              >/dev/null || true
          }

          send_stop_keyboard() {
            curl -fsS --max-time 20 -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=$(date '+%I:%M:%S %p') : 🛑 Stop request received. Choose what you want:" \
              --data-urlencode 'reply_markup={"inline_keyboard":[[{"text":"💾 BACKUP & STOP","callback_data":"backup_stop"},{"text":"❌ STOP WITHOUT BACKUP","callback_data":"stop_no_backup"}]]}' \
              >/dev/null || true
          }

          telegram_poller() {
            local offset=0
            local init_json max_id

            init_json="$(curl -fsS --max-time 20 \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getUpdates?limit=100&timeout=0" 2>/dev/null || true)"
            if echo "$init_json" | jq -e '.ok == true' >/dev/null 2>&1; then
              max_id="$(echo "$init_json" | jq -r '[.result[].update_id] | max // -1')"
              if [[ "$max_id" =~ ^[0-9]+$ ]]; then offset=$((max_id+1)); fi
            fi

            while [ ! -f "$REQUEST" ]; do
              RESP="$(curl -fsS --max-time 40 \
                "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getUpdates?offset=${offset}&timeout=30" 2>/dev/null || true)"

              if ! echo "$RESP" | jq -e '.ok == true' >/dev/null 2>&1; then
                sleep 3
                continue
              fi

              COUNT="$(echo "$RESP" | jq '.result | length')"
              if [ "$COUNT" -eq 0 ]; then continue; fi

              while IFS= read -r update; do
                [ -z "$update" ] && continue
                update_id="$(echo "$update" | jq -r '.update_id // -1')"
                offset=$((update_id+1))

                chat_id="$(echo "$update" | jq -r '.message.chat.id // .callback_query.message.chat.id // empty')"
                [ "$chat_id" = "$TELEGRAM_CHAT_ID" ] || continue

                text="$(echo "$update" | jq -r '.message.text // empty')"
                callback="$(echo "$update" | jq -r '.callback_query.data // empty')"

                if [ "$text" = "/stop" ]; then
                  send_stop_keyboard
                elif [ "$callback" = "backup_stop" ]; then
                  echo backup > "$REQUEST"
                  curl -fsS --max-time 20 -X POST \
                    "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/answerCallbackQuery" \
                    -d "callback_query_id=$(echo "$update" | jq -r '.callback_query.id')" \
                    -d 'text=Backup + stop selected.' >/dev/null || true
                  telegram_send "💾 Backup & stop selected. I will back up Windows + Tailscale state, then stop the VPS."
                  break
                elif [ "$callback" = "stop_no_backup" ]; then
                  echo nobackup > "$REQUEST"
                  curl -fsS --max-time 20 -X POST \
                    "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/answerCallbackQuery" \
                    -d "callback_query_id=$(echo "$update" | jq -r '.callback_query.id')" \
                    -d 'text=Stop without backup selected.' >/dev/null || true
                  telegram_send "❌ Stop without backup selected. Windows will be stopped without creating a new backup."
                  break
                fi
              done < <(echo "$RESP" | jq -c '.result[]')
            done
          }

          backup_windows() {
            if [ ! -d /opt/windows ]; then
              telegram_send "⚠️ Windows storage folder is missing; Windows backup skipped."
              return 1
            fi

            if ! mkdir /tmp/windows-backup.lock 2>/dev/null; then
              telegram_send "⏳ Another Windows backup is already running; this backup request was skipped."
              return 1
            fi

            local paused=0
            local backup_file=/opt/windows-backup.tar.gz
            local log=/tmp/windows-backup.log
            local pid rc local_size remote_size remote_id line pct eta last m

            rm -f "$backup_file" "$log"

            if docker inspect -f '{{.State.Running}}' windows 2>/dev/null | grep -qx true; then
              docker pause windows >/dev/null 2>&1 || true
              paused=1
            fi

            telegram_send "🔄 Windows backup started. Windows is paused briefly for a consistent disk snapshot."

            if ! sudo tar --sparse -C /opt -czf "$backup_file" windows; then
              [ "$paused" -eq 1 ] && docker unpause windows >/dev/null 2>&1 || true
              rmdir /tmp/windows-backup.lock 2>/dev/null || true
              telegram_send "❌ Windows backup archive creation failed."
              return 1
            fi

            [ "$paused" -eq 1 ] && docker unpause windows >/dev/null 2>&1 || true

            local_size="$(stat -c '%s' "$backup_file")"
            telegram_send "📦 Windows backup archive created: ${local_size} bytes. Uploading to Google Drive..."

            rclone copyto "$backup_file" "gdrive:windows-backup.tar.gz" \
              --ignore-times --stats 5s --stats-one-line --stats-log-level NOTICE \
              --retries 5 --low-level-retries 20 --drive-chunk-size 64M \
              >"$log" 2>&1 &
            pid=$!
            last=0

            while kill -0 "$pid" 2>/dev/null; do
              sleep 5
              line="$(grep -E '[0-9]{1,3}%' "$log" | tail -1 || true)"
              pct="$(printf '%s' "$line" | grep -oE '[0-9]{1,3}%' | tail -1 | tr -d '%' || true)"
              eta="$(printf '%s' "$line" | grep -oE 'ETA [^,]+' | tail -1 || true)"
              if [[ "$pct" =~ ^[0-9]+$ ]]; then
                m=$((pct/10*10))
                if [ "$m" -ge 10 ] && [ "$m" -le 100 ] && [ "$m" -gt "$last" ]; then
                  if [ -n "$eta" ]; then telegram_send "⬆️ Windows backup upload: ${m}% — ${eta} remaining."; else telegram_send "⬆️ Windows backup upload: ${m}%."; fi
                  last=$m
                fi
              fi
            done

            wait "$pid"
            rc=$?
            if [ "$rc" -ne 0 ]; then
              telegram_send "❌ Windows backup upload failed. The local archive is kept for retry."
              tail -40 "$log" || true
              rmdir /tmp/windows-backup.lock 2>/dev/null || true
              return 1
            fi

            sleep 10
            if ! rclone lsjson "gdrive:windows-backup.tar.gz" --stat --no-modtime --no-mimetype >/tmp/windows-verify.json 2>/dev/null; then
              telegram_send "⚠️ Google Drive verification request failed; retrying upload once."
              rclone copyto "$backup_file" "gdrive:windows-backup.tar.gz" --ignore-times --retries 5 --low-level-retries 20 --drive-chunk-size 64M >/dev/null 2>&1 || true
              sleep 10
              rclone lsjson "gdrive:windows-backup.tar.gz" --stat --no-modtime --no-mimetype >/tmp/windows-verify.json 2>/dev/null || true
            fi

            remote_size="$(jq -r '.Size // -1' /tmp/windows-verify.json 2>/dev/null || echo -1)"
            remote_id="$(jq -r '.ID // empty' /tmp/windows-verify.json 2>/dev/null || true)"

            if [ "$remote_size" = "$local_size" ] && [ -n "$remote_id" ]; then
              rm -f "$backup_file"
              telegram_send "✅ Windows backup verified successfully. Local temporary archive deleted."
              rmdir /tmp/windows-backup.lock 2>/dev/null || true
              return 0
            fi

            telegram_send "❌ Windows backup verification failed. Local archive is kept so data is not lost."
            echo "Local size: $local_size | Remote size: $remote_size | Remote ID: $remote_id"
            rmdir /tmp/windows-backup.lock 2>/dev/null || true
            return 1
          }

          backup_tailscale() {
            local src=/tmp/tailscale-state.tar.gz
            local local_size remote_size remote_id

            if [ ! -f /var/lib/tailscale/tailscaled.state ]; then
              telegram_send "⚠️ Tailscale state file not found; state backup skipped."
              return 1
            fi

            rm -f "$src"
            if ! sudo tar -czf "$src" -C /var/lib/tailscale tailscaled.state; then
              telegram_send "❌ Tailscale state archive creation failed."
              return 1
            fi

            local_size="$(stat -c '%s' "$src")"
            rclone copyto "$src" "gdrive:tailscale-state.tar.gz" \
              --ignore-times --retries 5 --low-level-retries 20 --drive-chunk-size 16M \
              >/tmp/tailscale-upload.log 2>&1 || {
                telegram_send "❌ Tailscale state upload failed."
                return 1
              }

            sleep 3
            rclone lsjson "gdrive:tailscale-state.tar.gz" --stat --no-modtime --no-mimetype >/tmp/tailscale-verify.json 2>/dev/null || true
            remote_size="$(jq -r '.Size // -1' /tmp/tailscale-verify.json 2>/dev/null || echo -1)"
            remote_id="$(jq -r '.ID // empty' /tmp/tailscale-verify.json 2>/dev/null || true)"

            if [ "$remote_size" = "$local_size" ] && [ -n "$remote_id" ]; then
              touch /tmp/tailscale-backup-done
              telegram_send "✅ Tailscale state backup verified. Same Tailscale node identity can be restored on the next run."
              rm -f "$src"
              return 0
            fi

            telegram_send "❌ Tailscale state verification failed; local state archive was kept temporarily."
            return 1
          }

          rdp_connected=0
          last_backup=0
          BACKUP_INTERVAL=2100
          POLL_PID=''

          telegram_poller &
          POLL_PID=$!

          cleanup() {
            if [ -n "$POLL_PID" ]; then kill "$POLL_PID" 2>/dev/null || true; fi
          }
          trap cleanup EXIT

          telegram_send "📡 VPS monitor is active. Automatic Windows + Tailscale backups run every 35 minutes."

          while true; do
            now_epoch="$(date +%s)"

            if [ -f "$REQUEST" ]; then
              choice="$(cat "$REQUEST")"
              rm -f "$REQUEST"
              if [ "$choice" = "backup" ]; then
                telegram_send "🛑 Controlled shutdown started. First I will create the Windows backup and Tailscale state backup."
                backup_windows || true
                backup_tailscale || true
                touch /tmp/controlled-stop
                telegram_send "🛑 Backups finished. Stopping Windows now..."
                break
              elif [ "$choice" = "nobackup" ]; then
                touch /tmp/controlled-stop-no-backup
                telegram_send "🛑 Stopping Windows without a new backup..."
                break
              fi
            fi

            established="$(ss -Htn state established '( sport = :3389 or dport = :3389 )' 2>/dev/null | grep -vE '127\.0\.0\.1|\[::1\]' | wc -l | tr -d ' ')"
            if [ "${established:-0}" -gt 0 ] && [ "$rdp_connected" -eq 0 ]; then
              rdp_connected=1
              telegram_send "🟢 RDP CONNECTED."
            elif [ "${established:-0}" -eq 0 ] && [ "$rdp_connected" -eq 1 ]; then
              rdp_connected=0
              telegram_send "🔴 RDP DISCONNECTED. Starting an immediate Windows + Tailscale backup..."
              backup_windows || true
              backup_tailscale || true
              last_backup="$(date +%s)"
            fi

            if [ $((now_epoch-last_backup)) -ge "$BACKUP_INTERVAL" ]; then
              telegram_send "⏰ 35-minute timer reached. Starting Windows + Tailscale backup..."
              backup_windows || true
              backup_tailscale || true
              last_backup="$(date +%s)"
            fi

            if ! docker inspect windows >/dev/null 2>&1; then
              telegram_send "⚠️ Windows container disappeared. Ending monitor."
              break
            fi

            if ! docker inspect -f '{{.State.Running}}' windows 2>/dev/null | grep -qx true; then
              telegram_send "⚠️ Windows container is no longer running. Ending monitor."
              break
            fi

            sleep 5
          done

      - name: Stop Windows cleanly
        if: ${{ always() }}
        run: |
          if [ -f /tmp/controlled-stop-no-backup ]; then
            docker stop --time 120 windows 2>/dev/null || docker rm -f windows 2>/dev/null || true
          elif [ -f /tmp/controlled-stop ]; then
            docker stop --time 120 windows 2>/dev/null || docker rm -f windows 2>/dev/null || true
          else
            docker stop --time 120 windows 2>/dev/null || true
          fi

      - name: Final Tailscale state save
        if: ${{ always() }}
        run: |
          if [ -f /tmp/controlled-stop-no-backup ]; then
            echo 'User selected stop without backup; skipping final Tailscale backup.'
            exit 0
          fi
          if [ -f /tmp/tailscale-backup-done ]; then
            echo 'Tailscale state already backed up during controlled shutdown.'
            exit 0
          fi
          if [ -f /var/lib/tailscale/tailscaled.state ]; then
            sudo tar -czf /tmp/tailscale-state-final.tar.gz -C /var/lib/tailscale tailscaled.state || true
            rclone copyto /tmp/tailscale-state-final.tar.gz gdrive:tailscale-state.tar.gz --ignore-times --retries 3 --low-level-retries 10 >/dev/null 2>&1 || true
          fi

      - name: Final notification
        if: ${{ always() }}
        run: |
          if [ -f /tmp/controlled-stop ]; then
            TEXT='🛑 VPS stopped by Telegram after the requested backup.'
          elif [ -f /tmp/controlled-stop-no-backup ]; then
            TEXT='🛑 VPS stopped by Telegram without creating a new backup.'
          else
            TEXT='🏁 VPS workflow ended. If this was unexpected, check the Actions log.'
          fi
          curl -fsS --max-time 20 -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=$(date '+%I:%M:%S %p') : ${TEXT}" \
            >/dev/null || true
