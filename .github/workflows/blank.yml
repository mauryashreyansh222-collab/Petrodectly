name: Continuous Persistent VPS

on:
  workflow_dispatch:

concurrency:
  group: vps-session
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

env:
  RCLONE_CONFIG_GDRIVE_TYPE: drive
  RCLONE_CONFIG_GDRIVE_SCOPE: drive
  RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.RCLONE_DRIVE_TOKEN }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  GH_TOKEN: ${{ github.token }}
  TZ: Asia/Kolkata

jobs:
  vps-session:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repo
        uses: actions/checkout@v4

      # ============================================================
      # 2. CREATE SMART PROGRESS TRACKER & TELEGRAM BOT
      # ============================================================
      - name: Setup Tracking & Telegram Bot
        run: |
          sudo apt-get update && sudo apt-get install -y tmux python3 curl unzip net-tools neofetch iproute2 xxd jq util-linux zstd
          
          # --- PROGRESS TRACKER SCRIPT (Live Percentage sender) ---
          cat << 'EOF' | sudo tee /usr/local/bin/rclone_progress.sh >/dev/null
          #!/bin/bash
          SRC="$1"
          DST="$2"
          MSG="$3"
          LOG="/tmp/rclone_run.log"
          rm -f "$LOG"
          
          rclone copyto "$SRC" "$DST" --ignore-times --stats 5s --stats-one-line > "$LOG" 2>&1 &
          PID=$!
          LAST_PCT=0
          
          while kill -0 $PID 2>/dev/null; do
              sleep 5
              PCT=$(tail -n 10 "$LOG" 2>/dev/null | grep -oE '[0-9]+%' | tail -1 | tr -d '%' || true)
              if [[ "$PCT" =~ ^[0-9]+$ ]]; then
                  if [ "$PCT" -ge $((LAST_PCT + 20)) ] && [ "$PCT" -lt 100 ]; then
                      NOW=$(date '+%I:%M:%S %p')
                      curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d chat_id="${TELEGRAM_CHAT_ID}" --data-urlencode "text=${NOW} : ⏳ ${MSG} : ${PCT}% complete..." > /dev/null || true
                      LAST_PCT=$((PCT / 20 * 20))
                  fi
              fi
          done
          wait $PID
          exit $?
          EOF
          sudo chmod +x /usr/local/bin/rclone_progress.sh

          # --- TELEGRAM LISTENER SCRIPT ---
          cat << EOF > /tmp/telegram_listener.py
          import json, os, time, urllib.request, urllib.parse
          BOT_TOKEN = "${TELEGRAM_BOT_TOKEN}"
          CHAT_ID = "${TELEGRAM_CHAT_ID}"
          GH_TOKEN = "${GH_TOKEN}"
          REPO = "${GITHUB_REPOSITORY}"
          RUN_ID = "${GITHUB_RUN_ID}"
          API = f"https://api.telegram.org/bot{BOT_TOKEN}"
          ACTION_FILE = "/tmp/telegram_action"

          def api_call(method, params=None):
              url = f"{API}/{method}"
              data = urllib.parse.urlencode(params or {}).encode() if params else None
              try:
                  with urllib.request.urlopen(url, data=data, timeout=15) as resp: return json.loads(resp.read().decode())
              except Exception: return None

          def send_buttons():
              kb = {"inline_keyboard": [
                  [{"text": "💾 BACKUP & STOP", "callback_data": "backup_stop"}],
                  [{"text": "❌ STOP WITHOUT BACKUP", "callback_data": "stop_nobackup"}]
              ]}
              api_call("sendMessage", {"chat_id": CHAT_ID, "text": "Sir, how would you like to stop?", "reply_markup": json.dumps(kb)})

          def cancel_github_workflow():
              url = f"https://api.github.com/repos/{REPO}/actions/runs/{RUN_ID}/cancel"
              req = urllib.request.Request(url, method="POST")
              req.add_header("Authorization", f"token {GH_TOKEN}")
              req.add_header("Accept", "application/vnd.github+json")
              try: urllib.request.urlopen(req)
              except Exception: pass

          def main():
              api_call("deleteWebhook", {"drop_pending_updates": "true"})
              res = api_call("getUpdates", {"timeout": 1})
              offset = 0
              if res and res.get("ok"):
                  for u in res.get("result", []): offset = max(offset, u["update_id"] + 1)
              while True:
                  res = api_call("getUpdates", {"offset": offset, "timeout": 20})
                  if not res or not res.get("ok"):
                      time.sleep(3)
                      continue
                  for u in res.get("result", []):
                      offset = u["update_id"] + 1
                      msg = u.get("message")
                      if msg and str(msg.get("chat", {}).get("id")) == str(CHAT_ID):
                          if (msg.get("text") or "").strip() == "/stop": send_buttons()
                      cb = u.get("callback_query")
                      if cb and str(cb.get("message", {}).get("chat", {}).get("id")) == str(CHAT_ID):
                          data = cb.get("data", "")
                          if data == "stop_nobackup":
                              api_call("sendMessage", {"chat_id": CHAT_ID, "text": f"{time.strftime('%I:%M:%S %p')} : 🛑 Cancelling workflow immediately without backup."})
                              os.system("touch /tmp/skip_final_backup")
                              cancel_github_workflow()
                          elif data == "backup_stop":
                              if os.path.exists("/tmp/main_loop_started"):
                                  with open(ACTION_FILE, "w") as f: f.write(data)
                              else:
                                  api_call("sendMessage", {"chat_id": CHAT_ID, "text": f"{time.strftime('%I:%M:%S %p')} : ⚠️ System not ready. Cancelling immediately without backup."})
                                  os.system("touch /tmp/skip_final_backup")
                                  cancel_github_workflow()
          if __name__ == "__main__": main()
          EOF
          
          tmux new-session -d -s tgbot 'python3 /tmp/telegram_listener.py'
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d chat_id="${TELEGRAM_CHAT_ID}" --data-urlencode "text=$(date '+%I:%M:%S %p') : 🚀 Workflow Started! Global Telegram Bot is Active. Type /stop anytime." > /dev/null || true

      # ============================================================
      # 3. RCLONE INSTALL
      # ============================================================
      - name: Install Rclone
        run: curl https://rclone.org/install.sh | sudo bash

      # ============================================================
      # 4. TAILSCALE INSTALL & FOLDER RESTORE
      # ============================================================
      - name: Restore Tailscale
        run: |
          sudo hostnamectl set-hostname biralo
          curl -fsSL https://tailscale.com/install.sh | sh
          
          # Stop service to prevent read/write conflicts during restore
          sudo systemctl stop tailscaled 2>/dev/null || true
          
          FOUND=$(rclone lsf gdrive: --files-only -R 2>/dev/null | grep -E '(^|/)tailscale-state\.tar\.gz$' | head -1 || true)
          if [ -n "$FOUND" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d chat_id="${TELEGRAM_CHAT_ID}" --data-urlencode "text=$(date '+%I:%M:%S %p') : 📡 Found Tailscale Backup. Restoring identity..." > /dev/null || true
            rclone copyto "gdrive:${FOUND}" "/tmp/tailscale-state.tar.gz"
            sudo rm -rf /var/lib/tailscale/* 2>/dev/null || true
            sudo mkdir -p /var/lib/tailscale
            sudo tar -xzf /tmp/tailscale-state.tar.gz -C /var/lib/
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d chat_id="${TELEGRAM_CHAT_ID}" --data-urlencode "text=$(date '+%I:%M:%S %p') : ✅ Tailscale identity successfully restored." > /dev/null || true
          else
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d chat_id="${TELEGRAM_CHAT_ID}" --data-urlencode "text=$(date '+%I:%M:%S %p') : ℹ️ No Tailscale backup found. Creating a fresh identity." > /dev/null || true
          fi

      # ============================================================
      # 5. START TAILSCALE
      # ============================================================
      - name: Start Tailscale
        run: |
          sudo systemctl start tailscaled
          sleep 5
          sudo tailscale up --authkey "${{ secrets.TAILSCALE_AUTHKEY }}" --hostname=biralo --ssh
          sleep 10
          TS_IP=$(tailscale ip -4 2>/dev/null || echo "not available")
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d chat_id="${TELEGRAM_CHAT_ID}" --data-urlencode "text=$(date '+%I:%M:%S %p') : 🌐 Tailscale Online. IP: ${TS_IP}" > /dev/null || true

      # ============================================================
      # 6. RESTORE WINDOWS (With Live Loading Percentage)
      # ============================================================
      - name: Restore Windows
        run: |
          sudo sysctl -w net.ipv4.ip_forward=1
          docker image prune --all --force 2>/dev/null || true
          
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d chat_id="${TELEGRAM_CHAT_ID}" --data-urlencode "text=$(date '+%I:%M:%S %p') : 🔍 Checking Google Drive for Windows backup..." > /dev/null || true
          
          FOUND_ZST=$(rclone lsf gdrive: --files-only -R 2>/dev/null | grep -E '(^|/)windows-backup\.tar\.zst$' | head -1 || true)
          FOUND_GZ=$(rclone lsf gdrive: --files-only -R 2>/dev/null | grep -E '(^|/)windows-backup\.tar\.gz$' | head -1 || true)

          if [ -n "$FOUND_ZST" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d chat_id="${TELEGRAM_CHAT_ID}" --data-urlencode "text=$(date '+%I:%M:%S %p') : ⬇️ ZST Backup found. Loading starting now..." > /dev/null || true
            /usr/local/bin/rclone_progress.sh "gdrive:${FOUND_ZST}" "/tmp/windows-backup.tar.zst" "Loading Windows Backup"
            
            sudo rm -rf /opt/windows && sudo mkdir -p /opt/windows
            sudo tar -I zstd -xf "/tmp/windows-backup.tar.zst" -C /opt/
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d chat_id="${TELEGRAM_CHAT_ID}" --data-urlencode "text=$(date '+%I:%M:%S %p') : 📦 Backup extracted successfully." > /dev/null || true

          elif [ -n "$FOUND_GZ" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d chat_id="${TELEGRAM_CHAT_ID}" --data-urlencode "text=$(date '+%I:%M:%S %p') : ⬇️ Legacy GZ Backup found. Loading starting now..." > /dev/null || true
            /usr/local/bin/rclone_progress.sh "gdrive:${FOUND_GZ}" "/tmp/windows-backup.tar.gz" "Loading Legacy Backup"
            
            sudo rm -rf /opt/windows && sudo mkdir -p /opt/windows
            sudo tar -xzf "/tmp/windows-backup.tar.gz" -C /opt/
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d chat_id="${TELEGRAM_CHAT_ID}" --data-urlencode "text=$(date '+%I:%M:%S %p') : 📦 Backup extracted successfully." > /dev/null || true
          else
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d chat_id="${TELEGRAM_CHAT_ID}" --data-urlencode "text=$(date '+%I:%M:%S %p') : 🪟 No previous backup found. Starting fresh installation." > /dev/null || true
          fi

      # ============================================================
      # 7. START WINDOWS
      # ============================================================
      - name: Start Windows
        run: |
          docker pull ghcr.io/dockur/windows
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d chat_id="${TELEGRAM_CHAT_ID}" --data-urlencode "text=$(date '+%I:%M:%S %p') : 🪟 Booting up Windows System..." > /dev/null || true
          docker rm -f windows 2>/dev/null || true
          docker run -d --name windows \
            -e VERSION="11" \
            -e USERNAME="admin" \
            -e PASSWORD="${{ secrets.WINDOWS_PASSWORD }}" \
            -e RAM_SIZE="8G" \
            -e CPU_CORES="3" \
            -e DISK_SIZE="60G" \
            -p 3389:3389/tcp \
            -p 3389:3389/udp \
            -v /opt/windows:/storage \
            --device=/dev/kvm \
            --cap-add NET_ADMIN \
            ghcr.io/dockur/windows

      # ============================================================
      # 8. WAIT FOR RDP
      # ============================================================
      - name: Wait for RDP
        run: |
          READY=0
          STABLE_COUNT=0
          for i in $(seq 1 180); do
            RESPONSE=$(timeout 3 bash -c 'exec 3<>/dev/tcp/127.0.0.1/3389; printf "\x03\x00\x00\x13\x0e\xe0\x00\x00\x00\x00\x00\x01\x00\x08\x00\x03\x00\x00\x00" >&3; head -c 4 <&3 | xxd -p' 2>/dev/null || true)
            if [ -n "$RESPONSE" ]; then STABLE_COUNT=$((STABLE_COUNT + 1)); else STABLE_COUNT=0; fi
            if [ "$STABLE_COUNT" -ge 2 ]; then READY=1; break; fi
            sleep 10
          done
          
          TS_IP=$(tailscale ip -4 2>/dev/null || echo "not available")
          if [ "$READY" = "1" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d chat_id="${TELEGRAM_CHAT_ID}" --data-urlencode "text=$(date '+%I:%M:%S %p') : 🖥️ RDP is Ready! Connect using Tailscale IP: ${TS_IP}" > /dev/null || true
          else
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d chat_id="${TELEGRAM_CHAT_ID}" --data-urlencode "text=$(date '+%I:%M:%S %p') : ⚠️ RDP is taking long. Try connecting to IP: ${TS_IP}" > /dev/null || true
          fi

      # ============================================================
      # 9. MAIN CONTROLLER (With Live Upload Percentage & Double Backup)
      # ============================================================
      - name: Main Controller (Monitor & Backup)
        run: |
          touch /tmp/main_loop_started
          
          notify_telegram() { curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d chat_id="${TELEGRAM_CHAT_ID}" --data-urlencode "text=$(date '+%I:%M:%S %p') : $1" > /dev/null || true; }

          backup_now() {
            notify_telegram "🔄 Backup Sequence Started. Reason: $1."
            
            # 1. TAILSCALE DIRECTORY BACKUP
            if [ -d /var/lib/tailscale ]; then
               sudo tar -czf /tmp/tailscale-state.tar.gz -C /var/lib tailscale 2>/dev/null || true
               rclone copyto /tmp/tailscale-state.tar.gz gdrive:tailscale-state.tar.gz --ignore-times 2>/dev/null || true
               notify_telegram "✅ Tailscale IP state saved."
            fi
            
            # 2. WINDOWS BACKUP WITH LIVE PERCENTAGE
            sudo docker pause windows 2>/dev/null || true
            rm -f /tmp/windows-backup.tar.zst
            notify_telegram "🗜️ Compressing Windows Data (ZSTD)..."
            
            if sudo tar --sparse -I 'zstd -T0 -3' -cf /tmp/windows-backup.tar.zst -C /opt windows; then
               sudo docker unpause windows 2>/dev/null || true
               notify_telegram "⬆️ Compression done. Uploading to Google Drive..."
               
               if /usr/local/bin/rclone_progress.sh "/tmp/windows-backup.tar.zst" "gdrive:windows-backup.tar.zst.tmp" "Uploading Backup"; then
                  rclone moveto "gdrive:windows-backup.tar.zst.tmp" "gdrive:windows-backup.tar.zst"
                  rclone cleanup gdrive: 2>/dev/null || true
                  notify_telegram "✅ Backup uploaded successfully."
                  touch /tmp/skip_final_backup
                  return 0
               fi
            fi
            sudo docker unpause windows 2>/dev/null || true
            notify_telegram "⚠️ Windows Backup failed during upload or compression."
            return 1
          }

          START_TIME=$(date +%s)
          TOTAL_SECONDS=19500
          BACKUP_INTERVAL=2100
          LAST_BACKUP_TIME=$START_TIME
          WAS_CONNECTED=0

          notify_telegram "🟢 System Monitored. Auto Double-Backups (Win+VPN) every 35 mins."

          while true; do
            sleep 5
            CURRENT_TIME=$(date +%s)

            if [ $((CURRENT_TIME - START_TIME)) -ge $TOTAL_SECONDS ]; then
               notify_telegram "⏳ Max 325-minute runtime reached. Initiating final shutdown..."
               break
            fi

            if [ -f /tmp/telegram_action ]; then
               ACTION=$(cat /tmp/telegram_action)
               rm -f /tmp/telegram_action
               if [ "$ACTION" = "backup_stop" ]; then
                  backup_now "Telegram Stop Command"
                  break 
               fi
            fi

            ELAPSED_SINCE_BACKUP=$((CURRENT_TIME - LAST_BACKUP_TIME))
            if [ "$ELAPSED_SINCE_BACKUP" -ge "$BACKUP_INTERVAL" ]; then
               backup_now "35-Minute Auto Timer"
               LAST_BACKUP_TIME=$(date +%s)
               rm -f /tmp/skip_final_backup
            fi

            ACTIVE=$(sudo ss -Htn state established '( sport = :3389 or dport = :3389 )' 2>/dev/null | wc -l)
            if [ "$ACTIVE" -gt 0 ] && [ "$WAS_CONNECTED" -eq 0 ]; then
               WAS_CONNECTED=1
               notify_telegram "🟢 RDP Connected by user."
            elif [ "$ACTIVE" -eq 0 ] && [ "$WAS_CONNECTED" -eq 1 ]; then
               WAS_CONNECTED=0
               backup_now "RDP Disconnected (Safety Backup)"
               LAST_BACKUP_TIME=$(date +%s)
               rm -f /tmp/skip_final_backup
            fi
          done

      # ============================================================
      # 10. EMERGENCY / FINAL BACKUP
      # ============================================================
      - name: Final/Emergency Backup
        if: always()
        continue-on-error: true
        run: |
          if [ -f /tmp/skip_final_backup ]; then
             echo "Skipping final backup (already taken)."
             exit 0
          fi
          
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d chat_id="${TELEGRAM_CHAT_ID}" --data-urlencode "text=$(date '+%I:%M:%S %p') : 🚨 Session closing. Forcing an Emergency Backup." > /dev/null || true
          
          if [ -d /var/lib/tailscale ]; then
             sudo tar -czf /tmp/tailscale-state.tar.gz -C /var/lib tailscale 2>/dev/null || true
             rclone copyto /tmp/tailscale-state.tar.gz gdrive:tailscale-state.tar.gz --ignore-times 2>/dev/null || true
          fi

          if [ -d /opt/windows ]; then
            sudo docker pause windows 2>/dev/null || true
            rm -f /tmp/windows-backup.tar.zst
            if sudo tar --sparse -I 'zstd -T0 -3' -cf /tmp/windows-backup.tar.zst -C /opt windows; then
              /usr/local/bin/rclone_progress.sh "/tmp/windows-backup.tar.zst" "gdrive:windows-backup.tar.zst.tmp" "Emergency Upload"
              rclone moveto "gdrive:windows-backup.tar.zst.tmp" "gdrive:windows-backup.tar.zst"
            fi
            sudo docker unpause windows 2>/dev/null || true
          fi

      # ============================================================
      # 11. SHUTDOWN & CLEANUP
      # ============================================================
      - name: Stop Windows cleanly
        if: always()
        continue-on-error: true
        run: |
          tmux kill-session -t tgbot 2>/dev/null || true
          timeout 60 sudo docker stop windows || true
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d chat_id="${TELEGRAM_CHAT_ID}" --data-urlencode "text=$(date '+%I:%M:%S %p') : ✅ VPS session successfully finished and cleaned up. Have a great day!" > /dev/null || true
