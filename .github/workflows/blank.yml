name: Continuous Persistent VPS

on:
  workflow_dispatch:

concurrency:
  group: vps-session
  cancel-in-progress: false

env:
  RCLONE_CONFIG_GDRIVE_TYPE: drive
  RCLONE_CONFIG_GDRIVE_SCOPE: drive
  RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.RCLONE_DRIVE_TOKEN }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  WINDOWS_PASSWORD: ${{ secrets.WINDOWS_PASSWORD }}
  TZ: Asia/Kolkata

jobs:
  vps-session:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools and configure Telegram
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y curl jq sudo net-tools iproute2 openssh-server util-linux ca-certificates
          curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone version | head -3
          test -n "$TELEGRAM_BOT_TOKEN" || { echo 'TELEGRAM_BOT_TOKEN is missing'; exit 1; }
          test -n "$TELEGRAM_CHAT_ID" || { echo 'TELEGRAM_CHAT_ID is missing'; exit 1; }
          test -n "$WINDOWS_PASSWORD" || { echo 'WINDOWS_PASSWORD is missing'; exit 1; }
          test -n "${{ secrets.TAILSCALE_AUTHKEY }}" || { echo 'TAILSCALE_AUTHKEY is missing'; exit 1; }

          cat > /tmp/telegram-helper.sh <<'EOF'
          #!/usr/bin/env bash
          telegram_send() {
            local msg="$*" response='' attempt
            for attempt in 1 2 3 4 5; do
              response="$(curl -sS --max-time 25 -X POST \
                "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                -d "chat_id=${TELEGRAM_CHAT_ID}" \
                --data-urlencode "text=$(date '+%I:%M:%S %p') : ${msg}" 2>&1 || true)"
              if echo "$response" | jq -e '.ok == true' >/dev/null 2>&1; then return 0; fi
              sleep 2
            done
            echo "Telegram send failed: ${response}" >&2
            return 1
          }
          EOF
          chmod 700 /tmp/telegram-helper.sh
          source /tmp/telegram-helper.sh
          curl -fsS --max-time 25 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getMe" | jq -e '.ok == true' >/dev/null
          curl -fsS --max-time 25 -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/deleteWebhook" -d 'drop_pending_updates=false' | jq -e '.ok == true' >/dev/null
          telegram_send '🚀 VPS workflow started.'
          telegram_send '🧰 Telegram, Google Drive, Tailscale and Windows checks are starting.'
          telegram_send '✅ Step 1/6 complete.'

      - name: Setup Tailscale with persistent identity
        run: |
          set -Eeuo pipefail
          source /tmp/telegram-helper.sh
          trap 'telegram_send "❌ Tailscale step failed. Check the GitHub Actions log." || true' ERR
          telegram_send '📡 Step 2/6: Installing Tailscale and restoring the persistent node identity...'
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo systemctl stop tailscaled 2>/dev/null || true
          sudo pkill -x tailscaled 2>/dev/null || true

          # IMPORTANT: rclone runs as the GitHub runner user, so all rclone temp files
          # live in RUNNER_TEMP and are never created in a root-owned /tmp directory.
          TS_WORK="${RUNNER_TEMP}/tailscale-work"
          rm -rf "$TS_WORK"
          mkdir -p "$TS_WORK"
          chmod 700 "$TS_WORK"
          sudo mkdir -p /var/lib/tailscale

          TS_BACKUP=''
          while IFS= read -r p; do
            [ -n "$p" ] || continue
            if rclone lsjson "gdrive:${p}" --stat --no-modtime --no-mimetype >"$TS_WORK/stat.json" 2>/dev/null \
              && jq -e '.Size > 0' "$TS_WORK/stat.json" >/dev/null 2>&1; then
              TS_BACKUP="$p"
              break
            fi
          done < <(rclone lsf gdrive: --recursive --files-only 2>/dev/null | grep -E '(^|/)tailscale-state\.tar\.gz$' || true)

          if [ -n "$TS_BACKUP" ]; then
            telegram_send '🔄 Previous Tailscale state found. Restoring it without creating a new node.'
            rclone copyto "gdrive:${TS_BACKUP}" "$TS_WORK/tailscale-state.tar.gz" --retries 5 --low-level-retries 20
            test -s "$TS_WORK/tailscale-state.tar.gz"
            sudo rm -rf /var/lib/tailscale/*
            sudo tar -xzf "$TS_WORK/tailscale-state.tar.gz" -C /var/lib/tailscale
            sudo test -s /var/lib/tailscale/tailscaled.state
            sudo chmod 600 /var/lib/tailscale/tailscaled.state
            TS_HAD_BACKUP=1
            telegram_send '✅ Tailscale state restored successfully.'
          else
            TS_HAD_BACKUP=0
            telegram_send '🆕 No previous Tailscale state backup found. First registration will be used.'
          fi

          sudo systemctl enable tailscaled >/dev/null
          sudo systemctl start tailscaled
          TS_IP=''
          for i in $(seq 1 60); do
            TS_IP="$(tailscale ip -4 2>/dev/null | head -1 || true)"
            [[ "$TS_IP" =~ ^100\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]] && break
            sleep 2
          done

          if [[ ! "$TS_IP" =~ ^100\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]]; then
            if [ "$TS_HAD_BACKUP" -eq 1 ]; then
              telegram_send '❌ Restored Tailscale identity did not reconnect. I will NOT authenticate a new node, preventing an intentional IP change.'
              exit 1
            fi
            telegram_send '🔐 Authenticating the first Tailscale node...'
            TS_AUTH_KEY='${{ secrets.TAILSCALE_AUTHKEY }}'
            sudo env TS_AUTH_KEY="$TS_AUTH_KEY" tailscale up --auth-key="$TS_AUTH_KEY" --hostname=biralo --ssh --timeout=90s
            unset TS_AUTH_KEY
          else
            sudo tailscale set --hostname=biralo --ssh 2>/dev/null || true
          fi

          TS_IP=''
          for i in $(seq 1 60); do
            TS_IP="$(tailscale ip -4 2>/dev/null | head -1 || true)"
            [[ "$TS_IP" =~ ^100\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]] && break
            sleep 2
          done
          [[ "$TS_IP" =~ ^100\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]] || { telegram_send '❌ Tailscale did not obtain a 100.x IPv4 address.'; exit 1; }
          echo "TAILSCALE_IP=$TS_IP" >> "$GITHUB_ENV"
          telegram_send "🌐 Tailscale is online. IPv4: ${TS_IP}"

          # ONE-TIME Tailscale backup. This is outside the Windows backup loop.
          telegram_send '💾 Creating the one-time Tailscale state backup...'
          sudo systemctl stop tailscaled
          sudo test -s /var/lib/tailscale/tailscaled.state
          sudo tar -czf "$TS_WORK/tailscale-state.tar.gz" -C /var/lib/tailscale tailscaled.state
          sudo chown "$(id -u):$(id -g)" "$TS_WORK/tailscale-state.tar.gz"
          sudo systemctl start tailscaled

          TS_TMP="tailscale-state.$(date +%s).tmp.tar.gz"
          rclone copyto "$TS_WORK/tailscale-state.tar.gz" "gdrive:${TS_TMP}" --ignore-times --retries 5 --low-level-retries 20 --drive-chunk-size 16M
          TS_SIZE="$(rclone lsjson "gdrive:${TS_TMP}" --stat --no-modtime --no-mimetype 2>/dev/null | jq -r '.Size // 0' || echo 0)"
          if [ "$TS_SIZE" -le 0 ]; then
            rclone deletefile "gdrive:${TS_TMP}" >/dev/null 2>&1 || true
            telegram_send '❌ Tailscale backup verification failed.'
            exit 1
          fi
          rclone moveto "gdrive:${TS_TMP}" gdrive:tailscale-state.tar.gz --retries 5 --low-level-retries 20
          rm -rf "$TS_WORK"
          telegram_send "✅ One-time Tailscale backup saved and verified (${TS_SIZE} bytes)."
          telegram_send '✅ Step 2/6 complete.'

      - name: Prepare Linux host
        run: |
          set -Eeuo pipefail
          source /tmp/telegram-helper.sh
          trap 'telegram_send "❌ Linux host preparation failed. Check the GitHub Actions log." || true' ERR
          telegram_send '🖥️ Step 3/6: Preparing the Linux host...'
          sudo hostnamectl set-hostname biralo
          if ! id -u biralo >/dev/null 2>&1; then
            sudo useradd -m -s /bin/bash biralo
            echo 'biralo:biralo' | sudo chpasswd
            sudo usermod -aG sudo biralo
            echo 'biralo ALL=(ALL) NOPASSWD:ALL' | sudo tee /etc/sudoers.d/biralo >/dev/null
            sudo chmod 440 /etc/sudoers.d/biralo
          fi
          sudo sed -i 's/^#\?PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/^#\?PermitRootLogin.*/PermitRootLogin no/' /etc/ssh/sshd_config
          sudo systemctl enable ssh >/dev/null
          sudo systemctl restart ssh
          sudo sysctl -w net.ipv4.ip_forward=1 >/dev/null
          sudo sysctl -w net.ipv4.conf.all.rp_filter=2 >/dev/null
          sudo sysctl -w net.ipv4.conf.default.rp_filter=2 >/dev/null
          sudo apt-get clean
          telegram_send "🟢 Linux host ready. Tailscale IPv4: ${TAILSCALE_IP}"
          telegram_send '✅ Step 3/6 complete.'

      - name: Restore Windows backup or create fresh storage
        run: |
          set -Eeuo pipefail
          source /tmp/telegram-helper.sh
          trap 'telegram_send "❌ Windows restore/preparation failed. Check the GitHub Actions log." || true' ERR
          telegram_send '💾 Step 4/6: Looking for the Windows backup on Google Drive...'
          sudo mkdir -p /opt
          WIN_BACKUP=''
          while IFS= read -r p; do
            [ -n "$p" ] || continue
            if rclone lsjson "gdrive:${p}" --stat --no-modtime --no-mimetype >/tmp/win-stat.json 2>/dev/null \
              && jq -e '.Size > 0' /tmp/win-stat.json >/dev/null 2>&1; then
              WIN_BACKUP="$p"
              break
            fi
          done < <(rclone lsf gdrive: --recursive --files-only 2>/dev/null | grep -E '(^|/)windows-backup\.tar\.gz$' || true)

          if [ -n "$WIN_BACKUP" ]; then
            echo 'WINDOWS_MODE=restore' >> "$GITHUB_ENV"
            telegram_send '📦 Windows backup found. Streaming it directly into /opt.'
            sudo rm -rf /opt/windows
            set +e
            rclone cat "gdrive:${WIN_BACKUP}" | sudo tar -xzf - -C /opt
            PIPE_STATUS=("${PIPESTATUS[@]}")
            set -e
            if [ "${PIPE_STATUS[0]}" -ne 0 ] || [ "${PIPE_STATUS[1]}" -ne 0 ] || [ ! -d /opt/windows ]; then
              telegram_send '❌ Windows backup restore failed.'
              exit 1
            fi
            telegram_send '✅ Windows backup restored successfully.'
          else
            echo 'WINDOWS_MODE=fresh' >> "$GITHUB_ENV"
            sudo rm -rf /opt/windows
            sudo mkdir -p /opt/windows
            telegram_send '⚠️ No Windows backup found. A fresh Windows 11 installation will start.'
          fi
          telegram_send '✅ Step 4/6 complete.'

      - name: Pull Dockur Windows image
        run: |
          set -Eeuo pipefail
          source /tmp/telegram-helper.sh
          trap 'telegram_send "❌ Dockur image step failed. Check the GitHub Actions log." || true' ERR
          telegram_send '📥 Step 5/6: Pulling the Dockur Windows image...'
          docker pull ghcr.io/dockur/windows
          telegram_send '✅ Dockur Windows image is ready.'
          telegram_send '✅ Step 5/6 complete.'

      - name: Start Windows and run monitor
        run: |
          set -uo pipefail
          source /tmp/telegram-helper.sh
          REQUEST=/tmp/vps-request
          CONTAINER=windows
          BACKUP_LOCK=/tmp/windows-backup.lock
          POLLER_PID=''
          rm -f "$REQUEST" "$BACKUP_LOCK"

          send_keyboard() {
            curl -sS --max-time 20 -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=$(date '+%I:%M:%S %p') : 🛑 Select an action:" \
              --data-urlencode 'reply_markup={"inline_keyboard":[[{"text":"💾 BACKUP & STOP","callback_data":"backup_stop"}],[{"text":"❌ STOP WITHOUT BACKUP","callback_data":"stop_no_backup"}],[{"text":"📦 BACKUP NOW - KEEP RUNNING","callback_data":"backup_now"}]]}' \
              >/dev/null 2>&1 || true
          }

          backup_windows() {
            local reason="${1:-manual}"
            if [ -e "$BACKUP_LOCK" ]; then
              telegram_send '⏳ A Windows backup is already running.' || true
              return 0
            fi
            touch "$BACKUP_LOCK"
            telegram_send "💾 Windows backup started (${reason}). Windows will be paused during the archive." || true
            if ! docker inspect "$CONTAINER" >/dev/null 2>&1; then
              rm -f "$BACKUP_LOCK"
              telegram_send '❌ Windows container does not exist.' || true
              return 1
            fi
            docker pause "$CONTAINER" >/dev/null 2>&1 || true
            local tmp_remote="windows-backup.$(date +%s).tmp.tar.gz"
            local log_file="${RUNNER_TEMP}/windows-backup-upload.log"
            : > "$log_file"
            (
              set -o pipefail
              sudo tar -C /opt --sparse -czf - windows | rclone rcat "gdrive:${tmp_remote}" --retries 5 --low-level-retries 20 --drive-chunk-size 16M
            ) >"$log_file" 2>&1 &
            local pid=$!
            while kill -0 "$pid" 2>/dev/null; do
              sleep 15
              telegram_send '📤 Windows backup is still uploading to Google Drive...' || true
            done
            wait "$pid"
            local rc=$?
            if [ "$rc" -eq 0 ]; then
              local size
              size="$(rclone lsjson "gdrive:${tmp_remote}" --stat --no-modtime --no-mimetype 2>/dev/null | jq -r '.Size // 0' || echo 0)"
              if [ "$size" -gt 0 ]; then
                if rclone moveto "gdrive:${tmp_remote}" gdrive:windows-backup.tar.gz --retries 5 --low-level-retries 20; then
                  telegram_send "✅ Windows backup saved and verified (${size} bytes)." || true
                  docker unpause "$CONTAINER" >/dev/null 2>&1 || true
                  rm -f "$BACKUP_LOCK"
                  return 0
                fi
              fi
            fi
            rclone deletefile "gdrive:${tmp_remote}" >/dev/null 2>&1 || true
            docker unpause "$CONTAINER" >/dev/null 2>&1 || true
            rm -f "$BACKUP_LOCK"
            telegram_send '❌ Windows backup failed. The previous good backup was kept.' || true
            return 1
          }

          poller() {
            local offset=0 init maxid resp update uid chat text cb cbid
            init="$(curl -sS --max-time 20 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getUpdates?limit=100&timeout=0" 2>/dev/null || true)"
            maxid="$(echo "$init" | jq -r '[.result[]?.update_id] | max // -1' 2>/dev/null || echo -1)"
            [[ "$maxid" =~ ^[0-9]+$ ]] && offset=$((maxid+1))
            while [ ! -f "$REQUEST" ]; do
              resp="$(curl -sS --max-time 40 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getUpdates?offset=${offset}&timeout=30&limit=50" 2>/dev/null || true)"
              echo "$resp" | jq -e '.ok == true' >/dev/null 2>&1 || { sleep 2; continue; }
              while IFS= read -r update; do
                [ -n "$update" ] || continue
                uid="$(echo "$update" | jq -r '.update_id // empty')"
                [ -n "$uid" ] || continue
                offset=$((uid+1))
                chat="$(echo "$update" | jq -r '.message.chat.id // .callback_query.message.chat.id // empty')"
                [ "$chat" = "$TELEGRAM_CHAT_ID" ] || continue
                text="$(echo "$update" | jq -r '.message.text // empty')"
                cb="$(echo "$update" | jq -r '.callback_query.data // empty')"
                cbid="$(echo "$update" | jq -r '.callback_query.id // empty')"
                case "$text" in /stop|/backup) send_keyboard ;; esac
                case "$cb" in
                  backup_stop)
                    [ -n "$cbid" ] && curl -sS --max-time 15 -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/answerCallbackQuery" -d "callback_query_id=${cbid}" >/dev/null 2>&1 || true
                    touch "$REQUEST"; echo backup_stop > /tmp/vps-action; break ;;
                  stop_no_backup)
                    [ -n "$cbid" ] && curl -sS --max-time 15 -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/answerCallbackQuery" -d "callback_query_id=${cbid}" >/dev/null 2>&1 || true
                    touch "$REQUEST"; echo stop_no_backup > /tmp/vps-action; break ;;
                  backup_now)
                    [ -n "$cbid" ] && curl -sS --max-time 15 -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/answerCallbackQuery" -d "callback_query_id=${cbid}" >/dev/null 2>&1 || true
                    echo backup_now > /tmp/vps-action ;;
                esac
              done < <(echo "$resp" | jq -c '.result[]?')
            done
          }

          telegram_send "🪟 Starting Dockur Windows 11. RAM=12G CPU=4 DISK=70G. Tailscale IPv4=${TAILSCALE_IP}" || true
          docker rm -f "$CONTAINER" >/dev/null 2>&1 || true
          docker run -d --name "$CONTAINER" --restart=no \
            --stop-timeout 120 \
            --device=/dev/kvm \
            --device=/dev/net/tun \
            --cap-add NET_ADMIN \
            -p 3389:3389/tcp \
            -p 3389:3389/udp \
            -p 8006:8006 \
            -e VERSION=11 \
            -e USERNAME=admin \
            -e PASSWORD="$WINDOWS_PASSWORD" \
            -e RAM_SIZE=12G \
            -e CPU_CORES=4 \
            -e DISK_SIZE=70G \
            -v /opt/windows:/storage \
            ghcr.io/dockur/windows
          docker ps --filter "name=$CONTAINER"
          poller &
          POLLER_PID=$!

          READY=0
          READY_COUNT=0
          START=0
          LAST_HEART=0
          telegram_send '⏳ Waiting for Dockur to report that Windows has started and RDP is ready...' || true
          while [ "$START" -lt 18000 ]; do
            if [ -f /tmp/vps-action ]; then
              action="$(cat /tmp/vps-action 2>/dev/null || true)"
              rm -f /tmp/vps-action "$REQUEST"
              case "$action" in
                backup_now) backup_windows 'Telegram request' || true ;;
                backup_stop) backup_windows 'Telegram stop request'; docker stop -t 120 "$CONTAINER" >/dev/null 2>&1 || true; break ;;
                stop_no_backup) telegram_send '🛑 Stopping Windows without a backup.' || true; docker stop -t 120 "$CONTAINER" >/dev/null 2>&1 || true; break ;;
              esac
              [ -f "$REQUEST" ] && rm -f "$REQUEST"
              touch "$REQUEST"
            fi

            if [ "$READY" -eq 0 ]; then
              if docker logs "$CONTAINER" 2>&1 | grep -Eqi 'Windows started successfully|Windows started succesfully'; then
                if timeout 3 bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/3389' 2>/dev/null; then
                  READY_COUNT=$((READY_COUNT+1))
                else
                  READY_COUNT=0
                fi
                if [ "$READY_COUNT" -ge 6 ]; then
                  READY=1
                  telegram_send "🟢 Windows RDP is READY. Connect to ${TAILSCALE_IP}:3389 as admin." || true
                  send_keyboard
                fi
              else
                READY_COUNT=0
              fi
            fi

            if [ "$READY" -eq 1 ]; then
              if ! docker inspect -f '{{.State.Running}}' "$CONTAINER" 2>/dev/null | grep -q true; then
                telegram_send '⚠️ Windows container stopped.' || true
                break
              fi
              if ! timeout 3 bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/3389' 2>/dev/null; then
                telegram_send '⚠️ RDP connection appears to have closed. Running a safety Windows backup.' || true
                backup_windows 'RDP safety backup' || true
              fi
            fi

            if [ $((START-LAST_HEART)) -ge 60 ]; then
              if [ "$READY" -eq 0 ]; then
                telegram_send "⏳ Windows is still starting... (${START}s elapsed)." || true
              else
                telegram_send "💚 Windows is running. Tailscale=${TAILSCALE_IP}. Next automatic backup in up to 35 minutes." || true
              fi
              LAST_HEART=$START
            fi

            if [ "$READY" -eq 1 ] && [ $((START % 2100)) -eq 0 ] && [ "$START" -gt 0 ]; then
              backup_windows 'automatic 35-minute backup' || true
            fi
            sleep 1
            START=$((START+1))
          done

          rm -f "$REQUEST"
          kill "$POLLER_PID" 2>/dev/null || true
          wait "$POLLER_PID" 2>/dev/null || true
          if docker inspect "$CONTAINER" >/dev/null 2>&1; then
            docker stop -t 120 "$CONTAINER" >/dev/null 2>&1 || true
          fi
          telegram_send '🏁 VPS workflow session finished.' || true
