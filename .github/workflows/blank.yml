name: Continuous Persistent VPS

on:
  workflow_dispatch:

concurrency:
  group: vps-session
  cancel-in-progress: false

env:
  RCLONE_CONFIG_GDRIVE_TYPE: drive
  RCLONE_CONFIG_GDRIVE_SCOPE: drive
  RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.RCLONE_DRIVE_TOKEN }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  WINDOWS_PASSWORD: ${{ secrets.WINDOWS_PASSWORD }}
  TZ: Asia/Kolkata

jobs:
  vps-session:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools and configure Telegram
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y curl jq sudo net-tools iproute2 openssh-server util-linux ca-certificates
          curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone version | head -3

          test -n "$TELEGRAM_BOT_TOKEN" || { echo 'TELEGRAM_BOT_TOKEN is missing'; exit 1; }
          test -n "$TELEGRAM_CHAT_ID" || { echo 'TELEGRAM_CHAT_ID is missing'; exit 1; }
          test -n "$WINDOWS_PASSWORD" || { echo 'WINDOWS_PASSWORD is missing'; exit 1; }
          test -n "${{ secrets.TAILSCALE_AUTHKEY }}" || { echo 'TAILSCALE_AUTHKEY is missing'; exit 1; }

          cat > /tmp/telegram-helper.sh <<'EOF'
          #!/usr/bin/env bash
          telegram_send() {
            local msg="$*"
            local response=''
            local attempt
            for attempt in 1 2 3 4 5; do
              response="$(curl -sS --max-time 25 -X POST \
                "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                -d "chat_id=${TELEGRAM_CHAT_ID}" \
                --data-urlencode "text=$(date '+%I:%M:%S %p') : ${msg}" 2>&1 || true)"
              if echo "$response" | jq -e '.ok == true' >/dev/null 2>&1; then
                return 0
              fi
              sleep 2
            done
            echo "Telegram send failed after retries: ${response}" >&2
            return 1
          }
          EOF
          chmod 700 /tmp/telegram-helper.sh
          source /tmp/telegram-helper.sh

          curl -fsS --max-time 25 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getMe" | jq -e '.ok == true' >/dev/null
          curl -fsS --max-time 25 -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/deleteWebhook" \
            -d 'drop_pending_updates=false' | jq -e '.ok == true' >/dev/null

          telegram_send '🚀 VPS workflow started.'
          telegram_send '🧰 Telegram, Google Drive, Tailscale and Windows configuration checks are starting.'
          telegram_send '✅ Step 1/6 complete.'

      - name: Setup Tailscale with persistent identity
        run: |
          set -Eeuo pipefail
          source /tmp/telegram-helper.sh
          trap 'telegram_send "❌ Tailscale step failed. Check the GitHub Actions log." || true' ERR

          telegram_send '📡 Step 2/6: Installing Tailscale and restoring the persistent node identity...'
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo systemctl stop tailscaled 2>/dev/null || true
          sudo pkill -x tailscaled 2>/dev/null || true
          sudo mkdir -p /var/lib/tailscale /tmp/ts-restore

          TS_BACKUP=''
          while IFS= read -r p; do
            [ -n "$p" ] || continue
            if rclone lsjson "gdrive:${p}" --stat --no-modtime --no-mimetype >/tmp/ts.json 2>/dev/null \
              && jq -e '.Size > 0' /tmp/ts.json >/dev/null 2>&1; then
              TS_BACKUP="$p"
              break
            fi
          done < <(rclone lsf gdrive: --recursive --files-only 2>/dev/null | grep -E '(^|/)tailscale-state\.tar\.gz$' || true)

          if [ -n "$TS_BACKUP" ]; then
            telegram_send '🔄 Previous Tailscale state backup found. Restoring it WITHOUT creating a new node.'
            rclone copyto "gdrive:${TS_BACKUP}" /tmp/ts-restore/tailscale-state.tar.gz --retries 5 --low-level-retries 20
            sudo rm -rf /var/lib/tailscale/*
            sudo tar -xzf /tmp/ts-restore/tailscale-state.tar.gz -C /var/lib/tailscale
            sudo test -s /var/lib/tailscale/tailscaled.state
            sudo chmod 600 /var/lib/tailscale/tailscaled.state
            TS_HAD_BACKUP=1
            telegram_send '✅ Tailscale state restored.'
          else
            TS_HAD_BACKUP=0
            telegram_send '🆕 No Tailscale state backup exists yet. This is the first registration.'
          fi

          sudo systemctl enable tailscaled >/dev/null
          sudo systemctl start tailscaled

          TS_IP=''
          for i in $(seq 1 60); do
            TS_IP="$(tailscale ip -4 2>/dev/null | head -1 || true)"
            if [[ "$TS_IP" =~ ^100\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]]; then break; fi
            sleep 2
          done

          if [[ ! "$TS_IP" =~ ^100\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]]; then
            if [ "$TS_HAD_BACKUP" -eq 1 ]; then
              telegram_send '❌ Restored Tailscale identity did not reconnect. No new authentication will be attempted, so the old IP is not intentionally replaced.'
              exit 1
            fi
            telegram_send '🔐 First-run Tailscale authentication is starting...'
            TS_AUTH_KEY='${{ secrets.TAILSCALE_AUTHKEY }}'
            sudo env TS_AUTH_KEY="$TS_AUTH_KEY" tailscale up --auth-key="$TS_AUTH_KEY" --hostname=biralo --ssh --timeout=90s
            unset TS_AUTH_KEY
          else
            sudo tailscale set --hostname=biralo --ssh 2>/dev/null || true
          fi

          TS_IP=''
          for i in $(seq 1 60); do
            TS_IP="$(tailscale ip -4 2>/dev/null | head -1 || true)"
            if [[ "$TS_IP" =~ ^100\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]]; then break; fi
            sleep 2
          done
          [[ "$TS_IP" =~ ^100\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]] || { telegram_send '❌ Tailscale has no 100.x IPv4 address.'; exit 1; }

          echo "TAILSCALE_IP=$TS_IP" >> "$GITHUB_ENV"
          telegram_send "🌐 Tailscale is online. IPv4: ${TS_IP}"

          # This backup is intentionally done ONCE per workflow run.
          # It is never repeated by the Windows 35-minute backup loop.
          telegram_send '💾 Creating the one-time Tailscale state backup...'
          sudo systemctl stop tailscaled
          sudo test -s /var/lib/tailscale/tailscaled.state
          sudo tar -czf /tmp/tailscale-state.tar.gz -C /var/lib/tailscale tailscaled.state
          sudo systemctl start tailscaled

          TS_TMP="tailscale-state.$(date +%s).tmp.tar.gz"
          rclone copyto /tmp/tailscale-state.tar.gz "gdrive:${TS_TMP}" --ignore-times --retries 5 --low-level-retries 20 --drive-chunk-size 16M
          TS_SIZE="$(rclone lsjson "gdrive:${TS_TMP}" --stat --no-modtime --no-mimetype 2>/dev/null | jq -r '.Size // 0' || echo 0)"
          if [ "$TS_SIZE" -le 0 ]; then
            rclone deletefile "gdrive:${TS_TMP}" >/dev/null 2>&1 || true
            telegram_send '❌ Tailscale backup verification failed.'
            exit 1
          fi
          rclone moveto "gdrive:${TS_TMP}" gdrive:tailscale-state.tar.gz --retries 5 --low-level-retries 20
          sudo rm -f /tmp/tailscale-state.tar.gz 2>/dev/null || true
          sudo rm -rf /tmp/ts-restore 2>/dev/null || true
          telegram_send "✅ One-time Tailscale backup saved and verified (${TS_SIZE} bytes)."
          telegram_send '✅ Step 2/6 complete.'

      - name: Prepare Linux host
        run: |
          set -Eeuo pipefail
          source /tmp/telegram-helper.sh
          trap 'telegram_send "❌ Linux host preparation failed. Check the GitHub Actions log." || true' ERR
          telegram_send '🖥️ Step 3/6: Preparing the Linux host...'

          sudo hostnamectl set-hostname biralo
          if ! id -u biralo >/dev/null 2>&1; then
            sudo useradd -m -s /bin/bash biralo
            echo 'biralo:biralo' | sudo chpasswd
            sudo usermod -aG sudo biralo
            echo 'biralo ALL=(ALL) NOPASSWD:ALL' | sudo tee /etc/sudoers.d/biralo >/dev/null
            sudo chmod 440 /etc/sudoers.d/biralo
          fi

          sudo sed -i 's/^#\?PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/^#\?PermitRootLogin.*/PermitRootLogin no/' /etc/ssh/sshd_config
          sudo systemctl enable ssh >/dev/null
          sudo systemctl restart ssh
          sudo sysctl -w net.ipv4.ip_forward=1 >/dev/null
          sudo sysctl -w net.ipv4.conf.all.rp_filter=2 >/dev/null
          sudo sysctl -w net.ipv4.conf.default.rp_filter=2 >/dev/null

          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache 2>/dev/null || true
          sudo apt-get clean
          docker system prune -af 2>/dev/null || true

          telegram_send "🟢 Linux host ready. Tailscale IPv4: ${TAILSCALE_IP}"
          telegram_send '✅ Step 3/6 complete.'

      - name: Restore Windows backup or create fresh storage
        run: |
          set -Eeuo pipefail
          source /tmp/telegram-helper.sh
          trap 'telegram_send "❌ Windows restore/preparation failed. Check the GitHub Actions log." || true' ERR
          telegram_send '💾 Step 4/6: Looking for the Windows backup on Google Drive...'
          sudo mkdir -p /opt

          WIN_BACKUP=''
          while IFS= read -r p; do
            [ -n "$p" ] || continue
            if rclone lsjson "gdrive:${p}" --stat --no-modtime --no-mimetype >/tmp/win.json 2>/dev/null \
              && jq -e '.Size > 0' /tmp/win.json >/dev/null 2>&1; then
              WIN_BACKUP="$p"
              break
            fi
          done < <(rclone lsf gdrive: --recursive --files-only 2>/dev/null | grep -E '(^|/)windows-backup\.tar\.gz$' || true)

          if [ -n "$WIN_BACKUP" ]; then
            echo 'WINDOWS_MODE=restore' >> "$GITHUB_ENV"
            telegram_send '📦 Windows backup found. Streaming it directly into /opt/windows without making another huge local archive.'
            sudo rm -rf /opt/windows
            set +e
            rclone cat "gdrive:${WIN_BACKUP}" | sudo tar -xzf - -C /opt
            PIPE_STATUS=("${PIPESTATUS[@]}")
            set -e
            RC_RCLONE="${PIPE_STATUS[0]}"
            RC_TAR="${PIPE_STATUS[1]}"
            if [ "$RC_RCLONE" -ne 0 ] || [ "$RC_TAR" -ne 0 ] || [ ! -d /opt/windows ]; then
              telegram_send '❌ Windows backup restore failed. The archive could not be extracted correctly.'
              exit 1
            fi
            telegram_send '✅ Windows backup restored successfully.'
          else
            echo 'WINDOWS_MODE=fresh' >> "$GITHUB_ENV"
            sudo rm -rf /opt/windows
            sudo mkdir -p /opt/windows
            telegram_send '⚠️ No Windows backup found. A fresh Windows 11 installation will start.'
          fi
          telegram_send '✅ Step 4/6 complete.'

      - name: Pull Dockur Windows image
        run: |
          set -Eeuo pipefail
          source /tmp/telegram-helper.sh
          trap 'telegram_send "❌ Dockur image step failed. Check the GitHub Actions log." || true' ERR
          telegram_send '📥 Step 5/6: Pulling the Dockur Windows image...'
          docker pull ghcr.io/dockur/windows
          telegram_send '✅ Dockur Windows image is ready.'
          telegram_send '✅ Step 5/6 complete.'

      - name: Start Windows and run monitor
        run: |
          set -uo pipefail
          source /tmp/telegram-helper.sh
          REQUEST=/tmp/vps-request
          POLLER_PID=''
          CONTAINER=windows
          BACKUP_LOCK=/tmp/windows-backup.lock
          rm -f "$REQUEST" "$BACKUP_LOCK"

          stop_keyboard() {
            curl -sS --max-time 20 -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=$(date '+%I:%M:%S %p') : 🛑 Select an action:" \
              --data-urlencode 'reply_markup={"inline_keyboard":[[{"text":"💾 BACKUP & STOP","callback_data":"backup_stop"}],[{"text":"❌ STOP WITHOUT BACKUP","callback_data":"stop_no_backup"}],[{"text":"📦 BACKUP NOW - KEEP RUNNING","callback_data":"backup_now"}]]}' \
              >/dev/null 2>&1 || true
          }

          poller() {
            local offset=0 init maxid resp update uid chat text cb cbid
            init="$(curl -sS --max-time 20 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getUpdates?limit=100&timeout=0" 2>/dev/null || true)"
            maxid="$(echo "$init" | jq -r '[.result[]?.update_id] | max // -1' 2>/dev/null || echo -1)"
            if [[ "$maxid" =~ ^[0-9]+$ ]]; then offset=$((maxid+1)); fi
            while [ ! -f "$REQUEST" ]; do
              resp="$(curl -sS --max-time 40 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getUpdates?offset=${offset}&timeout=30&limit=50" 2>/dev/null || true)"
              echo "$resp" | jq -e '.ok == true' >/dev/null 2>&1 || { sleep 2; continue; }
              while IFS= read -r update; do
                [ -n "$update" ] || continue
                uid="$(echo "$update" | jq -r '.update_id // empty')"
                [ -n "$uid" ] || continue
                offset=$((uid+1))
                chat="$(echo "$update" | jq -r '.message.chat.id // .callback_query.message.chat.id // empty')"
                [ "$chat" = "$TELEGRAM_CHAT_ID" ] || continue
                text="$(echo "$update" | jq -r '.message.text // empty')"
                cb="$(echo "$update" | jq -r '.callback_query.data // empty')"
                cbid="$(echo "$update" | jq -r '.callback_query.id // empty')"

                case "$text" in
                  /stop|/backup) stop_keyboard ;;
                esac

                case "$cb" in
                  backup_stop|stop_no_backup|backup_now)
                    printf '%s' "$cb" > "$REQUEST"
                    [ -n "$cbid" ] && curl -sS --max-time 10 -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/answerCallbackQuery" \
                      -d "callback_query_id=$cbid" >/dev/null 2>&1 || true
                    break
                    ;;
                esac
              done < <(echo "$resp" | jq -c '.result[]?')
            done
          }

          backup_windows() {
            local reason="${1:-manual}"
            local tmp_remote="windows-backup.$(date +%s).tmp.tar.gz"
            local upload_pid rc size

            if [ -e "$BACKUP_LOCK" ]; then
              telegram_send '⚠️ A Windows backup is already running; this backup request was ignored.' || true
              return 1
            fi
            ( set -o noclobber; echo "$$" > "$BACKUP_LOCK" ) 2>/dev/null || {
              telegram_send '⚠️ A Windows backup is already running.' || true
              return 1
            }

            telegram_send "💾 Windows backup started (${reason}). Windows will be paused during the archive upload."
            if ! docker inspect "$CONTAINER" >/dev/null 2>&1; then
              telegram_send '❌ Windows container does not exist; backup cancelled.' || true
              rm -f "$BACKUP_LOCK"
              return 1
            fi

            docker pause "$CONTAINER" >/dev/null 2>&1 || true
            : > /tmp/windows-backup-upload.log
            (
              set -o pipefail
              tar -C /opt --sparse -czf - windows | rclone rcat "gdrive:${tmp_remote}" --retries 5 --low-level-retries 20 --drive-chunk-size 16M
            ) >/tmp/windows-backup-upload.log 2>&1 &
            upload_pid=$!

            while kill -0 "$upload_pid" 2>/dev/null; do
              sleep 10
            done
            wait "$upload_pid"
            rc=$?

            docker unpause "$CONTAINER" >/dev/null 2>&1 || true

            if [ "$rc" -ne 0 ]; then
              telegram_send '❌ Windows backup upload failed. The previous good backup was kept.' || true
              echo '--- backup upload log ---' >&2
              tail -80 /tmp/windows-backup-upload.log >&2 || true
              rclone deletefile "gdrive:${tmp_remote}" >/dev/null 2>&1 || true
              rm -f "$BACKUP_LOCK"
              return 1
            fi

            size="$(rclone lsjson "gdrive:${tmp_remote}" --stat --no-modtime --no-mimetype 2>/dev/null | jq -r '.Size // 0' || echo 0)"
            if ! [[ "$size" =~ ^[0-9]+$ ]] || [ "$size" -le 0 ]; then
              telegram_send '❌ Windows backup verification failed. The previous good backup was kept.' || true
              rclone deletefile "gdrive:${tmp_remote}" >/dev/null 2>&1 || true
              rm -f "$BACKUP_LOCK"
              return 1
            fi

            if ! rclone moveto "gdrive:${tmp_remote}" gdrive:windows-backup.tar.gz --retries 5 --low-level-retries 20; then
              telegram_send '❌ Windows backup finalization failed. The previous good backup was kept.' || true
              rclone deletefile "gdrive:${tmp_remote}" >/dev/null 2>&1 || true
              rm -f "$BACKUP_LOCK"
              return 1
            fi

            rm -f "$BACKUP_LOCK"
            telegram_send "✅ Windows backup saved and verified (${size} bytes)."
            return 0
          }

          telegram_send "🪟 Starting Dockur Windows 11. Tailscale IPv4: ${TAILSCALE_IP}"
          docker rm -f "$CONTAINER" >/dev/null 2>&1 || true
          sudo mkdir -p /opt/windows

          docker run -d \
            --name "$CONTAINER" \
            --restart=no \
            --stop-timeout 120 \
            --device=/dev/kvm \
            --device=/dev/net/tun \
            --cap-add NET_ADMIN \
            -p 3389:3389/tcp \
            -p 3389:3389/udp \
            -p 8006:8006 \
            -v /opt/windows:/storage \
            -e VERSION=11 \
            -e USERNAME=admin \
            -e PASSWORD="$WINDOWS_PASSWORD" \
            -e RAM_SIZE=12G \
            -e CPU_CORES=4 \
            -e DISK_SIZE=70G \
            ghcr.io/dockur/windows

          poller &
          POLLER_PID=$!

          START_TS=$(date +%s)
          READY=0
          LAST_HEARTBEAT=0
          LAST_LOG=''

          telegram_send '⏳ Windows is booting. I will only announce RDP-ready after Dockur reports Windows started successfully AND port 3389 is reachable repeatedly.'

          while [ $(( $(date +%s) - START_TS )) -lt 18000 ]; do
            if [ -f "$REQUEST" ]; then
              ACTION="$(cat "$REQUEST")"
              rm -f "$REQUEST"
              case "$ACTION" in
                backup_now)
                  backup_windows 'Telegram manual backup' || true
                  ;;
                backup_stop)
                  backup_windows 'Telegram backup & stop' || true
                  docker stop "$CONTAINER" >/dev/null 2>&1 || true
                  telegram_send '🛑 Windows stopped after the backup request.' || true
                  break
                  ;;
                stop_no_backup)
                  docker stop "$CONTAINER" >/dev/null 2>&1 || true
                  telegram_send '🛑 Windows stopped WITHOUT a backup, as requested.' || true
                  break
                  ;;
              esac
            fi

            if [ "$READY" -eq 0 ]; then
              LOGS="$(docker logs --tail 250 "$CONTAINER" 2>&1 || true)"
              if echo "$LOGS" | grep -qiE 'Windows started successfully|Windows started succesfully'; then
                if timeout 5 bash -c '</dev/tcp/127.0.0.1/3389' >/dev/null 2>&1; then
                  OK=0
                  for j in $(seq 1 6); do
                    if timeout 5 bash -c '</dev/tcp/127.0.0.1/3389' >/dev/null 2>&1; then
                      OK=$((OK+1))
                    else
                      OK=0
                    fi
                    sleep 5
                  done
                  if [ "$OK" -eq 6 ]; then
                    READY=1
                    telegram_send "🟢 RDP READY. Connect to ${TAILSCALE_IP}:3389 | user: admin | password: your WINDOWS_PASSWORD secret."
                  fi
                fi
              fi

              if [ "$READY" -eq 0 ] && [ "${WINDOWS_MODE:-fresh}" = 'fresh' ]; then
                NOW=$(date +%s)
                if [ $((NOW-LAST_HEARTBEAT)) -ge 60 ]; then
                  LAST_HEARTBEAT=$NOW
                  PROGRESS="$(echo "$LOGS" | grep -oE '[0-9]{1,3}%[^%]*' | tail -1 || true)"
                  if [ -n "$PROGRESS" ]; then
                    telegram_send "⏳ Windows installation progress: ${PROGRESS}"
                  else
                    telegram_send '⏳ Windows is still installing/booting...'
                  fi
                fi
              fi
            fi

            if [ "$READY" -eq 1 ]; then
              NOW=$(date +%s)
              if [ $((NOW-LAST_HEARTBEAT)) -ge 300 ]; then
                LAST_HEARTBEAT=$NOW
                telegram_send "💚 Windows/RDP session is running. Tailscale: ${TAILSCALE_IP}"
              fi
            fi

            if ! docker inspect "$CONTAINER" >/dev/null 2>&1; then
              telegram_send '❌ Windows container disappeared. Workflow is stopping.' || true
              break
            fi

            if [ "$READY" -eq 1 ] && [ $(( $(date +%s) - START_TS )) -gt 0 ]; then
              ELAPSED=$(( $(date +%s) - START_TS ))
              if [ $((ELAPSED % 2100)) -lt 10 ]; then
                backup_windows 'automatic 35-minute backup' || true
                sleep 15
              fi
            fi

            if [ "$READY" -eq 1 ]; then
              if ! timeout 5 bash -c '</dev/tcp/127.0.0.1/3389' >/dev/null 2>&1; then
                telegram_send '⚠️ RDP port disconnected. Creating a safety backup before continuing.' || true
                backup_windows 'RDP disconnect safety backup' || true
                sleep 20
              fi
            fi

            sleep 5
          done

          rm -f "$REQUEST"
          if [ -n "$POLLER_PID" ]; then
            kill "$POLLER_PID" >/dev/null 2>&1 || true
            wait "$POLLER_PID" >/dev/null 2>&1 || true
          fi

          if docker inspect "$CONTAINER" >/dev/null 2>&1; then
            if [ "${READY:-0}" -eq 1 ]; then
              telegram_send '💾 Final Windows backup is being created before workflow exit.' || true
              backup_windows 'final workflow backup' || true
            fi
            docker stop "$CONTAINER" >/dev/null 2>&1 || true
          fi

          telegram_send "🏁 VPS workflow finished. Tailscale IPv4 was ${TAILSCALE_IP}."

      - name: Final status
        if: always()
        run: |
          source /tmp/telegram-helper.sh 2>/dev/null || true
          if [ "${{ job.status }}" = 'success' ]; then
            telegram_send '✅ GitHub Actions job completed successfully.' || true
          else
            telegram_send '❌ GitHub Actions job ended with an error. Check the Actions log for the exact failing step.' || true
          fi
